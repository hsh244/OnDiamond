  // ================= 진행 =================
  let running = false;
  function simRun(mode) {
    if (running || !S) return;
    running = true;
    const startPhase = S.phase;
    const startDate = SE.currentDate(S);
    const endDate = C.addDays(startDate, 7);
    const totalDays = S.sched.days.length;
    let steps = 0, showBusy = mode === 'season' || mode === 'post' || mode === 'week' || mode === 'pre' || mode === 'preall';
    const busy = $('#busy');
    if (showBusy) { busy.hidden = false; $('#busyT').textContent = mode === 'post' ? '포스트시즌 진행 중' : mode === 'pre' || mode === 'preall' ? '스프링캠프 진행 중' : '경기 진행 중'; }
    function stop() {
      running = false; busy.hidden = true; save(); render();
      if (view !== 'lobby') { /* 그대로 */ }
    }
    function step() {
      const t0 = performance.now();
      while (performance.now() - t0 < 40) {
        if (S.phase === 'done') return stop();
        if (mode === 'next') {
          const before = S.phase;
          const r = SE.advance(S);
          steps++;
          if (!r) return stop();
          if (r.kind === 'day') { const d = S.sched.days[S.dayIdx - 1]; if (d.games.some((g) => g.h === S.user || g.a === S.user)) return stop(); }
          if (r.kind === 'post') { const res = S.results[r.gid]; if (res.h === S.user || res.a === S.user) return stop(); if (steps > 0 && userOutOfPost()) return stop(); }
          if (r.kind === 'post-start' || (before === 'reg' && S.phase !== 'reg')) return stop();
          if (steps > 12) return stop();
        } else if (mode === 'week') {
          if (S.phase !== startPhase) return stop();
          if (SE.currentDate(S) >= endDate) return stop();
          SE.advance(S); steps++;
          if (S.phase !== 'reg') return stop();
        } else if (mode === 'season') {
          if (S.phase !== 'reg') return stop();
          SE.advance(S); steps++;
        } else if (mode === 'preweek') {
          OD.Camp.advanceWeek(S); return stop();
        } else if (mode === 'pre' || mode === 'preall') {
          if (S.phase !== 'pre') return stop();
          SE.advance(S); steps++;
          if (mode === 'pre' || S.phase !== 'pre') { if (S.phase === 'reg') { view = 'lobby'; toast(S.league.year + ' 정규시즌이 개막했습니다.'); } return stop(); }
        } else if (mode === 'post') {
          if (S.phase !== 'post') return stop();
          SE.advance(S); steps++;
        }
      }
      if (showBusy) {
        const frac = mode === 'pre' || mode === 'preall' ? Math.min(1, steps / 4) : mode === 'post' ? Math.min(1, steps / 20) : mode === 'week' ? Math.min(1, steps / 6) : S.dayIdx / totalDays;
        $('#busyBar').style.width = Math.round(frac * 100) + '%';
        $('#busyD').textContent = C.fmtDate(SE.currentDate(S), true);
      }
      setTimeout(step, 0);
    }
    setTimeout(step, 0);
  }

    if (d.amreg) { ui.amReg = d.amreg; keepScroll(render); return; }
    if (d.amlvl) { ui.amLvl = d.amlvl; ui.amReg = 'all'; keepScroll(render); return; }
    if (d.nav) { document.body.classList.remove('menu-open'); closeSheet(); view = navTarget(d.nav); ui.confirmNew = false; render(); window.scrollTo(0, 0); return; }
    if (d.sim) return simRun(d.sim);
    if (d.watch) return watchNext();
    if (d.live) {
      if (!live) return;
      const lv = d.live;
      if (lv === 'pause') { live.paused = true; if (live.timer) clearTimeout(live.timer); live.timer = null; liveDraw(); }
      else if (lv === 'play') { live.paused = false; liveTick(); }
      else if (lv === 'skip') { if (live.timer) clearTimeout(live.timer); live.i = S.logs[live.gid].length; live.timer = null; liveDraw(); }
      else if (lv === 'box') { const g = live.gid; stopLive(); ui.gtab = 'sum'; openSheet(gameSheet(g)); }
      else { setPref('liveSpeed', lv); liveDraw(); }
      return;
    }
    if (d.gtab) { const [k, g] = d.gtab.split(':'); ui.gtab = k; const sc = $('#sheet').scrollTop; openSheet(gameSheet(g)); $('#sheet').scrollTop = sc; return; }
    if (d.futtab) { ui.futTab = d.futtab; render(); return; }
    if (d.reck) { ui.rec.kind = d.reck; ui.rec.sort = ''; ui.rec.limit = 40; render(); return; }
    if (d.sort) { const R = ui.rec; if (R.sort === d.sort) R.dir = -R.dir; else { R.sort = d.sort; const c = REC_COLS[R.kind].find((x) => x[0] === d.sort); R.dir = c && c[4] ? 1 : -1; } render(); return; }
    if (d.recmore) { ui.rec.limit += 40; render(); return; }
    if (d.reclg) { ui.rec.lg = d.reclg; ui.rec.team = 'all'; ui.rec.limit = 40; render(); return; }
    if (d.futteam) { ui.futTeam = d.futteam; render(); window.scrollTo(0, 0); return; }
    if (d.mkt) { ui.mktTab = d.mkt; ui.sheetConfirm = null; render(); return; }
    if (d.tf) { const [k, v] = d.tf.split(':'); ui.trade[k] = v; render(); return; }
    if (d.tsel) {
      const [side, id] = d.tsel.split(':'); const n = Number(id); const arr = ui.trade[side];
      const i = arr.indexOf(n);
      if (i >= 0) arr.splice(i, 1); else if (arr.length < MK.MAX_SIDE) arr.push(n); else toast('한쪽에서 최대 ' + MK.MAX_SIDE + '명까지 고를 수 있습니다.');
      ui.trade.res = null; keepScroll(render); return;
    }
    if (d.tpk) {
      const i0 = d.tpk.indexOf(':'), side = d.tpk.slice(0, i0), key = d.tpk.slice(i0 + 1); const arr = ui.trade[side];
      const i = arr.indexOf(key);
      if (i >= 0) arr.splice(i, 1); else if (arr.length < MK.MAX_SIDE) arr.push(key); else toast('지명권은 한쪽에서 최대 ' + MK.MAX_SIDE + '장까지 고를 수 있습니다.');
      ui.trade.res = null; keepScroll(render); return;
    }
    if (d.tact) {
      const T = ui.trade;
      const pk = { give: T.pgive, get: T.pget };
      if (d.tact === 'clear') { T.give = []; T.get = []; T.pgive = []; T.pget = []; T.res = null; render(); }
      else if (d.tact === 'propose') { T.res = MK.evaluate(S, S.user, T.partner, T.give, T.get, today(), pk); keepScroll(render); }
      else if (d.tact === 'confirm') {
        const ev = MK.evaluate(S, S.user, T.partner, T.give, T.get, today(), pk);
        if (!ev.accept) { T.res = ev; render(); return; }
        MK.executeTrade(S, S.user, T.partner, T.give, T.get, today(), { a: T.pgive, b: T.pget });
        T.give = []; T.get = []; T.pgive = []; T.pget = []; T.res = null; save(); toast('트레이드가 성사됐습니다.'); render();
      }
      return;
    }
    if (d.offer) {
      const [k, id] = d.offer.split(':');
      if (k === 'ok') { const r = MK.acceptOffer(S, Number(id), today()); toast(r.ok ? '트레이드가 성사됐습니다.' : r.msg); }
      else { MK.declineOffer(S, Number(id)); toast('제안을 거절했습니다.'); }
      save(); render(); return;
    }
    if (d.claim) { MK.claimToggle(S, Number(d.claim)); save(); if (!$('#sheet').hidden) openSheet(playerSheet(d.claim)); render(); return; }
    if (d.uso) {
      const [k, id] = d.uso.split(':');
      if (k === 'ask') ui.sheetConfirm = 'uso:' + id;
      else if (k === 'no') ui.sheetConfirm = null;
      else { const r = MK.signFromUso(S, Number(id), today()); ui.sheetConfirm = null; toast(r.ok ? '영입했습니다. 이적료 ' + C.money(r.fee) : r.msg); save(); }
      if (!$('#sheet').hidden) { const sc = $('#sheet').scrollTop; openSheet(playerSheet(id)); $('#sheet').scrollTop = sc; }
      keepScroll(render); return;
    }
    if (d.pact) {
      const [k, id] = d.pact.split(':'); const n = Number(id); const P = S.league.players;
      if (k === 'give' || k === 'get') {
        const T = ui.trade;
        if (k === 'get' && T.partner !== P[n].team) { T.partner = P[n].team; T.get = []; }
        if (!T[k].includes(n) && T[k].length < MK.MAX_SIDE) T[k].push(n);
        T.res = null; closeSheet(); view = 'mkt'; ui.mktTab = 'trade'; render(); window.scrollTo(0, 0); return;
      }
      if (k === 'rel') ui.sheetConfirm = 'rel:' + n;
      else if (k === 'relno') ui.sheetConfirm = null;
      else if (k === 'relyes') { const r = MK.release(S, n, today()); ui.sheetConfirm = null; toast(r.ok ? '방출하고 웨이버 공시했습니다.' : r.msg); save(); render(); }
      if (view === 'off' && $('#sheet').hidden) { keepScroll(render); return; }
      const sc = $('#sheet').scrollTop; openSheet(playerSheet(n)); $('#sheet').scrollTop = sc; return;
    }
    if (d.off) {
      if (d.off === 'start') { OF.startOffseason(S); view = 'off'; }
      else { const r = OF.advanceStep(S); if (!r.ok) toast(r.msg || '넘어갈 수 없습니다'); else if (S.phase === 'reg' || S.phase === 'pre') { view = S.phase === 'pre' ? 'camp' : 'lobby'; toast(S.league.year + ' 시즌 준비를 시작합니다. 스프링캠프 계획을 세우세요.'); } }
      ui.faForm = null; ui.sheetConfirm = null; save(); render(); window.scrollTo(0, 0); return;
    }
    if (d.fa) {
      const [k, id] = d.fa.split(':');
      if (k === 'round') {
        const busy = $('#busy'); busy.hidden = false; $('#busyT').textContent = 'FA 협상 중'; $('#busyBar').style.width = '60%'; $('#busyD').textContent = '';
        setTimeout(() => { const res = OF.runFARound(S) || []; busy.hidden = true; ui.faForm = null; save(); render(); toast(res.length ? res.length + '명이 계약했습니다.' : '이번 라운드에는 계약한 선수가 없습니다.'); }, 30);
        return;
      }
      if (k === 'form') ui.faForm = Number(id);
      else if (k === 'close') ui.faForm = null;
      else if (k === 'cancel') { OF.cancelOffer(S, Number(id)); save(); }
      else if (k === 'send') {
        const yrs = Number($('#faYrs').value), aav = Math.round(parseFloat($('#faAav').value) * 10000);
        const r = OF.userOffer(S, Number(id), aav, yrs);
        if (!r.ok) { toast(r.msg); return; }
        ui.faForm = null; save(); toast('제안했습니다. 라운드를 마감하면 답이 나옵니다.');
      }
      keepScroll(render); return;
    }
    if (d.comp) { const [i, pid] = d.comp.split(':'); const r = OF.chooseComp(S, Number(i), Number(pid) || null); if (!r.ok && r.msg) toast(r.msg); save(); keepScroll(render); return; }
    if (d.fre) { const [k, id] = d.fre.split(':'); OF.decideForeign(S, Number(id), k); save(); keepScroll(render); return; }
    if (d.draft) {
      const [k, id] = d.draft.split(':');
      if (k === 'pick') { OF.draftPick(S, S.user, Number(id)); OF.draftAdvance(S, false); }
      else OF.draftAdvance(S, true);
      save(); keepScroll(render); return;
    }
    if (d.sal) { const [k, id] = d.sal.split(':'); const p = S.league.players[id]; const step = Math.max(500, Math.round(p.nsal * 0.05 / 100) * 100); const v = k === '+' ? p.nsal + step : Math.max(Math.ceil(p.sal * 0.75 / 100) * 100, p.nsal - step); OF.setUserSalary(S, Number(id), v); save(); keepScroll(render); return; }
    if (d.camp) {
      const i = d.camp.indexOf(':');
      const r = OD.Camp.setPlan(S, d.camp.slice(0, i), d.camp.slice(i + 1));
      if (!r.ok) toast(r.msg); else save();
      keepScroll(render); return;
    }
    if (d.coach) {
      const [k, id] = d.coach.split(':');
      if (k === 'role') { ui.coachRole = ui.coachRole === id ? null : id; ui.coachConfirm = null; }
      else if (k === 'ask') ui.coachConfirm = Number(id);
      else if (k === 'no') ui.coachConfirm = null;
      else { const r = FI.hireCoach(S, Number(id), today()); ui.coachConfirm = null; ui.coachRole = null; toast(r.ok ? '코치를 교체했습니다.' : r.msg); save(); }
      keepScroll(render); return;
    }
    if (d.fired) {
      if (d.fired === 'accept') { FI.acceptOffer(S); ui.sqTeam = S.user; save(); toast('새 구단 단장으로 취임했습니다.'); render(); window.scrollTo(0, 0); }
      else if (d.fired === 'new') { ui.firedConfirm = true; render(); }
      else if (d.fired === 'newno') { ui.firedConfirm = false; render(); }
      else if (d.fired === 'newyes') { ui.firedConfirm = false; clearSave(); S = null; showPick(); }
      return;
    }
    if (d.mall) { const m = S.off && S.off.mil; const n = m ? MI.setPlanAll(S, d.mall, m.list) : 0; toast(n + '명의 병역 계획을 정했습니다.'); save(); keepScroll(render); return; }
    if (d.mplan) { const [k, id] = d.mplan.split(':'); const r = MI.setPlan(S, Number(id), k); if (!r.ok && r.msg) toast(r.msg); save(); keepScroll(render); return; }
    if (d.roster) { ui.sheetConfirm = 'rel:' + d.roster; keepScroll(render); return; }
    if (d.gomkt) { view = 'mkt'; ui.mktTab = d.gomkt; if (d.amlvlGo) { ui.amLvl = d.amlvlGo; ui.amReg = 'all'; } render(); window.scrollTo(0, 0); return; }
    if (d.ff) { ui.fFilter = d.ff; render(); return; }
    if (d.nego) {
      const [k, id] = d.nego.split(':');
      if (k === 'open') ui.nego = Number(id);
      else if (k === 'no') ui.nego = null;
      else { const el2 = document.getElementById('nego-' + id); const r = MK.negotiate(S, Number(id), Number(el2 && el2.value), today()); toast(r.msg || (r.ok ? '' : '협상할 수 없습니다')); if (r.ok && (r.res === 'sign' || r.res === 'hijack' || r.res === 'walk')) ui.nego = null; save(); }
      if (!$('#sheet').hidden) { const sc = $('#sheet').scrollTop; openSheet(playerSheet(id)); $('#sheet').scrollTop = sc; }
      keepScroll(render); return;
    }
    if (d.hj) { const r = MK.hijackResolve(S, d.hj === '1', today()); toast(r.msg || ''); save(); if (!$('#sheet').hidden) closeSheet(); keepScroll(render); return; }
    if (d.fsign) {
      const [k, id] = d.fsign.split(':');
      if (k === 'ask') ui.sheetConfirm = 'fsign:' + id;
      else if (k === 'no') ui.sheetConfirm = null;
      else { const r = MK.signForeign(S, S.user, Number(id), today()); ui.sheetConfirm = null; toast(r.ok ? '계약했습니다.' : r.msg); save(); }
      if (!$('#sheet').hidden) { const sc = $('#sheet').scrollTop; openSheet(playerSheet(id)); $('#sheet').scrollTop = sc; }
      keepScroll(render); return;
    }
    if (d.hire) {
      const [k, id] = d.hire.split(':');
      if (k === 'ask') ui.mgrConfirm = Number(id);
      else if (k === 'no') ui.mgrConfirm = null;
      else { const r = MK.hireManager(S, Number(id), today()); ui.mgrConfirm = null; toast(r.ok ? '감독을 교체했습니다.' : r.msg); save(); }
      keepScroll(render); return;
    }
    if (d.inbox) { const m = S.msgs.find((x) => String(x.id) === d.inbox); if (m) { m.read = true; ui.openMsg = m.id; save(); } view = 'inbox'; render(); window.scrollTo(0, 0); return; }
    if (d.msg) { const m = S.msgs.find((x) => String(x.id) === d.msg); if (m) { m.read = true; ui.openMsg = ui.openMsg === m.id ? null : m.id; save(); render(); } return; }
    if (d.player) { ui.sheetConfirm = null; return openSheet(playerSheet(d.player)); }
    if (d.game) { ui.gtab = 'sum'; return openSheet(gameSheet(d.game)); }
    if (d.team) { ui.sqTeam = d.team; ui.sqTab = 'bat'; view = 'squad'; closeSheet(); render(); window.scrollTo(0, 0); return; }
    if (d.ldr) { const [k, v] = d.ldr.split(':'); if (k === 'bat') ui.ldrBat = v; else ui.ldrPit = v; render(); return; }
    if (d.tsort) {
      const [scope, k] = d.tsort.split(':'); ui.sorts = ui.sorts || {};
      const cur = ui.sorts[scope];
      if (k === 'reset') delete ui.sorts[scope];
      else ui.sorts[scope] = cur && cur.k === k ? { k, d: -cur.d } : { k, d: TEXT_KEYS[k] ? 1 : -1 };
      keepScroll(render); return;
    }
    if (d.sqtab) { ui.sqTab = d.sqtab; render(); return; }
    if (d.month) { ui.schMonth = d.month; render(); return; }
    switch (d.act) {
      case 'menu': document.body.classList.toggle('menu-open'); break;
      case 'menu-close': document.body.classList.remove('menu-open'); break;
      case 'pick-back': pick = null; showGate(); break;
      case 'pick-reroll': pick = null; showPick(); break;
      case 'pick-go': if (pick && pick.sel) { const tid = pick.sel; S = pick.S; S.diff = pick.diff || 'normal'; pick = null; SE.startCareer(S, tid); save(); view = 'lobby'; enterGame(); window.scrollTo(0, 0); } break;
      case 'sheet-close': closeSheet(); break;
      case 'new-ask': ui.confirmNew = true; render(); break;
      case 'new-no': ui.confirmNew = false; render(); break;
      case 'new-yes': ui.confirmNew = false; clearSave(); S = null; showPick(); break;
      case 'msgs-readall': { const n = S.msgs.filter((x) => !x.read).length; S.msgs.forEach((x) => { x.read = true; }); save(); keepScroll(render); if (n) toast('메시지 ' + n + '개를 모두 확인했습니다.'); break; }
      case 'export': exportSave(); break;
      case 'cloud-save': cloudPush(true).then((ok) => { if (ok) toast('계정에 저장했습니다.'); }); render(); break;
      case 'cloud-force': CL.conflict = null; cloudPush(true).then((ok) => { if (ok) toast('이 브라우저의 게임으로 계정 저장본을 바꿨습니다.'); }); break;
      case 'cloud-take': (async () => { try { const c = await cloudLoad(); if (c) { c.loadedFrom = CL.meta.t; CL.known = CL.meta.t; CL.conflict = null; S = c; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} view = 'lobby'; enterGame(); toast('계정에 저장된 게임을 불러왔습니다.'); } } catch (e) { toast('계정 저장본을 불러오지 못했습니다.'); } })(); break;
      case 'import': $('#setFile').click(); break;
      case 'to-gate': save(); S = null; showGate(); break;
    }
  });
  document.addEventListener('change', (e) => {
    if (e.target.id === 'sqTeam') { ui.sqTeam = e.target.value; render(); }
    if (e.target.id === 'tPartner') { ui.trade.partner = e.target.value; ui.trade.get = []; ui.trade.res = null; render(); }
    if (e.target.id === 'futTeam') { ui.futTeam = e.target.value; render(); }
    if (e.target.dataset && (e.target.dataset.sreg || e.target.dataset.slvl)) {
      const [k, i] = (e.target.dataset.sreg || e.target.dataset.slvl).split(':');
      if (e.target.dataset.sreg) MK.setScout(S, k, Number(i), e.target.value || null); else MK.setScout(S, k, Number(i), undefined, e.target.value);
      save(); keepScroll(render);
    }
    if (e.target.id === 'recTeam') { ui.rec.team = e.target.value; ui.rec.limit = 40; render(); }
    if (e.target.id === 'recQual') { ui.rec.qual = e.target.checked; ui.rec.limit = 40; render(); }
    if (e.target.id === 'gateFile' || e.target.id === 'setFile') {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      importFile(f, (ok) => { if (ok) { view = 'lobby'; enterGame(); toast('저장 파일을 불러왔습니다.'); } });
      e.target.value = '';
    }
  });
  $('#sheet').addEventListener('click', (e) => { if (e.target.id === 'sheet') closeSheet(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { if (!$('#sheet').hidden) closeSheet(); else document.body.classList.remove('menu-open'); }
  });

  showGate();
})();
</script>

</body>
</html>
