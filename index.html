<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1310">
<title>On Diamond</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Exo+2:ital,wght@1,800;1,900&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 야간 경기장: 짙은 잔디색 바탕, 분필 흰 글자, 전광판 호박색 강조. 왼쪽 메뉴 + 한 열 카드 */
:root {
  --bg: #0d1310;
  --panel: #141c17;
  --panel2: #1a241e;
  --line: #27342c;
  --line2: #34443a;
  --fg: #e8ece4;
  --muted: #8d9b91;
  --dim: #5f6d63;
  --accent: #f0b64a;
  --accent-ink: #1c1406;
  --win: #63c184;
  --loss: #e0705f;
  --warn: #e3a64a;
  --f-display: "Do Hyeon", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --rail: 76px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--f-body); font-size: 14px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
  word-break: keep-all; overflow-wrap: anywhere;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--bg); }
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.dim { color: var(--dim); }
.wi { color: var(--win); } .lo { color: var(--loss); }
h1, h2, h3 { margin: 0; font-weight: 400; text-wrap: balance; }
.disp { font-family: var(--f-display); letter-spacing: 0.01em; }

/* ---------- 버튼 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--line2);
  background: var(--panel2); color: var(--fg); cursor: pointer; font-weight: 600; white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; }
.btn.danger { border-color: var(--loss); color: var(--loss); background: transparent; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13px; border-radius: 8px; }

  position: relative; overflow: hidden; isolation: isolate;
  display: grid; grid-template-rows: 1fr auto; justify-items: center;
  padding: 32px max(16px, env(safe-area-inset-right, 0px)) max(18px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: #020604; color: #eef6f0;
}
.g-bg { position: absolute; inset: 0; z-index: -1; pointer-events: none; }

.g-shade { position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(4,4,4,.92) 0%, rgba(4,4,4,.55) 18%, rgba(4,4,4,.12) 42%, rgba(4,4,4,.32) 68%, rgba(4,4,4,.93) 100%),
              radial-gradient(120% 95% at 50% 50%, transparent 52%, rgba(0,0,0,.75) 100%); }
.g-glow { position: absolute; inset: 0; background: radial-gradient(55% 34% at 50% 44%, rgba(255,255,255,.08), transparent 72%); }
.gate-in { align-self: center; position: relative; width: min(1000px, 100%); display: grid; gap: 26px; justify-items: center; text-align: center; padding-top: 4vh; }
.g-logo { margin: 0; display: flex; align-items: center; justify-content: center; gap: .03em; font-family: "OD Title", "Russo One", "Arial Black", Impact, var(--f-display); font-weight: 400; font-style: normal;
  font-size: clamp(40px, 9vw, 116px); line-height: 1; letter-spacing: .01em; white-space: nowrap; }
.g-word { background: linear-gradient(180deg, #ffffff 0%, #f1f5f1 46%, #b9c6bd 54%, #8e9d93 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: #fff;
  filter: drop-shadow(0 4px 0 rgba(0,0,0,.55)) drop-shadow(0 10px 26px rgba(0,0,0,.6)); }
.g-ball { flex: none; width: .74em; height: .74em; margin-bottom: .02em; transform: rotate(-24deg); filter: drop-shadow(0 6px 14px rgba(0,0,0,.6)) drop-shadow(0 0 18px rgba(255,255,255,.18)); }
.g-ball svg { width: 100%; height: 100%; display: block; }
.gate-btns { display: grid; gap: 10px; width: min(360px, 100%); }
.gate-btns .btn { min-height: 50px; font-size: 16px; letter-spacing: .04em; border-radius: 10px; }

/* ---------- 게임 틀 ---------- */

}

}

.top-team { display: flex; gap: 10px; align-items: center; min-width: 0; }

}

.wrap { max-width: 1060px; margin: 0 auto; display: grid; gap: 16px; }

@media (max-width: 760px) {
  #rail { transform: translateX(-100%); transition: transform .2s ease; width: calc(200px + env(safe-area-inset-left, 0px)); }
  .rail-btn { grid-template-columns: 22px 1fr; justify-items: start; align-items: center; gap: 12px; padding: 12px 14px; font-size: 14px; }
  .rail-btn .dot { top: 50%; right: 14px; transform: translateY(-50%); }

  body.menu-open #rail { transform: none; }

  #menuBtn { display: grid; }

}
@media (prefers-reduced-motion: reduce) { #rail { transition: none; } }

/* ---------- 카드 ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }

.cloud-st { font-weight: 600; color: var(--fg) !important; } .cloud-st.warn { color: var(--loss) !important; }
.readall { flex: none; min-height: 32px; padding: 0 10px; border: 1px solid color-mix(in srgb, var(--accent) 50%, var(--line)); border-radius: 8px; background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }

.tile.todo { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); background: color-mix(in srgb, var(--accent) 6%, var(--panel)); }
.t-goal { font-weight: 600; font-size: 13.5px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

/* ---------- 표 ---------- */
.tbl-wrap { overflow-x: auto; margin: 0 -4px; }

.pname { display: flex; align-items: center; gap: 8px; min-width: 0; }

  background: linear-gradient(100deg, color-mix(in srgb, var(--tc) 55%, var(--panel)) 0%, color-mix(in srgb, var(--tc) 18%, var(--panel)) 45%, var(--panel2) 100%); }

.news { display: grid; }
.nw { display: grid; grid-template-columns: 56px auto 1fr; gap: 10px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.nw:last-child { border-bottom: 0; }
.nw .d { color: var(--muted); font-size: 12px; }
.offer .mv-p { display: flex; flex-wrap: wrap; padding: 6px 0; }
.pf-act { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pf-act .inline-confirm { margin-top: 0; width: 100%; }

/* 외국인·아시아쿼터 */
.scout-note { padding: 10px 12px; border-radius: 9px; background: color-mix(in srgb, var(--accent) 9%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); font-size: 13px; }
.fstat { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: end; justify-content: space-between; }
.fstat .kv { font-size: 13px; }
.plist.tall { max-height: 820px; }
.frow { display: grid; gap: 6px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.frow:last-child { border-bottom: 0; }
.frow-b { display: flex; justify-content: flex-end; }
.prow { grid-template-areas: "n s" "m r" "x x"; }
.prow .pr-x { grid-area: x; font-size: 12px; }
.pre { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; border-color: color-mix(in srgb, var(--accent) 50%, transparent); }

/* 오프시즌 */
.stepper { display: flex; gap: 6px; flex-wrap: wrap; list-style: none; margin: 0; padding: 0; }
.stepper li { display: inline-flex; gap: 6px; align-items: center; min-height: 32px; padding: 0 10px 0 4px; border-radius: 16px; border: 1px solid var(--line2); color: var(--muted); font-size: 12.5px; }
.stepper li .num { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--panel2); font-size: 11.5px; }
.stepper li.done { color: var(--fg); }
.stepper li.done .num { background: var(--win); color: var(--bg); }
.stepper li.cur { border-color: var(--accent); color: var(--fg); font-weight: 600; }
.stepper li.cur .num { background: var(--accent); color: var(--accent-ink); }
.awards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 10px; }
.aw { display: grid; gap: 2px; padding: 12px; border-radius: 10px; background: var(--panel2); }
.aw .mv-p { font-family: var(--f-display); font-size: 20px; padding: 0; }
.faform { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; padding: 10px; border-radius: 9px; background: var(--panel2); }
.faform label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.inp { min-height: 38px; width: 110px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line2); background: var(--bg); color: var(--fg); font: inherit; }
.myoffer { font-size: 12.5px; color: var(--accent); margin-right: auto; align-self: center; }
.frow-b { gap: 8px; flex-wrap: wrap; }
.comp { border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
.nextbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; position: sticky; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); z-index: 5; border-color: var(--line2); box-shadow: 0 6px 24px rgba(0,0,0,0.35); }
.prow.static { cursor: default; }
.prow.static:hover { border-color: transparent; }
.pm { display: inline-flex; gap: 4px; }
.pm .btn { min-width: 34px; padding: 0; }
.nw2 { grid-template-columns: 1fr; }

/* 병역 */
.milsum { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.milsum div { display: grid; justify-items: center; gap: 2px; padding: 12px 6px; border-radius: 10px; background: var(--panel2); }
.milsum b { font-size: 28px; line-height: 1; color: var(--accent); }
.milsum span { font-size: 12px; color: var(--muted); }
.chip:disabled { opacity: 0.4; cursor: default; }

/* 구단 */
.hero-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.hchip { display: inline-flex; gap: 6px; align-items: center; min-height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid var(--line2); background: var(--panel2); color: var(--muted); font-size: 12.5px; cursor: pointer; }
.hchip b { font-family: var(--f-num); color: var(--fg); }
.hchip b.wi { color: var(--win); } .hchip b.lo { color: var(--loss); }
.gauge { display: grid; gap: 6px; }
.gauge-h { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--muted); }
.gauge-h b { font-size: 26px; color: var(--fg); }
.gbar { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
.gbar i { display: block; height: 100%; border-radius: 5px; }
.fin-net { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 12px; border-radius: 10px; background: var(--panel2); margin-bottom: 12px; }
.fin-net b { font-size: 26px; }
.cands { display: grid; gap: 6px; padding: 8px; border-radius: 9px; background: var(--bg); }
.fired { border-color: var(--loss); display: grid; gap: 10px; }
#rail { overflow-y: auto; }

/* 감독 */
.mgr { display: grid; gap: 8px; }
.mgr-h { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.mgr-n { font-family: var(--f-display); font-size: 22px; line-height: 1.2; }
.mgr-t { margin: 4px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; display: grid; gap: 2px; }

/* ---------- 진행 표시 ---------- */
#busy { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; background: rgba(4,6,5,0.75); }
.busy-in { width: min(320px, calc(100% - 32px)); background: var(--panel); border: 1px solid var(--line2); border-radius: 12px; padding: 20px; display: grid; gap: 12px; text-align: center; }
.prog { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .15s; }
#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 90; max-width: calc(100% - 32px); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 13.5px; }

.empty { color: var(--muted); padding: 18px 4px; text-align: center; font-size: 13.5px; }
.inline-confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; padding: 12px; border-radius: 10px; background: color-mix(in srgb, var(--loss) 10%, transparent); border: 1px solid color-mix(in srgb, var(--loss) 40%, transparent); }
.set-row { display: grid; gap: 8px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.set-row:last-child { border-bottom: 0; }
.set-row p { margin: 0; color: var(--muted); font-size: 13px; }
.champ { text-align: center; padding: 22px 16px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); background: radial-gradient(90% 120% at 50% 0%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%), var(--panel); display: grid; gap: 8px; justify-items: center; }
.champ .disp { font-size: 28px; }
.pf-duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:12px;margin-bottom:16px}
.pf-duo .pf-box{padding:12px}
.pf-duo .pos-legend{flex-direction:column;align-items:flex-start;gap:4px;font-size:12px}
.posfield{display:flex;flex-direction:column;align-items:center;gap:10px}
.posfield svg{width:100%;max-width:300px;height:auto;display:block}
.pos-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:13px}
.pos-legend span{display:inline-flex;align-items:center;gap:6px}
.pos-legend i{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; }
.opt { display: grid; gap: 6px; text-align: left; padding: 12px; border-radius: 10px; border: 1px solid var(--line2); background: var(--panel2); color: var(--fg); cursor: pointer; font: inherit; }
.opt:hover:not([disabled]) { border-color: var(--muted); }
.opt.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--panel2)); box-shadow: inset 0 0 0 1px var(--accent); }
.opt[disabled] { cursor: default; opacity: .55; }
.opt.on[disabled] { opacity: 1; }
.opt-h { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; font-size: 15px; }
.opt-h .num { font-size: 13px; color: var(--muted); white-space: nowrap; }
.opt-m { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--muted); }
.opt-m b { color: var(--fg); }
.opt-m b.wi { color: var(--win); } .opt-m b.lo { color: var(--loss); }
.opt-n { font-size: 12.5px; line-height: 1.45; }
.chips-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
.chip[disabled] { cursor: default; opacity: .5; }
.chip.on[disabled] { opacity: 1; }
.inv-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: center; }
.name-cloud { display: flex; flex-wrap: wrap; gap: 2px 4px; }
.name-cloud .mv-p.inv { color: var(--accent); font-weight: 600; }
.sub-h { font-size: 12px; letter-spacing: .1em; color: var(--muted); font-weight: 600; margin: 14px 0 6px; }
ul.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13.5px; }
.diff-pick { margin: 4px 0 18px; display: grid; gap: 8px; }
.diff-pick p { margin: 0; font-size: 13px; }
.prow .qstar { justify-self: end; }
.qstar { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 5px; border: 1px dashed var(--line2); color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.sk { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.sk.on { color: var(--accent); }
.skbar { width: 44px; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; display: inline-block; }
.skbar i { display: block; height: 100%; background: var(--muted); border-radius: 3px; }
.sk.on .skbar i { background: var(--accent); }
.scout-sum { display: grid; gap: 2px; padding: 10px 12px; border-radius: 9px; background: var(--panel2); font-size: 13px; }
.scout-sum .muted { font-size: 12px; }
.scouts { display: grid; gap: 8px; }
.reg-cell { white-space: normal !important; }
.reg-cell small { display: block; font-size: 11.5px; line-height: 1.35; margin-top: 2px; }
.scout-row { display: grid; grid-template-columns: minmax(70px, auto) minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13.5px; }
.scout-row .sel { min-width: 0; }
.scout-row .muted { font-size: 12px; white-space: nowrap; }
.grade { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 20px; padding: 0 6px; border-radius: 5px; font-family: var(--f-num); font-weight: 700; font-size: 12.5px; letter-spacing: .02em; white-space: nowrap; border: 1px solid transparent; justify-self: end; }
.grade.lg { min-width: 44px; height: 30px; font-size: 18px; border-radius: 7px; justify-self: start; }
.grade.gs { background: linear-gradient(135deg, #f5c542, #e09a1a); color: #2a1a00; }
.grade.ga { background: color-mix(in srgb, #3fbf6a 26%, transparent); color: #6fe39a; border-color: color-mix(in srgb, #3fbf6a 55%, transparent); }
.grade.gb { background: color-mix(in srgb, #3f8fd4 22%, transparent); color: #8cc2f0; border-color: color-mix(in srgb, #3f8fd4 50%, transparent); }
.grade.gc { background: color-mix(in srgb, #9aa3ad 16%, transparent); color: var(--fg); border-color: var(--line2); }
.grade.gd { background: color-mix(in srgb, #d0583f 14%, transparent); color: #e7907e; border-color: color-mix(in srgb, #d0583f 40%, transparent); }
.post-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.nego { flex-wrap: wrap; gap: 8px; align-items: center; }
.nego-l { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.nego-in { width: 76px; height: 32px; padding: 0 8px; border-radius: 7px; border: 1px solid var(--line2); background: var(--bg); color: var(--fg); font: inherit; font-family: var(--f-num); }
.hijack { border-color: color-mix(in srgb, var(--loss) 50%, var(--line)); }
.quote { margin: 0 0 10px; padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--panel2); border-radius: 0 8px 8px 0; font-size: 14px; line-height: 1.55; }
.dir-goals li { font-size: 14.5px; }
.dir-res { margin-top: 10px; padding: 9px 12px; border-radius: 8px; font-size: 13px; }
.dir-res.ok { background: color-mix(in srgb, var(--win) 14%, transparent); }
.dir-res.no { background: color-mix(in srgb, var(--loss) 14%, transparent); }
b.wi { color: var(--win); } b.lo { color: var(--loss); }
.nums { display: flex; flex-wrap: wrap; gap: 10px; }
.rnum { display: grid; justify-items: center; gap: 2px; min-width: 72px; padding: 10px; border-radius: 10px; background: var(--panel2); }
.rnum b { font-size: 26px; color: var(--accent); }
.attr .v.rng { font-size: 13.5px; letter-spacing: -.02em; white-space: nowrap; }
.attr .v.hid { display: inline-block; width: 30px; height: 4px; border-radius: 2px; background: var(--line); }
</style>

    { let best = null, bv = -99; for (const p of bats) { if (used.has(p.id)) continue; const v = LG.batValue(p) + plat(p) - (rest.has(p.id) ? 4 : 0); if (v > bv) { bv = v; best = p; } } if (best) { used.add(best.id); slots.push({ id: best.id, pos: 'DH' }); } }
    // 타순
    const info = slots.map((s) => {
      const b = P[s.id].br;
      return { s, obp: b.eye * 0.5 + b.con * 0.5, pw: b.pow * 0.7 + b.gap * 0.3, ovr: LG.batValue(P[s.id]), spd: b.spd };
    });
    const order = [];
    const take = (fn) => { let bi = -1, bv = -1e9; info.forEach((x, i) => { if (!x.used && fn(x) > bv) { bv = fn(x); bi = i; } }); info[bi].used = 1; order.push(info[bi].s); };
    take((x) => x.obp + x.spd * 0.35);
    take((x) => x.ovr + x.obp * 0.2);
    take((x) => x.ovr + x.pw * 0.2);
    take((x) => x.pw + x.ovr * 0.3);
    take((x) => x.pw + x.ovr * 0.4);
    while (order.length < info.length) take((x) => x.ovr);
    return order;
  }

  function rpAvailable(p, cal) {
    if (!p || p.inj) return false;
    const u = p.use || [];
    let d1 = 0, d2 = 0, last3 = 0;
    for (const [d, np] of u) {
      if (d === cal - 1) d1 += np;
      if (d === cal - 2) d2 += np;
      if (d >= cal - 3) last3 += np;
    }
    if (d1 && d2) return false;
    if (d1 > 30) return false;
    if (last3 > 60) return false;
    return true;
  }

  // ================= 경기 =================
  function simGame(L, homeId, awayId, opt) {
    const rng = opt.rng, cal = opt.cal, post = !!opt.post;
    const SK = opt.sk || (post ? 'pst' : 'st');
    const P = L.players;
    const T = (id) => L.teams.find((t) => t.id === id);
    const home = opt.home || T(homeId), away = opt.away || T(awayId);
    const hrf = home.hrf || 1;
    if (SK !== 'st') for (const t of [home, away]) for (const id of t.entry) if (!P[id][SK]) P[id][SK] = LG.blankStats();

    function makeSide(t, opp) {
      const sp = pickStarter(L, t, cal);
      const s = { t, tid: t.id, lineup: null, bi: 0, runs: 0, hits: 0, errs: 0, line: [], pitcher: sp.id, pc: 0, apps: [], usedP: new Set([sp.id]) };
      s.sp = sp;
      return s;
    }
    const H = makeSide(home), A = makeSide(away);
    H.lineup = makeLineup(L, home, rng, A.sp.throws);
    A.lineup = makeLineup(L, away, rng, H.sp.throws);
    for (const s of [H, A]) {
      let def = 0, w = 0;
      for (const x of s.lineup) { const d = LG.POS_DEF[x.pos] || 0; if (!d) continue; def += r10(LG.posRating(P[x.id], x.pos)) * d; w += d; }
      s.def = (w ? def / w : 0) + (((s.t.staff && s.t.staff.def && s.t.staff.def.r) || 10) - 10) * 0.01;
      s.posOf = {}; for (const x of s.lineup) s.posOf[x.id] = x.pos;
      s.catcher = P[(s.lineup.find((x) => x.pos === 'C') || s.lineup[0]).id];
    }

    // 게임 기록
    const box = {}; // pid -> line
    const bl = (id) => box[id] || (box[id] = { ab: 0, r: 0, h: 0, rbi: 0, bb: 0, so: 0, hr: 0, d: 0, t: 0, sb: 0, cs: 0, hbp: 0, sf: 0, gdp: 0, e: 0 });
    const pl = {}; // pid -> pitching line
    const pline = (id) => pl[id] || (pl[id] = { outs: 0, h: 0, r: 0, er: 0, bb: 0, so: 0, hr: 0, bf: 0, np: 0, hbp: 0 });
    const hrs = [];

    function startApp(side, p, starter) {
      side.pitcher = p.id; side.pc = 0;
      const lead = side === H ? H.runs - A.runs : A.runs - H.runs;
      side.app = { id: p.id, start: starter, entryLead: lead, outs: 0, runs: 0, limit: 0, inn0: inning };
      if (starter) side.app.limit = 70 + p.pr.sta * 2 + rng.int(-6, 6) + ((side.t.mgr && side.t.mgr.pit) || 0) * 8;
      else side.app.limit = 14 + p.pr.sta * 1.6 + rng.int(-3, 4);
      side.apps.push(side.app);
      side.usedP.add(p.id);
      pline(p.id);
    }

    let inning = 1;
    // ---- 문자 중계 기록 (우리 구단 경기만) ----
    const LOG = opt.log ? [] : null;
    const trng = LOG ? new C.RNG((rng.s ^ 0x9e3779b9) >>> 0) : null; // 문구용 난수 (경기 결과에 영향 없음)
    const gs = { outs: 0, mask: 0, top: 1 };
    const ev = (kind, text) => { if (LOG) LOG.push([kind, text, A.runs, H.runs, gs.outs, gs.mask, inning, gs.top]); };
    const tp = (arr) => arr[Math.floor(trng.next() * arr.length)];
    startApp(H, H.sp, true);
    startApp(A, A.sp, true);

    // 승리·패전 후보
    const dec = { win: { [homeId]: null, [awayId]: null }, lose: { [homeId]: null, [awayId]: null } };

    function chooseReliever(side, lead, inn, longNeeded) {
      const t = side.t;
      const avail = t.pen.map((id) => P[id]).filter((p) => p && !side.usedP.has(p.id) && rpAvailable(p, cal));
      if (!avail.length) {
        // 비상: 선발 중 가장 오래 쉰 투수
        const em = t.rot.map((id) => P[id]).filter((p) => p && !side.usedP.has(p.id) && (p.lastStart == null || cal - p.lastStart >= 3));
        if (em.length) return em[0];
        return null;
      }
      const closer = avail.find((p) => p.id === t.closer);
      const setups = avail.filter((p) => t.setup.includes(p.id));
      const mids = avail.filter((p) => p.id !== t.closer && !t.setup.includes(p.id));
      const byVal = (arr) => arr.slice().sort((a, b) => rpValue(b) - rpValue(a));
      if (longNeeded) {
        const lg = avail.filter((p) => p.id !== t.closer && !t.setup.includes(p.id)).sort((a, b) => b.pr.sta - a.pr.sta);
        if (lg.length) return lg[0];
      }
      if (inn >= 9 && lead >= 1 && lead <= 3 && closer) return closer;
      if (inn >= 9 && lead === 0 && (post || side === H) && closer) return closer;
      if (inn >= 7 && lead >= 1 && lead <= 3 && setups.length) return byVal(setups)[0];
      if (inn >= 8 && lead === 0 && setups.length) return byVal(setups)[0];
      if (post && inn >= 7 && lead >= -1 && lead <= 4) { const b = byVal(avail.filter((p) => p.id !== t.closer)); if (b.length) return b[0]; }
      if (Math.abs(lead) >= 5 && mids.length) return byVal(mids)[mids.length - 1];
      if (mids.length) { const m = byVal(mids); return m[Math.min(m.length - 1, rng.int(0, 2))]; }
      if (setups.length) return setups[0];
      return avail[0];
    }

    // 수비 쪽 투수 교체 판단 (이닝 시작 or 타석 사이)
    function checkPitcher(def, between) {
      const app = def.app, p = P[def.pitcher];
      const lead = def === H ? H.runs - A.runs : A.runs - H.runs;
      let pull = false, longNeeded = false;
      if (app.start) {
        if (def.pc >= app.limit + (between ? 12 : 0)) pull = true;
        else if (!between && def.pc >= app.limit - 10 && inning >= 6) pull = true;
        else if (app.runs >= 7 || (app.runs >= 5 && inning >= 4 && between)) pull = true;
        else if (!between && inning >= 7 && app.runs >= 4) pull = true;
        if (pull && inning <= 5) longNeeded = true;
      } else {
        if (def.pc >= app.limit + (between ? 10 : 0)) pull = true;
        else if (!between && app.outs >= 3 && !app.long) pull = true;
        else if (!between && app.long && (app.outs >= 9 || def.pc >= app.limit)) pull = true;
        else if (between && app.runs >= 3 && app.outs < 3) pull = true;
        if (!between && app.outs >= 3 && def.pitcher === def.t.closer && inning >= 9 && lead <= 0) pull = true;
      }
      if (!pull) return;
      const np = chooseReliever(def, lead, inning, longNeeded);
      if (!np) return; // 남은 투수가 없으면 계속 던짐
      def.usedP.add(np.id);
      ev('sub', '투수 교체: ' + p.name + ' → ' + np.name + (def.t.closer === np.id ? ' (마무리)' : ''));
      startApp(def, np, false);
      if (longNeeded) { def.app.long = true; def.app.limit = Math.max(def.app.limit, 30 + np.pr.sta * 2); }
    }

    // 주자 객체: {id, ue (비자책), resp (책임 투수)}
    function playHalf(off, def, top) {
      const half = { runs: 0, outs: 0 };
      let bases = [null, null, null];
      let outs = 0;
      gs.outs = 0; gs.mask = 0; gs.top = top ? 1 : 0;
      ev('inn', inning + '회' + (top ? '초' : '말') + ' ' + off.t.name + ' 공격');
      checkPitcher(def, false);
      const line = off.line;
      const mask = () => (bases[0] ? 1 : 0) | (bases[1] ? 2 : 0) | (bases[2] ? 4 : 0);
      const sync = () => { gs.outs = outs; gs.mask = mask(); };
      let scorers = [];
      line.push(0);
      const li = line.length - 1;

      function score(run, batterId, rbi) {
        if (!run) return;
        off.runs++; line[li]++; half.runs++;
        if (LOG) scorers.push(P[run.id].name);
        bl(run.id).r++;
        const st = P[run.id][SK]; st.r++;
        const rp = pline(run.resp); rp.r++; if (!run.ue) rp.er++;
        const rpp = P[run.resp][SK]; rpp.pr++; if (!run.ue) rpp.er++;
        const app = def.apps.find((a) => a.id === run.resp && a === def.app) || def.app;
        app.runs++;
        if (rbi && batterId) { bl(batterId).rbi++; P[batterId][SK].rbi++; }
        // 리드 변화 기록
        const offLead = off.runs - def.runs;
        if (offLead === 1) { // 방금 리드를 잡음
          dec.win[off.tid] = off.pitcher;
          dec.lose[def.tid] = run.resp;
        }
      }
      function outRec(n) {
        for (let i = 0; i < n; i++) { pline(def.pitcher).outs++; P[def.pitcher][SK].outs++; def.app.outs++; }
        outs += n;
      }

      while (outs < 3) {
        // 끝내기: 9회 이후 말 공격에서 앞서면 종료
        if (!top && inning >= 9 && H.runs > A.runs) break;
        const slot = off.lineup[off.bi % 9];
        const b = P[slot.id], p = P[def.pitcher];
        // 도루 시도
        if (bases[0] && !bases[1] && outs < 2) {
          const r = P[bases[0].id];
          const want = Math.min(0.26, Math.max(0, r.br.spd - 8) * TUNE.sbTry * (1 + (r.br.run - 10) * 0.05));
          if (rng.chance(want)) {
            const cat = def.catcher;
            const ok = clamp(0.67 + (r.br.run - 10) * 0.025 + (r.br.spd - 12) * 0.015 - ((cat.br.cs || 8) - 10) * 0.025, 0.35, 0.9);
            if (rng.chance(ok)) { bases[1] = bases[0]; bases[0] = null; bl(r.id).sb++; r[SK].sb++; sync(); ev('sb', r.name + ' 2루 도루 성공'); }
            else { bases[0] = null; bl(r.id).cs++; r[SK].cs++; outRec(1); sync(); ev('cs', r.name + ' 2루 도루 실패, 아웃'); if (outs >= 3) break; }
          }
        }
        const res = plateAppearance(b, p, def, off === H);
        // 투구 수
        let np = res === 'K' ? 4.8 : res === 'BB' ? 5.7 : res === 'HBP' ? 2.9 : 3.5;
        np = Math.max(1, Math.round(np + rng.normal(0, 1.4)));
        def.pc += np;
        const pp = pline(def.pitcher); pp.np += np; pp.bf++;
        const ps = p[SK]; ps.np += np; ps.bf++;
        const bs = b[SK], bb = bl(b.id);
        bs.pa++;
        const runner = { id: b.id, ue: false, resp: def.pitcher };
        const order = (off.bi % 9) + 1;
        off.bi++;
        scorers = [];
        let desc = '', kind = 'out';
        switch (res) {
          case 'K':
            bs.ab++; bs.so++; bb.ab++; bb.so++; pp.so++; ps.pso++; outRec(1);
            if (LOG) { desc = trng.next() < 0.3 ? '루킹 삼진' : '헛스윙 삼진'; kind = 'k'; }
            break;
          case 'BB': case 'HBP': {
            if (res === 'BB') { bs.bb++; bb.bb++; pp.bb++; ps.pbb++; } else { bs.hbp++; bb.hbp++; pp.hbp++; ps.phbp++; }
            if (bases[0]) { if (bases[1]) { if (bases[2]) score(bases[2], b.id, true); bases[2] = bases[1]; } bases[1] = bases[0]; }
            bases[0] = runner;
            if (LOG) { desc = res === 'BB' ? (bases[1] && bases[2] && scorers.length ? '밀어내기 볼넷' : '볼넷') : '몸에 맞는 공'; kind = 'bb'; }
            break;
          }
          case 'HR': {
            bs.ab++; bs.h++; bs.hr++; bb.ab++; bb.h++; bb.hr++; pp.h++; pp.hr++; ps.ph++; ps.phr++;
            off.hits++;
            for (let i = 2; i >= 0; i--) if (bases[i]) { score(bases[i], b.id, true); bases[i] = null; }
            score(runner, b.id, true);
            hrs.push(b.id);
            if (LOG) { const n = scorers.length; desc = tp(['좌측', '좌중간', '가운데', '우중간', '우측']) + ' 담장 넘기는 ' + (n === 4 ? '만루 홈런' : n === 1 ? '솔로 홈런' : n + '점 홈런') + ' (시즌 ' + bs.hr + '호)'; kind = 'hr'; }
            break;
          }
          case '1B': case '2B': case '3B': {
            bs.ab++; bs.h++; bb.ab++; bb.h++; pp.h++; ps.ph++; off.hits++;
            if (res === '2B') { bs.d++; bb.d++; } if (res === '3B') { bs.t++; bb.t++; }
            const sp = (r) => r10(P[r.id].br.spd);
            if (res === '1B') {
              if (bases[2]) { score(bases[2], b.id, true); bases[2] = null; }
              if (bases[1]) { if (rng.chance(clamp(0.6 + 0.2 * sp(bases[1]) - (outs === 2 ? -0.15 : 0), 0.3, 0.92))) score(bases[1], b.id, true); else bases[2] = bases[1]; bases[1] = null; }
              if (bases[0]) { if (!bases[2] && rng.chance(clamp(0.27 + 0.13 * sp(bases[0]), 0.08, 0.5))) bases[2] = bases[0]; else bases[1] = bases[0]; bases[0] = null; }
              bases[0] = runner;
            } else if (res === '2B') {
              if (bases[2]) { score(bases[2], b.id, true); bases[2] = null; }
              if (bases[1]) { score(bases[1], b.id, true); bases[1] = null; }
              if (bases[0]) { if (rng.chance(clamp(0.42 + 0.2 * sp(bases[0]) + (outs === 2 ? 0.15 : 0), 0.15, 0.85))) score(bases[0], b.id, true); else bases[2] = bases[0]; bases[0] = null; }
              bases[1] = runner;
            } else {
              for (let i = 2; i >= 0; i--) if (bases[i]) { score(bases[i], b.id, true); bases[i] = null; }
              bases[2] = runner;
            }
            if (LOG) {
              kind = 'hit';
              if (res === '1B') desc = tp(['좌전', '중전', '우전', '좌전', '우전', '중전', '유격수 쪽 내야', '3루수 쪽 내야']) + ' 안타';
              else if (res === '2B') desc = tp(['좌중간', '우중간', '좌익선상', '우익선상', '중견수 키 넘기는']) + ' 2루타';
              else desc = tp(['우중간', '좌중간', '우익선상']) + ' 3루타';
            }
            break;
          }
          case 'E': {
            bs.ab++; bb.ab++; def.errs++;
            runner.ue = true;
            if (bases[2]) { score(Object.assign({}, bases[2], { ue: true }), null, false); bases[2] = null; }
            if (bases[1]) { bases[2] = bases[1]; bases[1] = null; }
            if (bases[0]) { bases[1] = bases[0]; bases[0] = null; }
            bases[0] = runner;
            if (LOG) { desc = tp(['유격수', '3루수', '2루수', '1루수']) + ' 실책으로 출루'; kind = 'err'; }
            break;
          }
          case 'GB': {
            const fld = LOG ? tp(['유격수', '2루수', '3루수', '1루수', '유격수', '2루수', '투수']) : '';
            bs.ab++; bb.ab++;
            if (bases[0] && outs < 2 && rng.chance(clamp(0.5 - 0.18 * r10(b.br.spd) + 0.1 * def.def, 0.2, 0.75))) {
              bs.gdp++; bb.gdp++;
              bases[0] = null;
              if (LOG) desc = fld + ' 앞 병살타';
              outRec(2);
              if (outs < 3) { if (bases[2]) { score(bases[2], null, false); bases[2] = null; } if (bases[1]) { bases[2] = bases[1]; bases[1] = null; } }
            } else {
              outRec(1);
              if (outs < 3) {
                if (bases[0]) { // 포스 상황: 주자들이 밀려 나감
                  const fc = rng.chance(0.3); // 선행 주자 2루 아웃, 타자 1루
                  if (LOG && fc) desc = fld + ' 앞 땅볼, 선행 주자 2루에서 아웃';
                  if (bases[1]) { if (bases[2]) score(bases[2], b.id, true); bases[2] = bases[1]; }
                  bases[1] = fc ? null : bases[0];
                  bases[0] = fc ? runner : null;
                } else {
                  if (bases[2] && rng.chance(0.5)) { score(bases[2], b.id, true); bases[2] = null; }
                  if (bases[1] && !bases[2] && rng.chance(0.55)) { bases[2] = bases[1]; bases[1] = null; }
                }
              }
            }
            if (LOG && !desc) desc = fld + ' 땅볼';
            break;
          }
          case 'FB': {
            // 내야 뜬공(포수·내야수)이면 주자가 태그업할 수 없음 → 희생플라이는 외야 뜬공에서만
            const ifl = rng.chance(0.22);
            outRec(1);
            if (!ifl && outs < 3 && bases[2] && rng.chance(clamp(0.6 + 0.2 * r10(P[bases[2].id].br.spd), 0.3, 0.9))) {
              bs.sf++; bb.sf++; score(bases[2], b.id, true); bases[2] = null;
            } else { bs.ab++; bb.ab++; }
            if (!ifl && outs < 3 && bases[1] && !bases[2] && rng.chance(0.26)) { bases[2] = bases[1]; bases[1] = null; }
            const fld = LOG ? tp(ifl ? ['2루수', '유격수', '3루수', '1루수', '포수', '2루수', '유격수'] : ['좌익수', '중견수', '우익수']) : '';
            if (LOG) desc = fld + (scorers.length ? ' 희생플라이' : ifl && fld === '포수' && trng.next() < 0.5 ? ' 파울 플라이' : ' 뜬공');
            break;
          }
          default: // LD 아웃
            bs.ab++; bb.ab++; outRec(1);
            if (LOG) desc = tp(['유격수', '2루수', '3루수', '1루수', '좌익수', '중견수', '우익수']) + ' 직선타';
        }
        if (LOG) {
          sync();
          if (res === 'HR') scorers = scorers.slice(0, -1); // 홈런 타자 본인은 빼고
          if (scorers.length && (kind === 'out' || kind === 'k')) kind = 'run';
          ev(kind, order + '번 ' + b.name + ' : ' + desc + (scorers.length ? ' — ' + scorers.join(', ') + ' 홈인' : ''));
        }
        if (outs < 3) checkPitcher(def, true);
      }
      return half;
    }

    function plateAppearance(b, p, def, isHome) {
      const br = b.br, pr = p.pr;
      const r10 = (x) => C.r10(x) * TUNE.spread;
      // 피로
      const lim = def.app.limit, pc = def.pc;
      const fat = Math.max(0, (pc - lim * 0.85) / (lim * 0.35));
      const pen = Math.min(0.55, fat * 0.4);
      const stf = r10(pr.stf) - pen, ctl = r10(pr.ctl) - pen * 0.8, mov = r10(pr.mov) - pen * 0.6;
      const same = b.bats !== 'S' && b.bats === p.throws;
      const plat = same ? 1 : 0;
      const off = def === H ? A : H;
      const cr = (t, k) => (t.staff && t.staff[k] && t.staff[k].r) || 10;
      const tacD = (((off.t.mgr && off.t.mgr.tac) || 10) - ((def.t.mgr && def.t.mgr.tac) || 10)) * 0.0015 + (cr(off.t, 'bat') - 10) * 0.0006 - (cr(def.t, 'pit') - 10) * 0.0006;
      // 난이도: 우리 구단이 상대보다 강하면 우리 타석에 불리함(opt.hcap = {tid, h})

    const st = SE().standings(S);
    const games = st.reduce((a, x) => a + x.r.w + x.r.l + x.r.t, 0) / st.length;
    const t = team(S, tid);
    const rank = games >= 20 ? st.findIndex((x) => x.t.id === tid) + 1 : t.pred;
    return rank <= 4 ? 'win' : rank >= 8 ? 'build' : 'mid';
  }
  function valueFor(S, p, tid, mode) {
    let v = baseValue(p);
    mode = mode || teamMode(S, tid);
    if (mode === 'win') { v *= 1 + Math.max(0, p.ca - 11) * 0.03; if (p.age <= 23 && p.ca < 10) v *= 0.85; }
    if (mode === 'build') { if (p.age <= 24) v *= 1.2; if (p.age >= 31) v *= 0.75; }
    return v;
  }
  // 받는 팀에서 이 선수가 주전급인지 (같은 포지션 최고 선수와 비교)
  function needFactor(S, p, tid, leaving) {
    const ps = roster(S, tid).filter((x) => !leaving.includes(x.id) && !!x.pr === !!p.pr);
    let better;
    if (p.pr) {
      const same = ps.filter((x) => (x.role === 'SP') === (p.role === 'SP'));
      better = same.filter((x) => x.ca >= p.ca).length;
      const slots = p.role === 'SP' ? 5 : 8;
      return better < slots ? 1.15 : better < slots + 4 ? 1 : 0.8;
    }
    const same = ps.filter((x) => x.pos === p.pos || (x.posR && x.posR[p.pos] >= 14));
    better = same.filter((x) => x.ca >= p.ca).length;
    return better === 0 ? 1.2 : better === 1 ? 1 : 0.8;
  }
  // 내보내는 선수가 핵심(1군 주전·선발 로테이션)이면 더 아까워함
  function coreFactor(S, p) {
    const t = team(S, p.team);
    if (!t || !t.entry) return 1;
    if (t.rot && t.rot.includes(p.id)) return 1.25;
    if (t.closer === p.id) return 1.2;
    if (p.ent && !p.pr && p.ca >= 11) return 1.2;
    return 1;
  }


  // ================= 신인 지명권 =================
  // 키: '드래프트 연도-원래 구단-라운드' (예: 2028-SGM-1). S.picks[키] = 지금 가진 구단 (트레이드된 것만 기록)
  const PICK_ROUNDS = 5;
  const PICK_CURVE = [[1, 222], [3, 183], [5, 146], [8, 132], [10, 121], [13, 109], [16, 104], [20, 79], [26, 73], [30, 66], [36, 59], [40, 58], [50, 43], [60, 33], [80, 21], [110, 8]];
  function pickParse(key) { const [y, orig, r] = key.split('-'); return { y: Number(y), orig, r: Number(r) }; }
  function pickOwner(S, key) { return (S.picks && S.picks[key]) || pickParse(key).orig; }
  function pickYears(S) {
    const held = S.phase === 'off' && S.off && S.off.draft;
    const d0 = S.league.year + (held ? 2 : 1);
    return [d0, d0 + 1];
  }
  function pickList(S, tid) {
    const out = [];
    for (const y of pickYears(S)) for (let r = 1; r <= PICK_ROUNDS; r++) for (const t of S.league.teams) {
      const key = y + '-' + t.id + '-' + r;
      if (pickOwner(S, key) === tid) out.push(key);
    }
    return out;
  }
  // 원래 구단의 예상 순위 → 예상 순번 (하위 팀부터 지명)
  function pickRank(S, orig) {
    if ((S.phase === 'off' || S.phase === 'done') && S.final) return S.final.indexOf(orig) + 1;
    const st = SE().standings(S);
    const games = st.reduce((a, x) => a + x.r.w + x.r.l + x.r.t, 0) / st.length;
    return games >= 20 ? st.findIndex((x) => x.t.id === orig) + 1 : team(S, orig).pred;
  }
  function pickSlot(S, key) {
    const k = pickParse(key), n = S.league.teams.length;
    const near = k.y === pickYears(S)[0];
    const slot = near ? n + 1 - pickRank(S, k.orig) : (n + 1) / 2;
    return { near, slot, overall: (k.r - 1) * n + slot };
  }
  function curve(n) {
    for (let i = 1; i < PICK_CURVE.length; i++) {
      const [a, va] = PICK_CURVE[i - 1], [b, vb] = PICK_CURVE[i];
      if (n <= b) return va + (vb - va) * (n - a) / (b - a);
    }
    return 8;
  }
  // 지명권 가치: 그 순번에서 뽑힐 선수의 평균 가치 × 불확실성, 먼 해는 더 깎고, 리빌딩 팀은 더 쳐줌
  function pickValue(S, key, tid, mode) {
    const ps = pickSlot(S, key);
    mode = mode || teamMode(S, tid);
    return curve(ps.overall) * 0.55 * (ps.near ? 1 : 0.85) * (mode === 'build' ? 1.25 : mode === 'win' ? 0.8 : 1);
  }
  function pickLabel(S, key, short) {
    const k = pickParse(key), ps = pickSlot(S, key);
    const own = pickOwner(S, key);
    const base = k.y + ' ' + k.r + '라운드';
    if (short) return base + (own !== k.orig ? ' (' + team(S, k.orig).name + ')' : '');
    return base + (ps.near ? ' · 예상 ' + Math.round(ps.slot) + '순위' : '') + (own !== k.orig ? ' · 원래 ' + team(S, k.orig).name + ' 지명권' : '');
  }
  function movePicks(S, keys, to) {
    S.picks = S.picks || {};
    for (const key of keys) { if (pickParse(key).orig === to) delete S.picks[key]; else S.picks[key] = to; }
  }

  // ================= 트레이드 =================
  function tradeOpen(S, date) {
    if (S.phase === 'off') return S.off && S.off.step !== 'review';
    if (S.phase === 'pre') return true;
    if (S.phase !== 'reg') return false;
    return date <= deadline(S.league.year);
  }
  function countAfter(S, tid, out, inn) { return roster(S, tid).length - out.length + inn.length; }
  function posCheck(S, tid, out, inn) {
    const ps = roster(S, tid).filter((p) => !out.includes(p.id)).concat(inn.map((id) => S.league.players[id]));
    const cs = ps.filter((p) => p.pos === 'C').length;
    const sp = ps.filter((p) => p.pr && p.role === 'SP').length;
    if (cs < 2) return '포수가 2명보다 적어집니다';
    if (sp < 5) return '선발 투수가 5명보다 적어집니다';
    return null;
  }
  // 상대 구단(aiId)이 이 트레이드를 받아들일지: give = 우리가 보내는 선수, get = 우리가 받는 선수
  function evaluate(S, userId, aiId, give, get, date, pk) {
    const P = S.league.players;
    const notes = [];
    const problems = [];
    const pkG = (pk && pk.give) || [], pkT = (pk && pk.get) || [];
    if (!give.length && !get.length && !pkG.length && !pkT.length) problems.push('선수나 지명권을 골라 주세요');
    if (pkG.length > MAX_SIDE || pkT.length > MAX_SIDE) problems.push('지명권은 한쪽에서 최대 ' + MAX_SIDE + '장까지 주고받을 수 있습니다');
    for (const k of pkG) if (pickOwner(S, k) !== userId) problems.push(pickLabel(S, k, true) + ' 지명권은 우리 구단 것이 아닙니다');
    for (const k of pkT) if (pickOwner(S, k) !== aiId) problems.push(pickLabel(S, k, true) + ' 지명권은 상대 구단 것이 아닙니다');
    const yrs = pickYears(S); for (const k of pkG.concat(pkT)) if (!yrs.includes(pickParse(k).y)) problems.push('지금은 거래할 수 없는 지명권입니다');
    if (give.length > MAX_SIDE || get.length > MAX_SIDE) problems.push('한쪽에서 최대 ' + MAX_SIDE + '명까지 주고받을 수 있습니다');
    if (!tradeOpen(S, date)) problems.push(S.phase === 'reg' ? '트레이드 마감(7월 31일)이 지났습니다' : '지금은 트레이드 기간이 아닙니다');
    for (const id of give) if (P[id].team !== userId) problems.push(P[id].name + ' 선수는 우리 구단 소속이 아닙니다');
    for (const id of get) if (P[id].team !== aiId) problems.push(P[id].name + ' 선수는 상대 구단 소속이 아닙니다');
    const ua = countAfter(S, userId, give, get), aa = countAfter(S, aiId, get, give);
    if (ua > MAX_ROSTER) problems.push('우리 구단 선수가 ' + ua + '명이 됩니다 (최대 ' + MAX_ROSTER + '명)');
    if (aa > MAX_ROSTER) problems.push('상대 구단 선수가 ' + aa + '명이 됩니다 (최대 ' + MAX_ROSTER + '명)');
    if (ua < MIN_ROSTER) problems.push('우리 구단 선수가 ' + ua + '명으로 너무 적어집니다');
    const pc = posCheck(S, userId, give, get); if (pc) problems.push('우리 구단: ' + pc);
    const fu = foreignCheck(S, userId, give, get); if (fu) problems.push('우리 구단: ' + fu);
    const pa = posCheck(S, aiId, get, give) || foreignCheck(S, aiId, get, give);
    if (userId === S.user && S.owner && S.owner.limit) {
      const dP = get.reduce((a, id) => a + (P[id].foreign ? 0 : P[id].sal), 0) - give.reduce((a, id) => a + (P[id].foreign ? 0 : P[id].sal), 0);
      if (dP > 0 && LG.payroll(S.league, userId) + dP > S.owner.limit) problems.push('구단주 연봉 한도(' + C.money(S.owner.limit) + ')를 넘습니다');
    }
    // 상대 입장 가치
    const mode = teamMode(S, aiId);
    const inVals = give.map((id) => valueFor(S, P[id], aiId, mode) * needFactor(S, P[id], aiId, get)).concat(pkG.map((k) => pickValue(S, k, aiId, mode))).sort((a, b) => b - a);
    const inVal = inVals.reduce((a, v, i) => a + v * (i === 0 ? 1 : i === 1 ? 0.85 : 0.7), 0); // 여러 명을 받으면 뒤 선수는 덜 쳐줌
    const outVal = get.reduce((a, id) => a + valueFor(S, P[id], aiId, mode) * coreFactor(S, P[id]), 0) + pkT.reduce((a, k) => a + pickValue(S, k, aiId, mode) * 1.05, 0);
    const need = outVal * (1.06 + Math.max(0, give.length - get.length) * 0.03) * (userId === S.user ? C.diffOf(S).trade : 1);
    const ratio = need > 0 ? inVal / need : (inVal > 0 ? 2 : 0);
    let accept = !problems.length && !pa && ratio >= 1;
    let reply;
    const T = team(S, aiId);
    if (problems.length) reply = '규정에 맞지 않아 제안할 수 없습니다.';
    else if (pa) { reply = '그렇게 하면 ' + pa.replace('적어집니다', '적어져서') + ' 곤란합니다.'; accept = false; }
    else if (accept) reply = ratio >= 1.3 ? '좋은 조건이네요. 바로 받겠습니다.' : '좋습니다. 이 조건이면 받겠습니다.';
    else if (ratio >= 0.8) reply = '조금만 더 얹어 주시면 생각해 보겠습니다.';
    else if (ratio >= 0.5) reply = '우리가 손해 보는 거래입니다. 차이가 꽤 큽니다.';
    else reply = '이 조건으로는 대화하기 어렵습니다.';
    if (mode === 'build') notes.push(T.name + '는 리빌딩 중이라 젊은 선수와 지명권을 원합니다');
    if (mode === 'win') notes.push(T.name + '는 우승 경쟁 중이라 즉시 전력을 원하고, 지명권은 덜 쳐줍니다');
    const pay0 = LG.payroll(S.league, userId);
    const dPay = get.reduce((a, id) => a + (P[id].foreign ? 0 : P[id].sal), 0) - give.reduce((a, id) => a + (P[id].foreign ? 0 : P[id].sal), 0);
    return { accept, ratio, reply, problems, notes, mode, payAfter: pay0 + dPay, dPay, rosterAfter: ua };
  }

  function freeNumber(S, tid, n) {
    const used = new Set(roster(S, tid).map((p) => p.num));
    if (!used.has(n)) return n;
    for (let k = 1; k < 100; k++) { const x = (n + k) % 100; if (!used.has(x)) return x; }
    return n;
  }
  function moveTo(S, p, tid, date) {
    const num = freeNumber(S, tid, p.num);
    p.team = tid; p.num = num; p.ent = 0; p.joined = date; p.since = S.league.year;
    delete p.downCal;
  }
  function refreshEntries(S, cal) {
    const L = S.league;
    for (const t of L.teams) SIM.setEntry(L, t.id, cal);
    if (L.fteams) FU().resetAll(L);
  }
  function todayCal(S) {
    const d = S.sched.days[Math.min(S.dayIdx, S.sched.days.length - 1)];
    return d ? d.cal : 0;
  }
  function log(S, date, kind, text) {
    S.trans = S.trans || [];
    S.trans.unshift({ date, kind, text });
    if (S.trans.length > 120) S.trans.length = 120;
  }
  function names(S, ids) { return ids.map((id) => S.league.players[id].name).join(', ') || '없음'; }

  function executeTrade(S, aId, bId, aGive, bGive, date, pk) {
    const P = S.league.players;
    const pA = (pk && pk.a) || [], pB = (pk && pk.b) || [];
    movePicks(S, pA, bId); movePicks(S, pB, aId);
    for (const id of aGive) moveTo(S, P[id], bId, date);
    for (const id of bGive) moveTo(S, P[id], aId, date);
    refreshEntries(S, todayCal(S));
    const A = team(S, aId), B = team(S, bId);
    if (G.OD.Finance) { if (aId === S.user) G.OD.Finance.onMove(S, aGive, bGive, aId, date, 'trade'); if (bId === S.user) G.OD.Finance.onMove(S, bGive, aGive, bId, date, 'trade'); }
    const side = (ids, keys) => [ids.length ? names(S, ids) : '', keys.map((k) => pickLabel(S, k, true) + ' 지명권').join(', ')].filter(Boolean).join(', ') || '없음';
    const text = A.name + '·' + B.name + ' 트레이드 — ' + A.name + ' 영입: ' + side(bGive, pB) + ' / ' + B.name + ' 영입: ' + side(aGive, pA);
    log(S, date, 'trade', text);
    if (aId === S.user || bId === S.user) SE().msg(S, date, '프런트', '트레이드 성사', text);
    // 지난 제안 중 무효가 된 것 정리
    if (S.offers) S.offers = S.offers.filter((o) => o.give.every((id) => P[id].team === o.from) && o.get.every((id) => P[id].team === S.user));
  }

  // ================= 규칙 기반 AI 트레이드 =================
  // 시즌마다 개막~7월 31일 사이: AI끼리 최소 5건, 우리에게 제안 2건 (주 단위 일정을 미리 정해 둠)
  const CASH_PER_VAL = 2000; // 가치 1 ≈ 2,000만 원
  const B_MINUS = 12.0;      // B- 등급 기준 능력
  function tradePlan(S, date, rng) {
    const y = S.league.year;
    if (S.tplan && S.tplan.y === y) return S.tplan;
    const dl = deadline(y), weeks = [];
    for (let d = date; d <= dl; d = C.addDays(d, 7)) weeks.push(d);
    const pickN = (n) => rng.shuffle(weeks.slice()).slice(0, n).sort();
    S.tplan = { y, ai: pickN(Math.min(weeks.length, 7)), off: pickN(Math.min(weeks.length, 2)), aiDone: 0, offDone: 0, aiDue: 0, offDue: 0 };
    return S.tplan;
  }
  function userRank(S) {
    const st = SE().standings(S);
    const g = st.reduce((a, x) => a + x.r.w + x.r.l + x.r.t, 0) / st.length;
    return g >= 10 ? st.findIndex((x) => x.t.id === S.user) + 1 : (team(S, S.user).pred || 5);
  }
  function sweetener(S, tid, valueGap, rng) {
    // 가치 차이를 지명권 또는 현금으로 메움 (가진 지명권 중 가치가 가장 가까운 것, 없으면 현금)
    if (valueGap <= 3) return { pk: [], cash: 0 };
    const keys = pickList(S, tid).filter((k) => pickParse(k).r <= 3);
    let best = null, bd = 1e9;
    for (const k of keys) { const v = pickValue(S, k, tid); const d = Math.abs(v - valueGap); if (d < bd && v <= valueGap * 1.4) { bd = d; best = k; } }
    if (best && rng.chance(0.6)) return { pk: [best], cash: 0 };
    return { pk: [], cash: clamp(Math.round(valueGap * CASH_PER_VAL / 1000) * 1000, 10000, 200000) };
  }
  function aiOffer(S, date, rng, forced) {
    if (!tradeOpen(S, date) || S.phase !== 'reg') return false;
    S.offers = (S.offers || []).filter((o) => o.until >= date);
    if (!forced) return false;
    const L = S.league;
    const r = userRank(S);
    const others = L.teams.filter((t) => t.id !== S.user);
    const myRos = roster(S, S.user), myCore = (team(S, S.user).rot || []).slice(0, 1);
    for (let tries = 0; tries < 30; tries++) {
      const T = rng.pick(others), mode = teamMode(S, T.id);
      const theirs = roster(S, T.id);
      let give = [], get = [], kind, gapForUser = 0;
      const val = (p, tid) => valueFor(S, p, tid || T.id, mode);
      if (r >= 8) {
        // 우리가 하위권(셀러): AI가 즉시 전력(B- 이상)을 요구, 대신 유망주(C+ 이하) + 현금/지명권
        kind = 'sell';
        const tg = myRos.filter((p) => p.ca >= B_MINUS && !myCore.includes(p.id) && !p.foreign).sort((a, b) => val(b) * needFactor(S, b, T.id, []) - val(a) * needFactor(S, a, T.id, []));
        const pr = theirs.filter((p) => p.ca < B_MINUS && p.age <= 24 && !p.foreign).sort((a, b) => b.pa - a.pa);
        if (!tg.length || !pr.length) continue;
        const x = tg[rng.int(0, Math.min(3, tg.length - 1))], y = pr[rng.int(0, Math.min(2, pr.length - 1))];
        get = [x.id]; give = [y.id];
        gapForUser = val(x) - val(y);
      } else if (r <= 3) {
        // 우리가 상위권(바이어): AI가 B- 이상 선수를 내주고, 우리 최고 유망주(C+ 이하) + 현금/지명권을 요구
        kind = 'buy';
        const as = theirs.filter((p) => p.ca >= B_MINUS && !(T.rot || []).slice(0, 1).includes(p.id) && !p.foreign).sort((a, b) => val(b) - val(a));
        const pr = myRos.filter((p) => p.ca < B_MINUS && p.age <= 24 && !p.foreign).sort((a, b) => b.pa - a.pa);
        if (!as.length || !pr.length) continue;
        const x = as[rng.int(0, Math.min(3, as.length - 1))], y = pr[0];
        give = [x.id]; get = [y.id];
        gapForUser = -(val(x) - val(y));
      } else {
        // 중위권: 서로 필요한 포지션을 1:1로, 등급이 정확히 한 단계 차이
        kind = 'mid';
        const need = myRos.filter((p) => p.ca >= 9 && !myCore.includes(p.id) && !p.foreign).sort((a, b) => needFactor(S, b, T.id, []) - needFactor(S, a, T.id, []));
        if (!need.length) continue;
        const x = need[rng.int(0, Math.min(4, need.length - 1))];
        const gi = LG.grade(x.ca).i, dir = rng.chance(0.5) ? 1 : -1;
        const cands = theirs.filter((p) => !p.foreign && LG.grade(p.ca).i === gi + dir && needFactor(S, p, S.user, []) >= 1);
        if (!cands.length) continue;
        const y = rng.pick(cands);
        get = [x.id]; give = [y.id];
      }
      if (posCheck(S, T.id, give, get) || posCheck(S, S.user, get, give)) continue;
      if (foreignCheck(S, T.id, give, get) || foreignCheck(S, S.user, get, give)) continue;
      // 가치 차이 메우기: sell → AI가 우리에게 현금/지명권, buy → 우리가 AI에게
      let sw = { pk: [], cash: 0 }, pkGive = [], pkGet = [], cash = 0;
      if (kind === 'sell') { sw = sweetener(S, T.id, gapForUser, rng); pkGive = sw.pk; cash = sw.cash; }
      if (kind === 'buy') { sw = sweetener(S, S.user, -gapForUser, rng); pkGet = sw.pk; cash = -sw.cash; }
      const o = { id: (S.offerSeq = (S.offerSeq || 0) + 1), from: T.id, give, get, pkGive, pkGet, cash, kind, date, until: C.addDays(date, 7) };
      S.offers.push(o);
      const extra = [pkGive.length ? pkGive.map((k) => pickLabel(S, k, true) + ' 지명권').join(', ') + '도 주겠답니다' : '', pkGet.length ? '우리 ' + pkGet.map((k) => pickLabel(S, k, true) + ' 지명권').join(', ') + '도 원합니다' : '', cash > 0 ? '현금 ' + C.money(cash) + '도 얹어 주겠답니다' : cash < 0 ? '현금 ' + C.money(-cash) + '도 받고 싶어 합니다' : ''].filter(Boolean).join(', ');
      SE().msg(S, date, T.name + ' 단장', '트레이드 제안', T.name + '가 ' + names(S, get) + ' 선수를 원하고, 대신 ' + names(S, give) + ' 선수를 주겠답니다.' + (extra ? ' ' + extra + '.' : '') + ' 이적시장 \'받은 제안\'에서 답해 주세요. (' + C.fmtDate(o.until) + '까지)');

  }
  function acceptOffer(S, oid, date) {
    const o = (S.offers || []).find((x) => x.id === oid);
    if (!o) return { ok: false, msg: '제안이 없습니다.' };
    const ev = evaluate(S, S.user, o.from, o.get, o.give, date, { give: o.pkGet || [], get: o.pkGive || [] });
    if (ev.problems.length) return { ok: false, msg: ev.problems[0] };
    executeTrade(S, S.user, o.from, o.get, o.give, date, { a: o.pkGet || [], b: o.pkGive || [] });
    if (o.cash) { S.income = S.income || {}; S.fees = S.fees || {}; const payee = o.cash > 0 ? S.user : o.from, payer = o.cash > 0 ? o.from : S.user; S.income[payee] = (S.income[payee] || 0) + Math.abs(o.cash); S.fees[payer] = (S.fees[payer] || 0) + Math.abs(o.cash); }

  function declineOffer(S, oid) { S.offers = (S.offers || []).filter((x) => x.id !== oid); }

  // AI 구단끼리 트레이드: 상위권 팀이 하위권 팀의 즉시 전력을 유망주와 바꿈
  function aiTrades(S, date, rng, forced) {
    if (!tradeOpen(S, date) || S.phase !== 'reg' || !forced) return false;
    const L = S.league;
    const ai = L.teams.filter((t) => t.id !== S.user);
    let win = ai.filter((t) => teamMode(S, t.id) === 'win'), build = ai.filter((t) => teamMode(S, t.id) !== 'win');
    if (!win.length || !build.length) { const st = SE().standings(S).map((x) => x.t).filter((t) => t.id !== S.user); win = st.slice(0, 4); build = st.slice(4); }
    for (let tries = 0; tries < 40; tries++) {
      const A = rng.pick(win), B = rng.pick(build);
      const vet = roster(S, B.id).filter((p) => p.age >= 27 && p.ca >= 11 && !(B.rot || []).slice(0, 1).includes(p.id));
      if (!vet.length) continue;
      const x = rng.pick(vet);
      const vB = valueFor(S, x, B.id) * coreFactor(S, x);
      const kids = roster(S, A.id).filter((p) => p.age <= 25 && !p.ent).sort((a, b) => valueFor(S, b, B.id) - valueFor(S, a, B.id));
      const pack = [];
      let sum = 0;
      for (const k of kids) { if (pack.length >= 2) break; const v = valueFor(S, k, B.id) * needFactor(S, k, B.id, [x.id]); if (sum < vB * 1.08) { pack.push(k); sum += v * (pack.length === 1 ? 1 : 0.85); } }
      if (!pack.length || sum < vB * 1.08) continue;
      // A 입장도 이득이어야 함
      const gainA = valueFor(S, x, A.id) * needFactor(S, x, A.id, pack.map((p) => p.id));
      const lossA = pack.reduce((a, p) => a + valueFor(S, p, A.id) * coreFactor(S, p), 0);
      if (gainA < lossA * 1.05) continue;
      if (posCheck(S, A.id, pack.map((p) => p.id), [x.id]) || posCheck(S, B.id, [x.id], pack.map((p) => p.id))) continue;
      if (foreignCheck(S, A.id, pack.map((p) => p.id), [x.id]) || foreignCheck(S, B.id, [x.id], pack.map((p) => p.id))) continue;
      if (countAfter(S, A.id, pack.map((p) => p.id), [x.id]) > MAX_ROSTER || countAfter(S, B.id, [x.id], pack.map((p) => p.id)) > MAX_ROSTER) continue;
      executeTrade(S, A.id, B.id, pack.map((p) => p.id), [x.id], date);
      return true;
    }
    return false;
  }

  // ================= 방출·웨이버 =================
  function releaseCheck(S, pid) {
    const p = S.league.players[pid];
    if (!p || p.team !== S.user) return '우리 구단 선수가 아닙니다';
    if (roster(S, S.user).length - 1 < MIN_ROSTER) return '선수가 ' + MIN_ROSTER + '명보다 적어집니다';
    const pc = posCheck(S, S.user, [pid], []);
    if (pc) return pc;
    if (S.phase !== 'reg' && S.phase !== 'off' && S.phase !== 'pre') return '지금은 방출할 수 없습니다';
    return null;
  }
  function seasonLeft(S) { return clamp(1 - S.dayIdx / S.sched.days.length, 0, 1); }
  function release(S, pid, date) {

    const p = S.league.players[pid];
    const from = p.team;
    if (S.phase === 'off') { // 오프시즌: 보류선수 명단에서 제외 (남은 계약 연봉만 부담)
      const owedOff = Math.round(p.sal * Math.max(0, p.yrs));
      p.team = null; p.ent = 0; p.fa = 1; p.cut = S.league.year;
      if (owedOff) { S.dead = S.dead || {}; S.dead[from] = (S.dead[from] || 0) + owedOff; }
      log(S, date, 'release', team(S, from).name + ', ' + p.name + ' 보류선수 명단 제외');
      refreshEntries(S, todayCal(S));

    }
    const owed = Math.round(p.sal * seasonLeft(S) + p.sal * Math.max(0, p.yrs - 1));
    p.team = null; p.ent = 0;
    p.waiver = { from, until: C.addDays(date, 7), owed };

    S.waivers.push(pid);
    S.dead = S.dead || {};
    S.dead[from] = (S.dead[from] || 0) + owed;

    return { ok: true, owed };
  }
  // 웨이버 영입 판단 (AI)
  function aiWants(S, p, tid) {
    const ps = roster(S, tid);
    if (ps.length >= MAX_ROSTER) return false;
    const same = ps.filter((x) => !!x.pr === !!p.pr && (p.pr ? (x.role === 'SP') === (p.role === 'SP') : x.pos === p.pos));
    const worst = same.length ? Math.min(...same.map((x) => x.ca)) : 0;
    return p.ca >= worst + 1.5 && p.ca >= 9 && p.sal <= 60000;
  }
  function claimToggle(S, pid) {
    S.claims = S.claims || {};
    if (S.claims[pid]) delete S.claims[pid]; else S.claims[pid] = 1;
  }
  function processWaivers(S, date) {
    if (!S.waivers || !S.waivers.length) return;
    const L = S.league, P = L.players;
    const st = SE().standings(S).map((x) => x.t.id).reverse(); // 하위 팀부터 우선권
    const keep = [];
    for (const pid of S.waivers) {
      const p = P[pid];
      if (!p.waiver || p.waiver.until > date) { keep.push(pid); continue; }
      let to = null;
      for (const tid of st) {
        if (tid === p.waiver.from) continue;
        if (tid === S.user) { if (S.claims && S.claims[pid] && roster(S, tid).length < MAX_ROSTER) { to = tid; break; } }
        else if (aiWants(S, p, tid)) { to = tid; break; }
      }
      const from = p.waiver.from;
      if (to) {
        S.dead[from] = Math.max(0, (S.dead[from] || 0) - p.waiver.owed);
        delete p.waiver;
        moveTo(S, p, to, date);
        log(S, date, 'waiver', team(S, to).name + ', 웨이버로 ' + p.name + ' 영입 (전 소속 ' + team(S, from).name + ')');
        if (to === S.user || from === S.user) SE().msg(S, date, '프런트', '웨이버 결과', team(S, to).name + '가 ' + p.name + ' 선수를 웨이버로 데려갔습니다.' + (from === S.user ? ' 남은 연봉 부담이 없어졌습니다.' : ''));
      } else {

        }

    const changed = keep.length !== S.waivers.length;

    const t = team(S, tid), f = S.fin && S.fin[tid];
    const base = t.cash != null ? t.cash : START_CASH;
    return base + (f ? sum(f.rev) - sum(f.exp) : 0);
  }
  const POST_BONUS = { champ: 300000, ks: 150000, po: 80000, spo: 50000, wc: 30000 };
  const ROLES = [
    { key: 'bat', name: '타격 코치', eff: '타격 성적·타자 성장' },
    { key: 'pit', name: '투수 코치', eff: '투구 성적·투수 성장' },
    { key: 'def', name: '수비·주루 코치', eff: '수비 범위·실책' },
    { key: 'dev', name: '2군 감독', eff: '24세 이하 유망주 성장' },
    { key: 'med', name: '트레이닝 코치', eff: '부상 빈도·회복 기간' }
  ];
  const REV = [['gate', '입장 수입'], ['tv', '중계권'], ['spon', '스폰서·광고'], ['goods', '상품 판매'], ['support', '모기업 지원금'], ['post', '포스트시즌'], ['comp', 'FA 보상금 등'], ['mlb', '포스팅 이적료'], ['event', '은퇴식·영구결번'], ['bonus', '구단주 특별 지원']];
  const EXP = [['sal', '선수 연봉'], ['staff', '감독·코치 연봉'], ['ops', '구장·운영비'], ['dead', '남은 연봉(방출·경질)'], ['fees', '이적료·계약금·보상금'], ['camp', '전지훈련'], ['cut', '구단주 예산 삭감'], ['tax', '경쟁균형세 기금']];

  const team = (S, id) => S.league.teams.find((t) => t.id === id);
  const roster = (S, id) => LG.teamPlayers(S.league, id);
  function rngOf(S, salt) { return new RNG(((S.rng ^ (salt * 3266489917)) >>> 0) || 1); }
  function blankLedger(year) { const o = { year, rev: {}, exp: {}, att: 0, attN: 0 }; for (const [k] of REV) o.rev[k] = 0; for (const [k] of EXP) o.exp[k] = 0; return o; }
  const sum = (o) => Object.values(o).reduce((a, b) => a + b, 0);

  // ================= 준비 =================
  function makeCoach(rng, role, seq, year) {
    const r = clamp(Math.round(rng.normal(10.5, 3.2)), 3, 19);
    const age = rng.int(38, 62);
    return { id: seq, role, name: C.koreanName(rng, (year || 2027) - age), age, r, sal: Math.round((8000 + r * 900 + rng.int(0, 30) * 100) / 100) * 100, yrs: rng.int(1, 3) };
  }
  function setup(S, rng) {
    const L = S.league, y = L.year;
    let seq = 1;
    S.fin = {};
    for (const t of L.teams) {
      t.staff = {};
      for (const r of ROLES) t.staff[r.key] = makeCoach(rng, r.key, seq++);
      t.fans = { mood: 55 };
      t.cash = START_CASH;
      S.fin[t.id] = blankLedger(y);
      S.fin[t.id].hist = [];
    }
    S.coachPool = [];
    for (const r of ROLES) for (let i = 0; i < 3; i++) { const c = makeCoach(rng, r.key, seq++); c.yrs = 0; S.coachPool.push(c); }
    S.coachSeq = seq;
    for (const id in L.players) initPop(L.players[id], y, rng);
    S.fan = [];
  }
  // 매년 새 시즌: 코치 후보 새로 (역할마다 3명)
  function refreshCoaches(S, rng) {
    let seq = S.coachSeq || 1000;
    S.coachPool = [];
    for (const r of ROLES) for (let i = 0; i < 3; i++) { const c = makeCoach(rng, r.key, seq++, S.league.year); c.yrs = 0; S.coachPool.push(c); }
    S.coachSeq = seq;
    // 올겨울 은퇴한 KBO 선수 출신 코치 후보 (2월 1주 코치 계약 때까지 남음)
    for (const c of (S.retCoaches || [])) if (c.y >= S.league.year - 1) S.coachPool.push(Object.assign({}, c, { id: seq++ }));
    S.coachSeq = seq;
  }
  // 은퇴 선수(B- 이상) → 코치 후보: 투수는 투수 코치, 야수는 타격 또는 수비 코치. 능력은 선수 시절 기량 바탕
  function addRetiredCoach(S, p) {
    const role = p.pr ? 'pit' : ((p.br.fld + p.br.arm) > (p.br.con + p.br.pow) ? 'def' : 'bat');
    const peak = Math.max(p.peak || 0, p.ca);
    const r = clamp(Math.round(7 + (peak - 11) * 1.1 + ((p.h && p.h.work) || 10) / 5), 5, 19);
    const c = { id: (S.coachSeq = (S.coachSeq || 1000) + 1), role, name: p.name, age: p.age + 1, r, sal: Math.round((8000 + r * 900) / 100) * 100, yrs: 0, ex: p.team, y: S.league.year };
    S.retCoaches = (S.retCoaches || []).filter((x) => x.y >= S.league.year - 1).concat([c]);
    S.coachPool = (S.coachPool || []).concat([Object.assign({}, c)]);
  }
  function initPop(p, y, rng) {
    if (p.pop != null) return;
    p.pop = Math.round(clamp((p.ca - 8) * 7 + (p.svc || 0) * 2.5 + (rng ? rng.normal(0, 6) : 0), 0, 100));
    if (p.since == null) p.since = y - Math.min(p.svc || 0, rng ? rng.int(0, 8) : 0);
  }
  function setupOwner(S) {
    const t = team(S, S.user);
    S.owner = { trust: 60, hist: [], warned: {} };
    setBudget(S);
  }
  function setBudget(S) {
    const t = team(S, S.user), m = MKT[t.market];
    const cap = LG.capFor(S.league.year);
    const f = (t.market === '대형' ? 1.0 : t.market === '중형' ? 0.86 : 0.68) * (1 + (S.owner.trust - 60) / 250);
    S.owner.limit = Math.round(cap * clamp(f, 0.55, 1.08) / 1000) * 1000;
    S.owner.support = Math.round(m.support * (1 + (S.owner.trust - 60) / 200));
  }
  function payLimit(S) { return S.owner ? S.owner.limit : Infinity; }

  // ================= 관중 =================
  function attendance(S, h, a, date, rng) {
    const H = team(S, h), A = team(S, a), cap = CAPACITY[h] || 20000;
    const r = H.rec, g = r.w + r.l;
    const pct = g ? r.w / g : 0.5;
    const wd = C.weekday(date);
    let mult = 1 + (pct - 0.5) * 1.3 + clamp(r.streak * 0.025, -0.12, 0.15) + (wd === 6 ? 0.32 : wd === 0 ? 0.26 : wd === 5 ? 0.12 : 0) + ((H.fans ? H.fans.mood : 50) - 50) / 140;
    if (A.market === '대형') mult += 0.05;
    if (A.city === H.city) mult += 0.12;
    if (date.slice(5, 7) <= '04') mult += 0.08;
    const star = roster(S, h).reduce((m, p) => Math.max(m, p.ent ? p.pop || 0 : 0), 0);
    if (star >= 80) mult += 0.05;
    const base = cap * MKT[H.market].fill;
    return Math.round(clamp(base * mult * (1 + rng.normal(0, 0.06)), 3500, cap));
  }

  // ================= 하루 정산 =================
  function sweep(S) {
    for (const t of S.league.teams) {
      const f = S.fin[t.id]; if (!f) continue;
      if (S.dead && S.dead[t.id]) { f.exp.dead += S.dead[t.id]; S.dead[t.id] = 0; }
      if (S.fees && S.fees[t.id]) { f.exp.fees += S.fees[t.id]; S.fees[t.id] = 0; }
      if (S.income && S.income[t.id]) { f.rev.comp += S.income[t.id]; S.income[t.id] = 0; }
    }
  }
  function staffSal(t) { let s = t.mgr ? t.mgr.sal : 0; for (const k in (t.staff || {})) s += t.staff[k].sal; return s; }
  function daySettle(S, day, games) {
    if (!S.fin) return;
    const L = S.league, n = S.sched.days.length;
    const rng = rngOf(S, day.cal + 7);
    const RV = C.diffOf(S).rev;
    for (const t of L.teams) {
      const f = S.fin[t.id], m = MKT[t.market], k = t.id === S.user ? RV : 1;
      if (!bcastOf(S, t.id)) f.rev.tv += TV / n * k; // 계약 없는 시즌(예전 저장)은 예전 중계료
      f.rev.spon += (t.spon || m.spon) / n * k;
      f.rev.support += (t.id === S.user && S.owner ? S.owner.support : m.support) / n * k;
      f.exp.sal += roster(S, t.id).reduce((a, p) => a + (p.sal || 0), 0) / n;
      f.exp.staff += staffSal(t) / n;
      f.exp.ops += m.ops / n;
    }
    for (const g of games) {
      const res = S.results[g.id];
      if (!res) continue;
      const att = attendance(S, g.h, g.a, day.date, rng);
      res.att = att;
      const f = S.fin[g.h], k = g.h === S.user ? RV : 1;
      f.rev.gate += att * PRICE * k; f.rev.goods += att * GOODS * k; f.att += att; f.attN++;
      fanResult(S, g.h, res.hs, res.as, res.tie); fanResult(S, g.a, res.as, res.hs, res.tie);
      // 방송사 승리 수당 (KBS 1억, SOOP 2억)
      if (!res.tie) { const w = res.hs > res.as ? g.h : g.a, b = BCAST[bcastOf(S, w)]; if (b && b.win) S.fin[w].rev.tv += b.win * (w === S.user ? RV : 1); }
    }
    sweep(S);
  }
  function postGame(S, res) {
    if (!S.fin) return;
    const cap = CAPACITY[res.h] || 20000;
    const f = S.fin[res.h];
    res.att = cap;
    const k = res.h === S.user ? C.diffOf(S).rev : 1;
    f.rev.gate += cap * POST_PRICE * k; f.rev.goods += cap * GOODS * 1.5 * k; f.att += cap; f.attN++;
    fanResult(S, res.h, res.hs, res.as, res.tie, true); fanResult(S, res.a, res.as, res.hs, res.tie, true);
  }
  function postBonus(S) {
    if (!S.fin || !S.post) return;
    const po = S.post;
    for (const rd of po.rounds) {
      if (!rd.winner) continue;
      const loser = rd.winner === rd.hi ? rd.lo : rd.hi;
      if (loser && S.fin[loser]) S.fin[loser].rev.post += POST_BONUS[rd.key] || 0;
      if (rd.key === 'ks') S.fin[rd.winner].rev.post += POST_BONUS.champ;
    }
  }

  // ================= 팬 =================
  function fanResult(S, tid, my, op, tie, post) {
    const t = team(S, tid); if (!t || !t.fans) return;
    const d = tie ? 0 : my > op ? (post ? 1.6 : 0.45) : (post ? -1.2 : -0.45);
    t.fans.mood = clamp(t.fans.mood + d + (50 - t.fans.mood) * 0.01, 0, 100);
  }
  const FAN_LINES = {
    win: ['오늘 경기 직관한 보람 있다!', '이 분위기 그대로 가자', '연승 가즈아', '요즘 야구 볼 맛 난다'],
    lose: ['연패 끊을 방법 좀 찾자', '프런트는 뭐 하냐', '보는 내가 다 지친다', '감독님 작전 좀 바꿔 주세요'],
    tradeOut: ['우리 프랜차이즈를 보낸다고?', '이 트레이드는 이해가 안 된다', '팬들 마음은 생각 안 하나'],
    tradeIn: ['좋은 선수 데려왔네', '드디어 프런트가 일한다', '이 선수 오면 순위 오른다'],
    fa: ['FA 대어 잡았다!', '돈 쓸 줄 아는 구단', '올해는 다르다'],
    faLost: ['프랜차이즈 스타를 놓치다니', '잡았어야지...', '이러니 팬이 떠난다'],
    mgr: ['새 감독님 기대합니다', '감독만 바꾸면 끝이냐', '분위기 쇄신 좋다'],
    post: ['가을야구 간다!', '올해는 우승까지 가자', '포스트시즌 표 구할 수 있을까']
  };
  function fanSay(S, tid, kind, date, extra) {
    if (tid !== S.user) return;
    const rng = rngOf(S, (S.fan ? S.fan.length : 0) + kind.length * 13 + (date ? Number(date.slice(8, 10)) : 0));
    const line = rng.pick(FAN_LINES[kind] || FAN_LINES.win);
    S.fan = S.fan || [];
    S.fan.unshift({ date, kind, text: (extra ? extra + ' — ' : '') + '"' + line + '"' });
    if (S.fan.length > 40) S.fan.length = 40;
  }
  function fanEvent(S, tid, delta, kind, date, extra) {
    const t = team(S, tid); if (!t || !t.fans) return;
    t.fans.mood = clamp(t.fans.mood + delta, 0, 100);
    fanSay(S, tid, kind, date, extra);
  }
  // 트레이드·FA·방출 때 팬 반응 (인기 선수일수록 크게)
  function onMove(S, outIds, inIds, tid, date, kind) {
    const P = S.league.players;
    const outPop = outIds.reduce((a, id) => a + Math.max(0, ((P[id] && P[id].pop) || 0) - 45) * (P[id] && date && P[id].since != null && S.league.year - P[id].since >= 5 ? 1.5 : 1), 0);
    const inPop = inIds.reduce((a, id) => a + Math.max(0, ((P[id] && P[id].pop) || 0) - 45), 0);
    const d = (inPop - outPop) / 8;
    if (Math.abs(d) < 0.8) return;
    const names = (ids) => ids.map((id) => P[id] && P[id].name).filter(Boolean).join(', ');
    if (d < 0) fanEvent(S, tid, clamp(d, -15, 0), kind === 'fa' ? 'faLost' : 'tradeOut', date, names(outIds) + ' 이적');
    else fanEvent(S, tid, clamp(d, 0, 12), kind === 'fa' ? 'fa' : 'tradeIn', date, names(inIds) + ' 영입');
  }

  // ================= 부상 회복 =================
  function heal(S, date) {
    const P = S.league.players;
    let changed = false;
    for (const id in P) {
      const p = P[id];
      if (p.inj && p.injUntil && p.injUntil <= date) {
        delete p.inj; delete p.injUntil; const nm = p.injName; delete p.injName; delete p.injDays;
        changed = true;
        if (p.team === S.user) SE().msg(S, date, '트레이닝 코치', '부상 회복', p.name + ' 선수가 ' + (nm || '부상') + '에서 회복했습니다.');
      }
    }
    return changed;
  }
  function onInjuries(S, ids, date) {
    const P = S.league.players;
    for (const id of ids) {
      const p = P[id];
      if (p.team === S.user) SE().msg(S, date, '트레이닝 코치', '부상 발생', p.name + ' 선수가 ' + p.injName + ' 부상을 당했습니다. 약 ' + p.injDays + '일(' + C.fmtDate(p.injUntil) + '까지) 빠집니다.');
    }
  }
  function healAll(S) { const P = S.league.players; for (const id in P) { delete P[id].inj; delete P[id].injUntil; delete P[id].injName; delete P[id].injDays; delete P[id].away; } }

  // ================= 구단주 =================
  function projNet(S, tid) { const f = S.fin[tid]; return sum(f.rev) - sum(f.exp); }
  function monthly(S, date) {
    if (!S.owner) return;
    const t = team(S, S.user);
    const st = SE().standings(S);
    const rank = st.findIndex((x) => x.t.id === S.user) + 1;
    const games = t.rec.w + t.rec.l + t.rec.t;
    if (games < 15) return;
    // 지상 과제가 있으면 평가는 11월에 크게 하고, 시즌 중에는 가볍게만 반영
    const dirOn = S.dir && S.dir.year === S.league.year;
    let d = rank <= t.goal.min ? 1.5 : -Math.min(dirOn ? 2 : 4, (rank - t.goal.min) * (dirOn ? 0.4 : 0.8));
    d += (t.fans.mood - 50) / 25;
    const f = S.fin[S.user];
    if (sum(f.rev) - sum(f.exp) < -200000) d -= 1.5;
    S.owner.trust = clamp(S.owner.trust + d, 0, 100);
    const tr = Math.round(S.owner.trust);
    const key = date.slice(0, 7);
    if (tr < 30 && !S.owner.warned[key]) { S.owner.warned[key] = 1; SE().msg(S, date, '구단주', '구단주의 경고', '요즘 결과가 실망스럽습니다. 목표는 ' + t.goal.text + '입니다. 이대로라면 시즌이 끝나고 거취를 다시 생각하겠습니다. (신뢰도 ' + tr + ')'); }
    else if (tr >= 80 && !S.owner.warned[key]) { S.owner.warned[key] = 1; SE().msg(S, date, '구단주', '구단주의 격려', '잘하고 있습니다. 필요한 게 있으면 말씀하세요. (신뢰도 ' + tr + ')'); }
    // 팬 게시판 월간 분위기
    fanSay(S, S.user, t.rec.streak >= 3 || rank <= 3 ? 'win' : 'lose', date, Number(date.slice(5, 7)) + '월 팬 여론 ' + Math.round(t.fans.mood));
  }
  // 경쟁균형세: 국내 선수 상위 40명 연봉 합계가 상한을 넘으면 초과분 30% (2회 연속 50%)
  function luxuryTax(S) {
    if (!S.fin) return;
    const cap = LG.capFor(S.league.year);
    S.taxHist = S.taxHist || {};
    for (const t of S.league.teams) {
      const pay = LG.payroll(S.league, t.id);
      const over = pay - cap;
      const prev = S.taxHist[t.id] === S.league.year - 1;
      if (over > 0) {
        const tax = Math.round(over * (prev ? 0.5 : 0.3));
        S.fin[t.id].exp.tax += tax;
        S.taxHist[t.id] = S.league.year;
        if (t.id === S.user) SE().msg(S, S.off ? S.off.date : SE().currentDate(S), '프런트', '경쟁균형세 납부', '연봉 상위 40명 합계 ' + C.money(pay) + '로 상한 ' + C.money(cap) + '을 넘어 야구발전기금 ' + C.money(tax) + '을 냅니다.');
      }
    }
  }
  // 시즌 평가 (오프시즌 결산 때)
  function evaluate(S) {
    if (!S.owner || !S.fin) return null;
    luxuryTax(S); postBonus(S); sweep(S);
    const t = team(S, S.user), f = S.fin[S.user];
    const rank = (S.final || []).indexOf(S.user) + 1;
    const champ = S.post && S.post.champ === S.user;
    const parts = [];
    const dr = evaluateDirective(S);
    // 과제 실패: 처음이면 -10, 2년 연속이면 -15 (경질 통보 임박)
    let d = dr ? (dr.ok ? 12 : dr.warn ? -15 : -10) : (rank <= t.goal.min ? 12 : -Math.min(22, (rank - t.goal.min) * 3.5));
    parts.push([(dr ? '지상 과제 ' + (dr.ok ? '달성' : '실패') : '목표') + ' (' + t.goal.text + ', 최종 ' + rank + '위)', d]);
    if (champ) { parts.push(['한국시리즈 우승', 15]); d += 15; }
    const net = sum(f.rev) - sum(f.exp);
    const fd = net >= 0 ? Math.min(6, net / 100000) : Math.max(-15, net / 60000);
    parts.push(['재정 (순이익 ' + C.money(net) + ')', fd]); d += fd;
    const md = (t.fans.mood - 50) / 6;
    parts.push(['팬 여론 (' + Math.round(t.fans.mood) + ')', md]); d += md;
    if (f.exp.tax > 0) { parts.push(['경쟁균형세 납부', -5]); d -= 5; }
    const before = S.owner.trust;
    S.owner.trust = clamp(S.owner.trust + d, 0, 100);
    // 첫 과제 실패로는 해임되지 않음 (규칙: 2년 연속 실패 때 경고)
    if (dr && !dr.ok && !dr.warn) S.owner.trust = Math.max(S.owner.trust, 20);
    const ev = { year: S.league.year, before: Math.round(before), after: Math.round(S.owner.trust), parts: parts.map(([k, v]) => [k, Math.round(v * 10) / 10]), net, rank };
    S.owner.hist.push(ev);
