    return { l1, l2: rng ? (rng.chance(0.7) ? 'oki' : rng.pick(['kor', 'ext'])) : 'oki', focus: rng ? rng.pick(['bal', 'bal', 'bat', 'pit', 'def', 'fit', 'youth']) : 'bal', inv: [] };
  }

  // ---- 시작: 새 게임 또는 새 시즌 ----
  function start(S) {
    const year = S.league.year;
    const t = team(S, S.user);
    S.phase = 'pre';
    S.pre = { year, date: dates(year).plan, stage: 'plan', plan: defaultPlan(t), ai: {}, gains: [], inj: [], games: [], exh: null, att: [] };
    for (const x of S.league.teams) delete x.campInj;
    // 올해 신인 드래프트 후보 생성 + 스카우팅 날짜 맞춤
    if (G.OD.Offseason && G.OD.Offseason.makeDraftClass) G.OD.Offseason.makeDraftClass(S);
    S.scoutDate = S.pre.date;
    if (FI() && FI().broadcastStart) FI().broadcastStart(S, S.pre.date);
    if (FI() && FI().setDirective) FI().setDirective(S, S.pre.date);
  }
  // 1월 캠프 계획 기간에 1주씩 진행 (스카우팅·외국인 영입을 위해)
  function advanceWeek(S) {
    const pr = S.pre;
    if (!pr || S.phase !== 'pre' || pr.stage !== 'plan') return advance(S);
    const nd = C.addDays(pr.date, 7);
    if (nd >= stageDate(S, 'camp1')) return advance(S);
    pr.date = nd;
    if (MK().processWaivers) MK().processWaivers(S, nd);
    MK().scoutSync(S, nd);
    return { kind: 'pre-week', stage: pr.stage };
  }

  // ---- 계획 바꾸기 (출발 전만) ----
  function setPlan(S, key, val) {
    const pr = S.pre;
    if (!pr || pr.stage !== 'plan') return { ok: false, msg: '캠프가 이미 출발했습니다' };
    if (key === 'l1' && LOC1.some((x) => x.id === val)) pr.plan.l1 = val;
    else if (key === 'l2' && LOC2.some((x) => x.id === val)) pr.plan.l2 = val;
    else if (key === 'focus' && FOCUS.some((x) => x.id === val)) pr.plan.focus = val;
    else if (key === 'inv') {
      const id = Number(val), i = pr.plan.inv.indexOf(id);
      if (i >= 0) pr.plan.inv.splice(i, 1);
      else {
        if (pr.plan.inv.length >= INV_MAX) return { ok: false, msg: '유망주 초청은 ' + INV_MAX + '명까지입니다' };
        if (!invitable(S).some((p) => p.id === id)) return { ok: false, msg: '초청할 수 없는 선수입니다' };
        pr.plan.inv.push(id);
      }
    } else return { ok: false, msg: '알 수 없는 항목' };
    return { ok: true };
  }

  // ---- 1군 캠프 명단: 감독이 투수 22·야수 20명을 고름 + 단장 초청 유망주 ----
  function autoList(S, tid) {
    const ps = LG.teamPlayers(S.league, tid).filter((p) => !p.serve && !p.pool);
    const val = (p) => p.ca + (p.age <= 23 ? 0.6 : 0);
    const pit = ps.filter((p) => p.pr).sort((a, b) => val(b) - val(a)).slice(0, CAMP_P);
    const bat = ps.filter((p) => !p.pr).sort((a, b) => val(b) - val(a)).slice(0, CAMP_B);
    return pit.concat(bat);
  }
  function invitable(S) {
    const auto = new Set(autoList(S, S.user).map((p) => p.id));
    return LG.teamPlayers(S.league, S.user).filter((p) => !auto.has(p.id) && !p.serve && !p.pool && p.age <= 25)
      .sort((a, b) => (b.pa - a.pa) || (b.ca - a.ca));
  }
  function attendees(S, tid) {
    const list = autoList(S, tid);
    if (tid === S.user) {
      const P = S.league.players;
      for (const id of S.pre.plan.inv) { const p = P[id]; if (p && p.team === tid && !list.includes(p)) list.push(p); }
    }
    return list;
  }
  function planFor(S, tid) { return tid === S.user ? S.pre.plan : S.pre.ai[tid]; }

  // ---- 훈련 효과 ----
  const BAT = ['con', 'pow', 'gap', 'eye', 'avk'], RUN = ['spd', 'run', 'fld', 'arm'], PIT = ['stf', 'ctl', 'mov', 'hold'];
  const LAB = { con: '컨택', pow: '파워', gap: '갭파워', eye: '선구안', avk: '삼진 회피', spd: '주력', run: '주루 판단', fld: '수비', arm: '송구', blk: '블로킹', cs: '도루 저지',
    stf: '구위', ctl: '제구', mov: '무브먼트', hold: '견제', sta: '체력' };
  function weights(p, focus) {
    const w = [];
    if (p.pr) {
      const main = focus === 'pit' ? 1 : focus === 'def' ? 0.3 : focus === 'bat' ? 0.3 : focus === 'fit' ? 0.2 : 0.45;
      for (const k of PIT) w.push(['pr', k, k === 'hold' && focus === 'def' ? 1 : main]);
      w.push(['pr', 'sta', focus === 'fit' ? 0.9 : main * 0.6]);
      (p.pitches || []).forEach((x, i) => w.push(['pt', i, main * 0.7]));
    } else {
      const bm = focus === 'bat' ? 1 : focus === 'def' ? 0.25 : focus === 'pit' ? 0.3 : focus === 'fit' ? 0.2 : 0.45;
      const dm = focus === 'def' ? 1 : focus === 'bat' ? 0.25 : focus === 'pit' ? 0.3 : focus === 'fit' ? 0.2 : 0.45;
      for (const k of BAT) w.push(['br', k, bm]);
      for (const k of RUN) w.push(['br', k, dm]);
      if (p.pos === 'C') { w.push(['br', 'blk', dm]); w.push(['br', 'cs', dm]); }
    }
    return w;
  }
  function trainTeam(S, tid, base, rng, inCamp, ids) {
    const plan = planFor(S, tid);
    const t = team(S, tid);
    const dev = (t.staff && t.staff.dev && t.staff.dev.r) || 10;
    const list = ids.map((id) => S.league.players[id]).filter((p) => p && p.team === tid && !p.inj);
    const out = [];
    for (const p of list) {
      const ageF = p.age <= 24 ? 1.35 : p.age <= 28 ? 1 : p.age <= 32 ? 0.7 : 0.45;
      const workF = 0.7 + ((p.h && p.h.work) || 10) / 20 * 0.6;
      const potF = p.ca >= p.pa ? 0.35 : 1;
      const youthF = plan.focus === 'youth' ? (p.age <= 24 ? 1.7 : 0.6) : 1;
      const invF = tid === S.user && plan.inv.includes(p.id) ? 1.3 : 1;
      const f = base * ageF * workF * potF * youthF * invF * (0.85 + dev / 20 * 0.3) * (inCamp ? 1 : 0.35);
      const up = [];
      for (const [grp, k, w] of weights(p, plan.focus)) {
        if (!rng.chance(clamp(f * w, 0, 0.9))) continue;
        if (grp === 'pt') { if (p.pitches[k][1] < 20) { p.pitches[k][1]++; up.push(p.pitches[k][0]); } }
        else { const o = p[grp]; if (o[k] != null && o[k] < 20) { o[k]++; up.push(LAB[k] || k); } }
      }
      if (up.length) { p.ca = Math.round(LG.computeCA(p) * 10) / 10; out.push({ id: p.id, up }); }
    }
    return out;
  }
  // 캠프 부상
  function campInjuries(S, tid, ids, risk, date, rng) {
    const t = team(S, tid);
    const tr = ((t.staff && t.staff.med && t.staff.med.r) || 10) - 10;
    const plan = planFor(S, tid);
    const out = [];
    for (const id of ids) {
      const p = S.league.players[id];
      if (!p || p.inj || p.team !== tid) continue;
      const injR = (p.h && p.h.inj) || 9;
      const r = 0.022 * risk * (1 + (injR - 9) * 0.09) * (p.age >= 32 ? 1.3 : 1) * (1 - tr * 0.03) * (plan.focus === 'fit' ? 0.6 : 1);
      if (!rng.chance(r)) continue;
      let days = rng.chance(0.7) ? rng.int(5, 14) : rng.int(15, 45);
      days = Math.max(3, Math.round(days * (1 - tr * 0.025)));
      const parts = p.pr ? ['어깨 뭉침', '팔꿈치 염증', '옆구리 근육', '허리 통증'] : ['햄스트링', '발목 염좌', '옆구리 근육', '허리 통증', '종아리'];
      p.inj = 1; p.injUntil = C.addDays(date, days); p.injName = rng.pick(parts); p.injDays = days;
      out.push({ id: p.id, days, name: p.injName });
    }
    return out;
  }

  // ---- 연습경기·시범경기 (기록은 남기지 않음) ----
  function playExtra(S, h, a, cal, rng) {
    const L = S.league;
    const res = SIM.simGame(L, h, a, { rng, cal, sk: 'xst' });
    return res;
  }
  function clearExtra(S) { const P = S.league.players; for (const id in P) delete P[id].xst; }
  function topPerformers(S, tid) {
    const ps = LG.teamPlayers(S.league, tid).filter((p) => p.xst);
    const bat = ps.filter((p) => !p.pr && p.xst.pa >= 6).map((p) => { const s = p.xst; const ob = (s.h + s.bb + s.hbp) / Math.max(1, s.pa); const sl = s.ab ? (s.h + s.d + 2 * s.t + 3 * s.hr) / s.ab : 0; return { p, v: ob + sl, txt: s.h + '안타 ' + s.hr + '홈런 ' + s.rbi + '타점 (' + s.ab + '타수)' }; }).sort((a, b) => b.v - a.v)[0];
    const pit = ps.filter((p) => p.pr && p.xst.outs >= 6).map((p) => { const s = p.xst; return { p, v: s.er * 27 / s.outs - s.pso * 0.05, txt: C.ipStr(s.outs) + '이닝 ' + s.er + '자책 ' + s.pso + '삼진' }; }).sort((a, b) => a.v - b.v)[0];
    return { bat: bat ? { id: bat.p.id, txt: bat.txt } : null, pit: pit ? { id: pit.p.id, txt: pit.txt } : null };
  }

  // ---- 다음 일정으로 ----
  function advance(S) {
    const pr = S.pre;
    if (!pr || S.phase !== 'pre') return null;
    const L = S.league;
    const rng = new RNG(S.rng);
    const msg = (from, title, body, date) => SE().msg(S, date || pr.date, from, title, body);
    const T = team(S, S.user);
    const P = L.players;
    if (pr.stage === 'plan') {
      // 2월 1일 출발
      pr.date = stageDate(S, 'camp1');
      if (FI() && FI().broadcastDeadline) FI().broadcastDeadline(S, pr.date);
      if (MK().processWaivers) MK().processWaivers(S, pr.date);
      if (S.frep && !S.fStarted) MK().aiFill(S, pr.date);
      for (const t of L.teams) if (t.id !== S.user) pr.ai[t.id] = defaultPlan(t, rng);
      for (const t of L.teams) {
        const plan = planFor(S, t.id);
        const c = planCost(plan);
        if (S.fin && S.fin[t.id]) S.fin[t.id].exp.camp = (S.fin[t.id].exp.camp || 0) + c;
        t.campLoc = loc1(plan.l1).name;
      }
      pr.att = attendees(S, S.user).map((p) => p.id);
      for (const t of L.teams) if (t.id !== S.user) pr.ai[t.id].att = attendees(S, t.id).map((p) => p.id);
      const pl = pr.plan;
      msg('감독', '1차 스프링캠프 출발', loc1(pl.l1).name + '로 출발했습니다. 1군 캠프 명단 ' + pr.att.length + '명' + (pl.inv.length ? ' (단장 초청 유망주 ' + pl.inv.length + '명 포함)' : '') + ', 훈련 중점은 \'' + focusOf(pl.focus).name + '\'입니다. 나머지 선수는 국내 2군 캠프에서 훈련합니다.');
      msg('프런트', '캠프 비용', '스프링캠프 비용 ' + C.money(planCost(pl)) + '이 집행됩니다. (1차 ' + C.money(loc1(pl.l1).cost) + ' · 2차 ' + C.money(cost2(pl)) + ')');
      pr.stage = 'camp1';
    } else if (pr.stage === 'camp1') {
      // 2월 24일: 1차 캠프 결과
      const date = stageDate(S, 'camp2');
      for (const t of L.teams) {
        const plan = planFor(S, t.id);
        const att = t.id === S.user ? pr.att : plan.att;
        const l = loc1(plan.l1);
        const inj = campInjuries(S, t.id, att, l.inj, C.addDays(pr.date, rng.int(3, 18)), rng);
        const g = trainTeam(S, t.id, 0.16 * l.eff, rng, true, att);
        const rest = LG.teamPlayers(L, t.id).filter((p) => !att.includes(p.id) && !p.serve).map((p) => p.id);
        const g2 = trainTeam(S, t.id, 0.16 * 0.75, rng, false, rest);
        if (t.id === S.user) { pr.gains = pr.gains.concat(g, g2.map((x) => Object.assign(x, { fut: 1 }))); pr.inj = pr.inj.concat(inj); }
        if (plan.focus === 'fit') t.campInj = 0.85;
      }
      pr.date = date;
      const myG = pr.gains.filter((x) => !x.fut);
      msg('감독', '1차 캠프 종료', loc1(pr.plan.l1).name + ' 캠프를 마쳤습니다. 능력이 오른 선수 ' + myG.length + '명' + (myG.length ? ' (' + myG.slice(0, 3).map((x) => P[x.id].name).join(', ') + (myG.length > 3 ? ' 등' : '') + ')' : '') + ', 부상 ' + pr.inj.length + '명.' + (pr.inj.length ? ' ' + pr.inj.map((x) => P[x.id].name + '(' + x.name + ', ' + x.days + '일)').join(', ') : ''));
      pr.stage = 'camp2';
    } else if (pr.stage === 'camp2') {
      // 3월 9일: 2차 캠프 결과 + 오키나와 연습경기
      const date = stageDate(S, 'exh');
      const before = pr.inj.length, beforeG = pr.gains.length;
      for (const t of L.teams) {
        const plan = planFor(S, t.id);
        const att = t.id === S.user ? pr.att : plan.att;
        const b = loc2(plan.l2);
        const risk = b.inj == null ? loc1(plan.l1).inj : b.inj;
        const inj = campInjuries(S, t.id, att, risk * 0.6, C.addDays(pr.date, rng.int(2, 10)), rng);
        const g = trainTeam(S, t.id, 0.16 * b.eff, rng, true, att);
        if (t.id === S.user) { pr.gains = pr.gains.concat(g); pr.inj = pr.inj.concat(inj); }
      }
      FI() && FI().heal(S, date);
      MK().refreshEntries(S, calOf(S, date));
      if (loc2(pr.plan.l2).games) {
        const opps = L.teams.filter((t) => t.id !== S.user && planFor(S, t.id).l2 === 'oki').map((t) => t.id);
        const pool = opps.length >= 2 ? opps : L.teams.filter((t) => t.id !== S.user).map((t) => t.id);
        const jp = ['요미우리', '한신', '주니치', '라쿠텐', '야쿠르트', '닛폰햄'];
        for (let i = 0; i < 6; i++) {
          const kbo = i % 3 !== 2;
          const opp = kbo ? rng.pick(pool) : null;
          const d = C.addDays(pr.date, 2 + i * 2);
          if (kbo) {
            const home = rng.chance(0.5);
            const res = playExtra(S, home ? S.user : opp, home ? opp : S.user, calOf(S, d), rng);
            const my = home ? res.hs : res.as, op = home ? res.as : res.hs;
            pr.games.push({ date: d, opp, my, op, tie: res.tie });
          } else {
            // 일본 구단: 가상의 상대 (리그 평균보다 조금 강한 팀으로 가정 → 무작위 점수)
            const my = Math.max(0, Math.round(rng.normal(3.8, 2.2))), op = Math.max(0, Math.round(rng.normal(4.3, 2.2)));
            pr.games.push({ date: d, jp: rng.pick(jp), my, op, tie: my === op });
          }
        }
        const w = pr.games.filter((g) => g.my > g.op).length, l = pr.games.filter((g) => g.my < g.op).length;
        const top = topPerformers(S, S.user);
        pr.campTop = top;
        msg('감독', '오키나와 연습경기', '연습경기 ' + w + '승 ' + l + '패 ' + (pr.games.length - w - l) + '무로 마쳤습니다.' + (top.bat ? ' 타자 중엔 ' + P[top.bat.id].name + '(' + top.bat.txt + ')' : '') + (top.pit ? ', 투수 중엔 ' + P[top.pit.id].name + '(' + top.pit.txt + ')' : '') + '의 컨디션이 좋습니다.', C.addDays(pr.date, 13));
        clearExtra(S);
      }
      pr.date = date;
      const ng = pr.gains.length - beforeG, ni = pr.inj.length - before;
      msg('감독', '2차 캠프 종료 · 귀국', loc2(pr.plan.l2).name + ' 일정을 마치고 귀국했습니다. 2차 캠프에서 능력이 오른 선수 ' + ng + '명, 새 부상 ' + ni + '명. 이제 시범경기에 들어갑니다.');
      pr.stage = 'exh';
    } else if (pr.stage === 'exh') {
      // 시범경기: 10구단 × 10경기 (3월 9일 ~), 개막일로
      const ids = L.teams.map((t) => t.id);
      const rec = {}; for (const id of ids) rec[id] = { w: 0, l: 0, t: 0, rs: 0, ra: 0 };
      MK().refreshEntries(S, calOf(S, pr.date));
      const arr = rng.shuffle(ids.slice());
      const rounds = [];
      for (let r = 0; r < 9; r++) { const ms = []; for (let i = 0; i < 5; i++) ms.push([arr[i], arr[9 - i]]); rounds.push(ms); arr.splice(1, 0, arr.pop()); }
      rounds.push(rounds[0].map(([a, b]) => [b, a]));
      const mine = [];
      let d = pr.date;
      rounds.forEach((ms) => {
        while (C.weekday(d) === 1) d = C.addDays(d, 1);
        for (const [h, a] of ms) {
          const res = playExtra(S, h, a, calOf(S, d), rng);
          const R = (id, my, op) => { const x = rec[id]; x.rs += my; x.ra += op; if (res.tie) x.t++; else if (my > op) x.w++; else x.l++; };
          R(h, res.hs, res.as); R(a, res.as, res.hs);
          if (h === S.user || a === S.user) mine.push({ date: d, opp: h === S.user ? a : h, home: h === S.user, my: h === S.user ? res.hs : res.as, op: h === S.user ? res.as : res.hs, tie: res.tie });
        }
        d = C.addDays(d, 1);
      });
      const table = ids.map((id) => ({ id, r: rec[id] })).sort((a, b) => ((b.r.w / Math.max(1, b.r.w + b.r.l)) - (a.r.w / Math.max(1, a.r.w + a.r.l))) || (b.r.w - a.r.w));
      const top = topPerformers(S, S.user);
      pr.exh = { table, mine, top };
      clearExtra(S);
      const open = S.sched.start;
      pr.date = open;
      const myR = rec[S.user], rank = table.findIndex((x) => x.id === S.user) + 1;
      msg('리그', '시범경기 종료', '시범경기 1위는 ' + LG.teamName(team(S, table[0].id)) + '. 우리 구단은 ' + myR.w + '승 ' + myR.l + '패 ' + myR.t + '무로 ' + rank + '위입니다. 시범경기 성적은 정규시즌에 반영되지 않습니다.', C.addDays(d, -1));
      finish(S, rng);
    }
    S.rng = rng.s;
    if (MK().scoutSync) MK().scoutSync(S, pr.date);
    return { kind: 'pre', stage: pr.stage };
  }
  function finish(S, rng) {
    const pr = S.pre;
    const L = S.league;
    const d0 = S.sched.start;
    FI() && FI().heal(S, d0);
    if (S.frep && !S.fStarted) MK().aiFill(S, d0);
    MK().refreshEntries(S, 0);
    pr.stage = 'done';
    S.phase = 'reg';
    const t = team(S, S.user);
    SE().msg(S, d0, '감독', '개막 엔트리', '개막 엔트리 29명을 확정했습니다. 선발 로테이션은 ' + t.rot.map((id) => L.players[id].name).join(', ') + ' 순서로 돕니다.' + (pr.inj.some((x) => L.players[x.id] && L.players[x.id].inj) ? ' 캠프 부상자는 회복하는 대로 합류합니다.' : ''));
    SE().msg(S, d0, '전력분석', L.year + ' 정규시즌 개막', '오늘 ' + C.fmtDate(d0, true) + ' 정규시즌이 개막합니다. 시즌 전 예상 순위는 ' + t.pred + '위.');

  function budgetFor(S, tid) {

  function userOffer(S, pid, aav, yrs) {

  function cancelOffer(S, pid) { const fa = S.off.fa; if (fa && fa.offers[pid]) delete fa.offers[pid][S.user]; }
  function score(S, p, tid, o) {

  function aiOffers(S, rng) {

  // 라운드 마감: 선수들이 가장 좋은 조건을 고름

    const fa = S.off.fa, P = S.league.players;

    const rng = rngOf(S, 31 + fa.round);

      const p = P[pid];

      const offers = fa.offers[pid] || {};

  // ================= 외국인 재계약 =================

  // ================= 신인 드래프트 =================

  // 올해 드래프트 후보(아마추어)를 1월 1일에 만들어 둠 → 1년 내내 스카우팅
  function makeDraftClass(S) {
    const L = S.league;
    const rng = rngOf(S, 41);
    const pool = [];
    for (let i = 0; i < 140; i++) {
      const pos = rng.pick(DSLOTS);
      const p = LG.makePlayer(rng, L, [pos, 3, 'D'], null, 0);
      p.team = null; p.pool = 'D'; p.svc = 0; p.yrs = 0; p.sal = 3000;

  function draftClass(S) {

      t.rec.vs = {};
      for (const o of L.teams) if (o.id !== t.id) t.rec.vs[o.id] = [0, 0, 0];
    }
    const sched = buildSchedule(L, rng);
    const FU = G.OD.Futures;
    FU.setup(L, rng);
    const fsched = FU.buildSchedule(L, rng, sched.days.length);
    const S = {
      app: 'ondiamond', v: 2, seed, league: L, user: userTeam || null, sched, fsched,
      dayIdx: 0, phase: 'reg', results: {}, boxes: {}, msgs: [], post: null, rng: rng.s, history: [],
      createdAt: Date.now(), offers: [], waivers: [], trans: [], dead: {}
    };
    if (G.OD.Market) { G.OD.Market.setupManagers(S, rng); G.OD.Market.setupForeign(S, rng); }
    if (G.OD.Military) G.OD.Military.setup(S, rng);
    if (G.OD.Finance) G.OD.Finance.setup(S, rng);
    return S;
  }
  function startCareer(S, tid) {
    S.user = tid;
    const t = team(S, tid);
    const tn = LG.teamName(t);
    const open = S.sched.days[0].date;
    S.msgs = [];
    if (G.OD.Camp) G.OD.Camp.start(S);
    const d0 = currentDate(S);
    msg(S, d0, '구단주', t.city + ' 구단주', tn + ' 단장 취임을 환영합니다. 올해 목표는 ' + t.goal.text + '입니다. 프런트 운영은 단장님께 맡기고, 현장은 감독이 책임집니다.');
    msg(S, d0, '전력분석', '전력분석팀', '시즌 전 예상 순위는 10개 구단 중 ' + t.pred + '위입니다. 개막은 ' + C.fmtDate(open, true) + '.');
    if (G.OD.Finance && S.fin) { G.OD.Finance.setupOwner(S); if (G.OD.Finance.setDirective && S.phase === 'pre') G.OD.Finance.setDirective(S, d0); }
    if (G.OD.Camp) preMsgs(S, d0);
    else msg(S, d0, '감독', '감독실', '개막 엔트리 29명을 확정했습니다. 선발 로테이션은 ' + t.rot.map((id) => S.league.players[id].name).join(', ') + ' 순서로 돕니다.');
  }
  function team(S, id) { return S.league.teams.find((t) => t.id === id); }
  // 난이도 불리함: 우리 전력(t.pw)이 상대보다 높을수록 우리 타석 확률을 깎음
  const GAP_K = 0.03;
  function hcapFor(S, h, a) {
    const D = C.diffOf(S);
    if (!D.gap || (h !== S.user && a !== S.user)) return null;
    const me = team(S, S.user), op = team(S, h === S.user ? a : h);
    if (me.pw == null || op.pw == null) for (const t of S.league.teams) t.pw = teamPower(S.league, t.id).total;
    const gap = me.pw - op.pw;
    return gap > 0 ? { tid: S.user, h: D.gap * gap * G.OD.Season.GAP_K } : null;
  }
  // 프리시즌 안내 (새 게임·새 시즌 공통)
  function preMsgs(S, d0) {
    const MK = G.OD.Market;
    if (S.frep && MK) { const c = MK.foreignCount(S, S.user); msg(S, d0, '스카우트팀', '외국인 선수 영입', '현재 외국인 ' + c.f + '/3명(같은 유형 최대 2명), 아시아쿼터 ' + c.a + '/1명. 이적시장의 외국인·아시아쿼터 탭에서 먼저 고르세요. 2월 1일 캠프가 출발하면 다른 9개 구단도 남은 후보로 영입을 마칩니다.'); }
    msg(S, d0, '감독', '스프링캠프 계획', '1월 31일까지 스프링캠프 계획을 정해 주세요. 1차·2차 캠프지와 훈련 중점, 1군 캠프에 데려갈 유망주(최대 5명)를 고를 수 있습니다. 명단은 제가 투수 22명·야수 20명으로 꾸립니다.');
  }
  function msg(S, date, from, title, body) {
    S.msgs.unshift({ id: (S.msgSeq = (S.msgSeq || 0) + 1), date, from, title, body, read: false });
    if (S.msgs.length > 100) S.msgs.length = 100;
  }

  // ---- 순위 ----
  function pct(r) { return r.w + r.l ? r.w / (r.w + r.l) : 0; }
  function standings(S) {
    const arr = S.league.teams.map((t) => ({ t, r: t.rec, pct: pct(t.rec) }));
    arr.sort((a, b) => (b.pct - a.pct) || (b.r.w - a.r.w) || ((b.r.rs - b.r.ra) - (a.r.rs - a.r.ra)));
    const top = arr[0];
    for (const x of arr) x.gb = ((top.r.w - x.r.w) + (x.r.l - top.r.l)) / 2;
    return arr;
  }

  // ---- 기록 순위 ----
  function teamGames(S, tid) { const r = team(S, tid).rec; return r.w + r.l + r.t; }
  function leaders(S, key, n) {
    const L = S.league, P = L.players;
    const out = [];
    const gp = {}; for (const t of L.teams) gp[t.id] = teamGames(S, t.id);
    const defs = {
      avg: { bat: 1, q: 'pa', v: (s) => s.ab ? s.h / s.ab : 0, f: (v) => C.avg3(v * 1000, 1000) },
      hr: { bat: 1, v: (s) => s.hr, f: String },
      rbi: { bat: 1, v: (s) => s.rbi, f: String },
      h: { bat: 1, v: (s) => s.h, f: String },
      sb: { bat: 1, v: (s) => s.sb, f: String },
      obp: { bat: 1, q: 'pa', v: (s) => obp(s), f: (v) => C.avg3(v * 1000, 1000) },
      ops: { bat: 1, q: 'pa', v: (s) => obp(s) + slg(s), f: (v) => v.toFixed(3).replace(/^0/, '') },
      era: { q: 'ip', low: 1, v: (s) => s.outs ? s.er * 27 / s.outs : 99, f: (v) => v.toFixed(2) },
      w: { v: (s) => s.w, f: String },
      so: { v: (s) => s.pso, f: String },
      sv: { v: (s) => s.sv, f: String },
      hld: { v: (s) => s.hld, f: String },
      whip: { q: 'ip', low: 1, v: (s) => s.outs ? (s.ph + s.pbb) * 3 / s.outs : 99, f: (v) => v.toFixed(2) }
    };
    const d = defs[key];
    for (const id in P) {
      const p = P[id];
      if (!p.team || gp[p.team] == null) continue;
      const s = p.st;
      if (d.bat ? !!p.pr : !p.pr) continue;
      if (d.q === 'pa' && s.pa < gp[p.team] * 3.1) continue;
      if (d.q === 'ip' && s.outs < gp[p.team] * 3) continue;
      if (!d.q && !d.v(s)) continue;
      out.push({ p, v: d.v(s) });
    }
    out.sort((a, b) => d.low ? a.v - b.v : b.v - a.v);
    return out.slice(0, n || 10).map((x) => ({ p: x.p, v: x.v, f: d.f(x.v) }));
  }
  function obp(s) { const den = s.ab + s.bb + s.hbp + s.sf; return den ? (s.h + s.bb + s.hbp) / den : 0; }
  function slg(s) { return s.ab ? (s.h + s.d + 2 * s.t + 3 * s.hr) / s.ab : 0; }

  // ---- 경기 결과 반영 ----
  function applyResult(S, g, res, date) {
    const H = team(S, g.h), A = team(S, g.a);
    H.rec.rs += res.hs; H.rec.ra += res.as; A.rec.rs += res.as; A.rec.ra += res.hs;
    const mark = (t, k, home, opp) => {
      const r = t.rec; r[k]++;
      const idx = k === 'w' ? 0 : k === 'l' ? 1 : 2;
      (home ? r.home : r.away)[idx]++;
      r.vs[opp][idx]++;
      if (k !== 't') {
        r.last10.push(k === 'w' ? 1 : 0); if (r.last10.length > 10) r.last10.shift();
        r.streak = k === 'w' ? (r.streak > 0 ? r.streak + 1 : 1) : (r.streak < 0 ? r.streak - 1 : -1);
      }
    };
    if (!res.tie && H.mgr && A.mgr) { if (res.hs > res.as) { H.mgr.w++; A.mgr.l++; } else { A.mgr.w++; H.mgr.l++; } }
    if (res.tie) { mark(H, 't', true, A.id); mark(A, 't', false, H.id); }
    else if (res.hs > res.as) { mark(H, 'w', true, A.id); mark(A, 'l', false, H.id); }
    else { mark(H, 'l', true, A.id); mark(A, 'w', false, H.id); }
  }

  // ---- 감독 AI 엔트리 정리 + 우리 구단 1군·2군 이동 기록 ----
  function resetEntries(S, date, cal) {
    const L = S.league;
    const mine = team(S, S.user);
    const before = mine && mine.entry ? new Set(mine.entry) : null;
    for (const t of L.teams) SIM.setEntry(L, t.id, cal);
    if (G.OD.Futures && L.fteams) G.OD.Futures.resetAll(L);
    if (C.diffOf(S).gap) for (const t of L.teams) t.pw = teamPower(L, t.id).total;
    if (!before || !mine) return;
    const after = new Set(mine.entry);
    const up = mine.entry.filter((id) => !before.has(id));
    const down = [...before].filter((id) => !after.has(id));
    if (!up.length && !down.length) return;
    S.moves = S.moves || [];
    S.moves.unshift({ date, up, down });
    if (S.moves.length > 40) S.moves.length = 40;
    const nm = (ids) => ids.map((id) => L.players[id].name).join(', ');
    msg(S, date, '감독', '엔트리 변경', (up.length ? '1군 등록: ' + nm(up) + '. ' : '') + (down.length ? '퓨처스행: ' + nm(down) + '.' : ''));
  }
  // 우리 구단 경기: 박스스코어는 모두, 문자 중계는 최근 30경기만 저장
  function keepDetail(S, gid, res) {
    if (res.box) { S.boxes[gid] = res.box; delete res.box; }
    if (res.log) {
      S.logs = S.logs || {}; S.logOrder = S.logOrder || [];
      S.logs[gid] = res.log; S.logOrder.push(gid); delete res.log;
      while (S.logOrder.length > 30) delete S.logs[S.logOrder.shift()];
    }
  }

  // ---- 하루 진행 ----
  function advance(S) {
    if (S.phase === 'pre' && G.OD.Camp) return G.OD.Camp.advance(S);
    if (S.phase === 'reg') return advanceReg(S);
    if (S.phase === 'post') return advancePost(S);
    return null;
  }
  function advanceReg(S) {
    const L = S.league;
    const day = S.sched.days[S.dayIdx];
    if (!day) { startPost(S); return { kind: 'post-start' }; }
    const rng = new RNG(S.rng);
    const MK = G.OD.Market;
    if (MK) MK.processWaivers(S, day.date);
    if (MK && MK.scoutSync) MK.scoutSync(S, day.date);
    const FI = G.OD.Finance;
    if (FI && S.fin && FI.heal(S, day.date) && S.dayIdx > 0) resetEntries(S, day.date, day.cal);
    // 병역: 전역 복귀, 6월 상무 모집, 아시안게임
    if (G.OD.Military && G.OD.Military.daily(S, day.date, rng)) resetEntries(S, day.date, day.cal);
    // 개막일: 다른 구단 외국인 영입 (단장은 개막 전에 먼저 고름)
    if (MK && S.dayIdx === 0 && S.frep && !S.fStarted) MK.aiFill(S, day.date);
    // 감독 AI: 주 1회(화요일) 엔트리 재조정, 개막일
    if (S.dayIdx === 0 || C.weekday(day.date) === 2) {
      resetEntries(S, day.date, day.cal);
      if (MK && S.dayIdx > 0) MK.weekly(S, day.date, rng);
    }
    const out = [];
    const dayInj = [];
    for (const g of day.games) {
      const mine = g.h === S.user || g.a === S.user;
      const res = SIM.simGame(L, g.h, g.a, { rng, cal: day.cal, box: mine, log: mine, date: day.date, hcap: mine ? hcapFor(S, g.h, g.a) : null });
      if (res.inj) dayInj.push(...res.inj);
      applyResult(S, g, res, day.date);
      keepDetail(S, g.id, res);
      res.date = day.date;
      S.results[g.id] = res;
      g.done = 1;
      out.push(g.id);
    }
    if (G.OD.Futures && L.fteams) { const fi = G.OD.Futures.playDay(S, S.dayIdx, day.date, day.cal, rng); if (fi) dayInj.push(...fi); }
    if (FI && S.fin) {
      FI.daySettle(S, day, day.games);
      if (dayInj.length) { FI.onInjuries(S, dayInj, day.date); resetEntries(S, day.date, day.cal); }
    }
    S.rng = rng.s;
    S.dayIdx++;
    afterDay(S, day);
    if (S.dayIdx >= S.sched.days.length) startPost(S);
    return { kind: 'day', date: day.date, games: out };
  }
  function afterDay(S, day) {
    const t = team(S, S.user);
    if (!t) return;
    const st = t.rec.streak;
    if (G.OD.Finance && (st === 5 || st === -5)) G.OD.Finance.fanSay(S, S.user, st > 0 ? 'win' : 'lose', day.date, Math.abs(st) + (st > 0 ? '연승' : '연패'));
    if (st === 5 || st === 8 || st === 10) msg(S, day.date, '감독', st + '연승', '선수단 분위기가 좋습니다. ' + st + '연승을 달리고 있습니다.');
    if (st === -6 || st === -9) msg(S, day.date, '감독', Math.abs(st) + '연패', Math.abs(st) + '연패 중입니다. 현장에서 반등 방법을 찾고 있습니다.');
    // 월간 보고: 다음 경기 날짜가 다음 달이면
    const next = S.sched.days[S.dayIdx];
    if (next && next.date.slice(5, 7) !== day.date.slice(5, 7)) {
      const rank = standings(S).findIndex((x) => x.t.id === t.id) + 1;
      if (G.OD.Finance && S.owner) G.OD.Finance.monthly(S, day.date);
      msg(S, day.date, '전력분석', Number(day.date.slice(5, 7)) + '월 결산', t.rec.w + '승 ' + t.rec.l + '패 ' + t.rec.t + '무, 현재 ' + rank + '위입니다. 득점 ' + t.rec.rs + ', 실점 ' + t.rec.ra + '.');
    }
  }

  // ---- 포스트시즌 ----
  const ROUNDS = [
    { key: 'wc', name: '와일드카드 결정전', short: 'WC', seedHi: 4, need: 2, hiStart: 1, home: [1, 1] },
    { key: 'spo', name: '준플레이오프', short: '준PO', seedHi: 3, need: 3, hiStart: 0, home: [1, 1, 0, 0, 1] },
    { key: 'po', name: '플레이오프', short: 'PO', seedHi: 2, need: 3, hiStart: 0, home: [1, 1, 0, 0, 1] },
    { key: 'ks', name: '한국시리즈', short: 'KS', seedHi: 1, need: 4, hiStart: 0, home: [1, 1, 0, 0, 0, 1, 1] }
  ];
  function startPost(S) {
    if (S.phase !== 'reg') return;
    const st = standings(S);
    const seeds = st.slice(0, 5).map((x) => x.t.id);
    if (G.OD.Finance && S.fin) for (const id of seeds) if (G.OD.Finance.bcastOf(S, id) === 'SBS') S.fin[id].rev.tv += G.OD.Finance.BCAST.SBS.ps * (id === S.user ? C.diffOf(S).rev : 1);
    const last = S.sched.days[S.sched.days.length - 1];
    S.phase = 'post';
    S.post = {
      seeds, ri: 0, date: C.addDays(last.date, 3), cal: last.cal + 3,
      rounds: ROUNDS.map((r) => ({ key: r.key, name: r.name, short: r.short, hi: seeds[r.seedHi - 1], lo: r.key === 'wc' ? seeds[4] : null, wHi: r.hiStart, wLo: 0, games: [], winner: null })),
      champ: null
    };
    S.final = st.map((x) => x.t.id);
    st.forEach((x, i) => { x.t.lastRank = i + 1; });
    if (G.OD.Finance) for (let i = 0; i < 5; i++) G.OD.Finance.fanEvent(S, S.final[i], 6, 'post', last.date);
    if (G.OD.Futures && S.league.fteams) G.OD.Futures.championship(S, last.date, last.cal + 1);
    const t = team(S, S.user);
    const rank = S.final.indexOf(S.user) + 1;
    msg(S, last.date, '전력분석', '정규시즌 종료', LG.teamName(t) + ' ' + t.rec.w + '승 ' + t.rec.l + '패 ' + t.rec.t + '무, 최종 ' + rank + '위. ' + (rank <= 5 ? '가을야구에 나섭니다.' : '포스트시즌 진출에 실패했습니다.'));
  }
  function advancePost(S) {
    const po = S.post;
    const rd = po.rounds[po.ri];
    const def = ROUNDS[po.ri];
    const L = S.league;
    if (!rd) { S.phase = 'done'; return null; }
    const rng = new RNG(S.rng);
    if (po.ri === 0 && !rd.games.length) resetEntries(S, po.date, po.cal);
    const gi = rd.games.length;
    const hiHome = def.home[Math.min(gi, def.home.length - 1)];
    const h = hiHome ? rd.hi : rd.lo, a = hiHome ? rd.lo : rd.hi;
    const mine = h === S.user || a === S.user;
    const res = SIM.simGame(L, h, a, { rng, cal: po.cal, box: true, log: mine, post: true, hcap: mine ? hcapFor(S, h, a) : null }); // 포스트시즌은 모든 경기 박스스코어 저장
    const gid = 'p' + po.ri + '_' + gi;
    keepDetail(S, gid, res);
    if (G.OD.Finance && S.fin) G.OD.Finance.postGame(S, res);
    res.date = po.date; res.round = rd.key;
    S.results[gid] = res;
    rd.games.push(gid);
    if (!res.tie) {
      const hiWon = (res.hs > res.as) === (h === rd.hi);
      if (hiWon) rd.wHi++; else rd.wLo++;
    }
    S.rng = rng.s;
    po.date = C.addDays(po.date, 1); po.cal++;
    const T = (id) => LG.teamName(team(S, id));
    if (rd.wHi >= def.need || rd.wLo >= def.need) {
      rd.winner = rd.wHi >= def.need ? rd.hi : rd.lo;
      const loser = rd.winner === rd.hi ? rd.lo : rd.hi;
      const nx = po.rounds[po.ri + 1];
      if (nx) nx.lo = rd.winner;
      if (rd.winner === S.user || loser === S.user) {
        if (rd.key === 'ks' && rd.winner === S.user) msg(S, res.date, '구단주', '통합 우승', '한국시리즈 우승을 축하합니다! ' + T(S.user) + '가 정상에 올랐습니다.');
        else msg(S, res.date, '감독', rd.name + (rd.winner === S.user ? ' 통과' : ' 탈락'), rd.name + '에서 ' + T(rd.winner) + '가 ' + T(loser) + '를 꺾었습니다.');
      }
      po.ri++;
      po.date = C.addDays(po.date, 1); po.cal++;
      if (po.ri >= po.rounds.length) {
        po.champ = rd.winner; S.phase = 'done';
        if (rd.winner !== S.user) msg(S, res.date, '리그', '한국시리즈 종료', T(rd.winner) + '가 한국시리즈 우승을 차지했습니다.');
        S.history.push({ year: L.year, champ: rd.winner, final: S.final.slice() });
      }
    }
    return { kind: 'post', gid };
  }

  // 사용자 팀의 다음 경기
  function nextGame(S) {
    if (S.phase === 'reg') {
      for (let i = S.dayIdx; i < S.sched.days.length; i++) {
        const d = S.sched.days[i];
        const g = d.games.find((x) => x.h === S.user || x.a === S.user);
        if (g) return { date: d.date, g, dayIdx: i };
      }
    }
    if (S.phase === 'post') {
      const rd = S.post.rounds[S.post.ri];
      if (rd && rd.lo && (rd.hi === S.user || rd.lo === S.user)) {
        const def = ROUNDS[S.post.ri];
        const gi = rd.games.length;
        const hiHome = def.home[Math.min(gi, def.home.length - 1)];
        return { date: S.post.date, g: { h: hiHome ? rd.hi : rd.lo, a: hiHome ? rd.lo : rd.hi }, post: rd };
      }
    }
    return null;
  }
  function currentDate(S) {
    if (S.phase === 'off' && S.off) return S.off.date;
    if (S.phase === 'pre' && S.pre) return S.pre.date;
    if (S.phase === 'reg') { const d = S.sched.days[S.dayIdx]; return d ? d.date : S.sched.days[S.sched.days.length - 1].date; }
    if (S.post) return S.post.date;

        (FI.cash ? '<dt>보유 현금</dt><dd>' + C.moneyShort(Math.round(FI.cash(S, S.user))) + '</dd>' : '') + '</dl>', 'data-nav="club"'));

  // ---- 표 정렬: 머리글을 누르면 내림차순 ↔ 오름차순 ----
  const TEXT_KEYS = { name: 1, role: 1, pos: 1 };
  function sortState(scope) { ui.sorts = ui.sorts || {}; return ui.sorts[scope] || null; }
  function sortTh(scope, key, label, cls) {
    const st = sortState(scope), on = st && st.k === key;
    const arrow = on ? (st.d < 0 ? '▼' : '▲') : '';
    return '<th class="srt' + (cls ? ' ' + cls : '') + (on ? ' on' : '') + '" aria-sort="' + (on ? (st.d < 0 ? 'descending' : 'ascending') : 'none') + '"><button data-tsort="' + scope + ':' + key + '">' + label + '<i aria-hidden="true">' + arrow + '</i></button></th>';
  }
  // val(p, key) → 숫자·문자 또는 null(모름: 항상 맨 아래)
  function applySort(list, scope, val) {
    const st = sortState(scope);
    if (!st) return list;
    return list.map((p, i) => [p, val(p, st.k), i]).sort((a, b) => {
      const x = a[1], y = b[1];
      if (x == null && y == null) return a[2] - b[2];
      if (x == null) return 1; if (y == null) return -1;
      const c = typeof x === 'string' ? x.localeCompare(y, 'ko') : x - y;
      return c * st.d || a[2] - b[2];
    }).map((x) => x[0]);
  }
  function squadHTML() {
    const tid = ui.sqTeam || S.user;

    let h = '<div class="wrap"><section class="card">' + teamHeadHTML(tid, '1군') +
      '<div class="tabs" role="tablist">' + [['pit', '투수 ' + all.filter((p) => p.pr && ent.has(p.id)).length], ['bat', '야수 ' + all.filter((p) => !p.pr && ent.has(p.id)).length]].map(([k, n]) => '<button class="chip' + (ui.sqTab === k ? ' on' : '') + '" data-sqtab="' + k + '" role="tab" aria-selected="' + (ui.sqTab === k) + '">' + n + '</button>').join('') + '</div>' +

    const pit = ui.sqTab === 'pit';
    const list = pit ? all.filter((p) => p.pr && ent.has(p.id)).sort((a, b) => orderP(t, a) - orderP(t, b))

    const sorted = applySort(list, 'sq', (p, k) => k === 'name' ? p.name : k === 'role' ? (pit ? orderP(t, p) : LG.POS.indexOf(p.pos)) : k === 'age' ? p.age : k === 'ca' ? p.ca : k === 'pa' ? p.pa : k === 'sal' ? p.sal : null);

    const others = S.league.teams.filter((t) => t.id !== S.user);
    if (!T.partner || T.partner === S.user) T.partner = others[0].id;
    T.give = T.give.filter((id) => P[id].team === S.user);
    T.get = T.get.filter((id) => P[id].team === T.partner);
    T.pgive = (T.pgive || []).filter((k) => MK.pickOwner(S, k) === S.user && MK.pickYears(S).includes(MK.pickParse(k).y));
    T.pget = (T.pget || []).filter((k) => MK.pickOwner(S, k) === T.partner && MK.pickYears(S).includes(MK.pickParse(k).y));
    const pk = { give: T.pgive, get: T.pget };
    const pt = team(T.partner);
    const dl = MK.deadline(S.league.year);
    const left = Math.round((Date.parse(dl) - Date.parse(date)) / 864e5);
    let h = '<section class="card"><div class="bar-row"><div><div class="eyebrow">트레이드 마감 ' + C.fmtDate(dl) + '</div><b>' + (open ? (left > 0 ? '마감까지 ' + left + '일' : '오늘 마감') : S.phase === 'reg' ? '마감됨 · 오프시즌에 다시 열립니다' : '지금은 트레이드 기간이 아닙니다') + '</b></div>' +
      '<label style="display:flex;gap:8px;align-items:center"><span class="muted" style="font-size:12.5px">상대 구단</span><select class="sel" id="tPartner">' + others.map((t) => '<option value="' + t.id + '"' + (t.id === T.partner ? ' selected' : '') + '>' + esc(LG.teamName(t)) + '</option>').join('') + '</select></label></div>' +
      '<p class="muted" style="font-size:12.5px;margin:10px 0 0">한쪽에서 선수 최대 ' + MK.MAX_SIDE + '명, 신인 지명권 최대 ' + MK.MAX_SIDE + '장까지 주고받습니다. 상대 단장은 선수 가치, 나이, 연봉, 자기 팀 사정(우승 경쟁·리빌딩)과 그 자리가 필요한지를 보고 답합니다.</p></section>';
    // 요약
    const chip = (id, side) => '<button class="tchip" data-tsel="' + side + ':' + id + '" aria-label="' + esc(P[id].name) + ' 빼기">' + esc(P[id].name) + ' <span class="muted">' + (P[id].pr ? roleOf(P[id]) : LG.POS_SHORT[P[id].pos]) + '</span> ✕</button>';
    const pchip = (k, side) => '<button class="tchip pk" data-tpk="' + side + ':' + k + '" aria-label="지명권 빼기">' + esc(MK.pickLabel(S, k, true)) + ' <span class="muted">지명권</span> ✕</button>';
    const ev = (T.give.length || T.get.length || T.pgive.length || T.pget.length) ? MK.evaluate(S, S.user, T.partner, T.give, T.get, date, pk) : null;
    const cap = LG.capFor(S.league.year);
    h += '<section class="card tsum"><div class="tcols"><div><div class="eyebrow">' + esc(team(S.user).name) + '이(가) 보냄</div><div class="tchips">' + (T.give.map((id) => chip(id, 'give')).concat(T.pgive.map((k) => pchip(k, 'pgive'))).join('') || '<span class="muted">아래에서 고르세요</span>') + '</div></div>' +
      '<div><div class="eyebrow">' + esc(pt.name) + '에서 받음</div><div class="tchips">' + (T.get.map((id) => chip(id, 'get')).concat(T.pget.map((k) => pchip(k, 'pget'))).join('') || '<span class="muted">아래에서 고르세요</span>') + '</div></div></div>';
    if (ev) {
      h += '<dl class="kv tinfo"><dt>연봉 변화</dt><dd class="num">' + (ev.dPay >= 0 ? '+' : '') + C.money(ev.dPay) + '</dd><dt>경쟁균형세 기준</dt><dd class="num' + (ev.payAfter > cap ? ' lo' : '') + '">' + C.money(ev.payAfter) + ' / 상한 ' + C.money(cap) + (ev.payAfter > cap ? ' · 초과분 30% 납부' : '') + '</dd><dt>선수 수</dt><dd class="num">' + ev.rosterAfter + '명</dd></dl>';
      if (ev.problems.length) h += '<ul class="probs">' + ev.problems.map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul>';
    }
    h += '<div class="sim-row" style="margin-top:12px"><button class="btn primary" data-tact="propose"' + (ev && !ev.problems.length ? '' : ' disabled') + '>제안하기</button><button class="btn ghost" data-tact="clear">비우기</button></div>';
    if (T.res) {
      const r = T.res;
      const pctv = Math.min(150, Math.round(r.ratio * 100));
      h += '<div class="reply' + (r.accept ? ' ok' : '') + '"><div class="reply-h">' + patch(pt, 24) + '<b>' + esc(pt.name) + ' 단장</b></div><p>"' + esc(r.reply) + '"</p>' +
        '<div class="meter" aria-label="상대가 느끼는 매력도 ' + pctv + '%"><i style="width:' + (pctv / 1.5) + '%"></i><span class="mk" style="left:' + (100 / 1.5) + '%"></span></div><div class="muted" style="font-size:12px">상대가 느끼는 매력도 ' + pctv + '% (100% 이상이면 수락)</div>' +
        (r.notes.length ? '<div class="muted" style="font-size:12.5px;margin-top:6px">' + r.notes.map(esc).join(' · ') + '</div>' : '') +
        (r.accept ? '<div style="margin-top:12px"><button class="btn primary" data-tact="confirm">트레이드 확정</button></div>' : '') + '</div>';
    }
    h += '</section>';
    h += '<div class="grid2 even"><section class="card"><div class="card-h"><h2>우리 선수</h2><span class="muted" style="font-size:12.5px">' + LG.teamPlayers(S.league, S.user).length + '명</span></div>' + tradeSideList(S.user, 'give', T.mf) + '</section>' +
      '<section class="card"><div class="card-h"><h2>' + esc(pt.name) + ' 선수</h2><span class="muted" style="font-size:12.5px">' + LG.teamPlayers(S.league, pt.id).length + '명</span></div>' + tradeSideList(pt.id, 'get', T.tf) + '</section></div>';
    return h;
  }
  // 외국인 협상 입력·가로채기 카드
  function negoBox(p) {
    const cap = p.pool === 'F' ? MK.F_CAP : MK.A_CAP;
    return '<div class="inline-confirm nego"><label class="nego-l">제안 연봉 <input type="number" class="nego-in" id="nego-' + p.id + '" value="' + p.ask + '" min="1" max="' + cap + '" inputmode="numeric" aria-label="제안 연봉 (만 달러)"> 만 달러</label><span class="muted" style="font-size:12px">에이전트 희망 ' + p.ask + '만 달러 · 상한 ' + cap + '만</span><span class="sim-row"><button class="btn sm primary" data-nego="go:' + p.id + '">제안하기</button><button class="btn sm ghost" data-nego="no:' + p.id + '">취소</button></span></div>';
  }
  function hijackCard() {

  }
  function foreignHTML(kind) {

    const c = MK.foreignCount(S, S.user);
    const isF = kind === 'F';
    const mine = LG.teamPlayers(S.league, S.user).filter((p) => p.foreign === (isF ? 1 : 2));
    const used = S.frep[S.user] || 0;
    const dl = MK.fDeadline(S.league.year);
    let h = hijackCard() + '<section class="card"><div class="fstat">' +
      '<div><div class="eyebrow">' + (isF ? '외국인 선수' : '아시아쿼터') + '</div><b class="disp" style="font-size:26px">' + (isF ? c.f + ' / ' + MK.F_MAX + '명' : c.a + ' / ' + MK.A_MAX + '명') + '</b>' + (isF ? '<div class="muted" style="font-size:12.5px">투수 ' + c.fp + ' · 타자 ' + c.fb + ' (같은 유형 최대 ' + MK.F_SAME + '명)</div>' : '<div class="muted" style="font-size:12.5px">아시아 국적·호주, 아시아 리그 출신</div>') + '</div>' +
      '<dl class="kv"><dt>신규 계약 상한</dt><dd class="num">' + (isF ? MK.F_CAP : MK.A_CAP) + '만 달러</dd>' + (isF ? '<dt>연봉 합계</dt><dd class="num' + (MK.fTotal(S, S.user) > MK.F_TOTAL_CAP * 0.85 ? ' lo' : '') + '">' + C.money(MK.fTotal(S, S.user)) + ' / 40억</dd>' : '') + '<dt>영입 마감</dt><dd>' + C.fmtDate(dl) + '</dd><dt>시즌 중 교체</dt><dd>' + (S.fStarted ? (MK.F_REPLACE - used) + '번 남음 (외국인·아시아쿼터 합산)' : '개막 전 영입은 교체로 치지 않음') + '</dd></dl></div>';
    if (!S.fStarted) h += '<div class="scout-note" style="margin-top:12px">' + (S.phase === 'pre' ? '2월 1일 스프링캠프가 출발하면 다른 9개 구단이 남은 후보로 영입을 마칩니다. 1월에는 \'1주 진행\'으로 스카우트 정보를 모으면서 고를 수 있습니다.' : '개막 전입니다. 지금 먼저 고르세요. 첫 경기를 진행하면 다른 9개 구단이 남은 후보로 영입을 마칩니다.') + '</div>';
    h += '</section>';
    // 우리 선수
    h += '<section class="card"><div class="card-h"><h2>우리 ' + (isF ? '외국인' : '아시아쿼터') + '</h2></div>';
    if (!mine.length) h += '<div class="empty">아직 없습니다. 아래 후보 중에서 계약하세요.</div>';
    else h += '<div class="plist">' + mine.map((p) => { const s = p.st; const rec = p.pr ? (s.pg ? s.w + '승 ' + s.l + '패 ERA ' + C.era(s.er, s.outs) : '1군 기록 없음') : (s.g ? C.avg3(s.h, s.ab) + ' ' + s.hr + '홈런' : '1군 기록 없음');
      return '<button class="prow" data-player="' + p.id + '"><span class="pr-n">' + esc(p.name) + '</span>' + starsHTML(p.ca) + '<span class="pr-m muted">' + esc(p.nat) + ' · ' + (p.pr ? roleOf(p) : LG.POS_SHORT[p.pos]) + ' · ' + p.age + '세 · ' + rec + '</span><span class="pr-r"><span class="num">' + C.moneyShort(p.sal) + '</span></span></button>'; }).join('') + '</div>';
    h += '<p class="muted" style="font-size:12.5px;margin:10px 0 0">교체하려면 선수 프로필에서 방출한 뒤 새 후보와 계약하세요.</p></section>';
    // 후보: 표 (포지션·나이·능력치·연봉, 머리글로 정렬)
    const f = ui.fFilter === 'bat' ? 'bat' : 'pit';
    const pitT = f === 'pit';
    let cands = MK.pool(S, kind).filter((p) => !!p.pr === pitT);
    cands.sort((a, b) => ((b.scout == null ? -1 : b.scout) - (a.scout == null ? -1 : a.scout)) || a.ask - b.ask);
    const COLS = pitT ? [['stf', '구위'], ['ctl', '제구'], ['mov', '무브'], ['sta', '체력'], ['velo', '구속']] : [['con', '컨택'], ['pow', '파워'], ['gap', '갭'], ['eye', '선구안'], ['spd', '주력'], ['fld', '수비']];
    const shown = (p, k) => k === 'velo' ? MK.scoutVelo(p, p.pr.velo) : MK.scoutAttr(p, k, pitT ? p.pr[k] : p.br[k]);
    const mid = (v) => v == null ? null : typeof v === 'object' ? (v.lo + v.hi) / 2 : v;
    const scope = 'f' + kind + f;
    cands = applySort(cands, scope, (p, k) => k === 'name' ? p.name : k === 'pos' ? (pitT ? (p.role === 'SP' ? 0 : 1) * 2 + (p.throws === 'L' ? 0 : 1) : LG.POS.indexOf(p.pos)) : k === 'age' ? p.age : k === 'grade' ? p.scout : k === 'ask' ? p.ask : k === 'sk' ? (p.sk || 0) : mid(shown(p, k)));
    const cell = (v, k) => v == null ? '<td class="fc"><span class="fm-v hid" aria-label="알 수 없음"></span></td>' : typeof v === 'object' ? '<td class="fc rng' + (k === 'velo' ? '' : ' v' + vcls(mid(v))) + '">' + v.lo + '~' + v.hi + '</td>' : '<td class="fc' + (k === 'velo' ? '' : ' v' + vcls(v)) + '"><b>' + v + '</b></td>';
    h += '<section class="card"><div class="card-h"><h2>' + (isF ? '외국인' : '아시아쿼터') + ' 후보</h2><span class="muted" style="font-size:12.5px">' + cands.length + '명</span></div>' +
      '<div class="tabs" style="margin-bottom:10px">' + [['pit', '투수 ' + MK.pool(S, kind).filter((p) => p.pr).length], ['bat', '타자 ' + MK.pool(S, kind).filter((p) => !p.pr).length]].map(([k, nm]) => '<button class="chip' + (f === k ? ' on' : '') + '" data-ff="' + k + '">' + nm + '</button>').join('') + '</div>' +
      '<p class="muted" style="font-size:12.5px;margin:0 0 10px">처음엔 등급과 능력치가 공개되지 않습니다. 해외 스카우트를 그 선수가 뛰는 지역(북중미·일본·호주)에 보내면 1주마다 정보가 쌓여 범위가 좁아지고 정확해집니다. 지난 시즌 기록과 요구 연봉은 누구나 볼 수 있습니다. 머리글을 누르면 정렬되고, 다시 누르면 순서가 뒤집힙니다.</p>' + scoutSummary('F') +
      '<div class="tbl-wrap" style="margin-top:10px"><table class="t ftbl"><thead><tr>' + sortTh(scope, 'name', '선수', 'l') + sortTh(scope, 'pos', pitT ? '역할' : '포지션', 'l') + sortTh(scope, 'age', '나이') + sortTh(scope, 'grade', '평가', 'l') +
      COLS.map(([k, n]) => sortTh(scope, k, n)).join('') + '<th class="l">지난 시즌</th>' + sortTh(scope, 'ask', '희망 연봉') + sortTh(scope, 'sk', '스카우팅', 'l') + '<th class="l"></th></tr></thead><tbody>';
    for (const p of cands) {
      const err = MK.signCheck(S, S.user, p, date);

        '<td class="l txt">' + (pitT ? (p.role === 'SP' ? '선발' : '구원') + ' · ' + (p.throws === 'L' ? '좌완' : '우완') : LG.POS_SHORT[p.pos] + ' · ' + (p.bats === 'L' ? '좌타' : p.bats === 'S' ? '양타' : '우타')) + '</td><td>' + p.age + '</td><td class="l">' + estStars(p.scout) + '</td>' +
        COLS.map(([k]) => cell(shown(p, k), k)).join('') + '<td class="l txt muted fprev">' + esc(p.prev) + '</td><td class="num"><b>' + usd(p) + '</b></td><td class="l">' + scoutCell(p) + '</td>' +

      if (ui.nego === p.id && !err) h += '<tr class="nego-tr"><td colspan="' + (COLS.length + 9) + '">' + negoBox(p) + '</td></tr>';
    }
    if (!cands.length) h += '<tr><td colspan="' + (COLS.length + 9) + '" class="empty">남은 후보가 없습니다. 매달 새 후보가 들어옵니다.</td></tr>';
    return h + '</tbody></table></div></section>';
  }
  // ---- 스카우팅 표시 ----
  function estStars(v, lg) { return v == null ? '<span class="qstar" title="스카우트가 아직 평가하지 못했습니다">미공개</span>' : starsHTML(v, lg); }

  function scoutSummary(kind) {

  function amateurHTML() {

    let ps = ids.map((id) => P[id]).filter(Boolean);
    if (f === 'pit') ps = ps.filter((p) => p.pr); else if (f === 'bat') ps = ps.filter((p) => !p.pr); else if (f === 'on') ps = ps.filter((p) => MK.scoutsOn(S, p) > 0);

    if (lf !== 'all') ps = ps.filter((p) => p.slvl === lf);
    const key = (p) => p.scoutPa == null ? p.scout * 0.3 - 10 : p.scoutPa * 0.7 + p.scout * 0.3;
    ps.sort((a, b) => key(b) - key(a) || (b.sk || 0) - (a.sk || 0));
    let h = '<section class="card"><div class="card-h"><h2>' + (S.league.year + 1) + ' 신인 드래프트 후보</h2><span class="muted" style="font-size:12.5px">' + ids.length + '명 · 12월 드래프트</span></div>' +
      '<p class="muted" style="font-size:12.5px;margin:0 0 10px">처음엔 등급이 공개되지 않습니다. 스카우트를 지역의 고교나 대학에 보내면 그곳 후보들의 정보가 매주 쌓여 등급이 드러나고 점점 정확해집니다. 같은 곳에 여러 명을 보내면 더 빨라집니다.</p>' + scoutSummary('D') +

    h += '<div><section class="card"><div class="card-h"><h2>해외 스카우트</h2><span class="muted" style="font-size:12.5px">외국인·아시아쿼터</span></div><div class="scouts">' +
      st.F.map((x, i) => '<div class="scout-row"><b>' + esc(x.name) + '</b><select class="sel" data-sreg="F:' + i + '" aria-label="' + esc(x.name) + ' 스카우트 지역">' + opt(MK.FREG, x.reg) + '</select>' + (x.reg ? '<span class="muted">1주 ' + C.moneyShort(MK.FREG.find((r) => r.id === x.reg).cost) + '</span>' : '<span class="muted">비용 없음</span>') + '</div>').join('') + '</div>' +
      '<div class="tbl-wrap" style="margin-top:12px"><table class="t"><thead><tr><th class="l">지역 · 리그</th><th>후보</th><th>스카우트</th><th>파악</th></tr></thead><tbody>' +
      MK.FREG.map((r) => { const o = fs[r.id]; const n = st.F.filter((x) => x.reg === r.id).length; return '<tr><td class="l txt reg-cell"><b>' + esc(r.name) + '</b><small class="muted">' + esc(r.note) + '</small></td><td>' + (o ? o.n : 0) + '</td><td>' + (n ? '<span class="badge acc">' + n + '</span>' : '-') + '</td><td>' + pct(o) + '</td></tr>'; }).join('') + '</tbody></table></div>' +
      '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-gomkt="foreign">외국인 후보 보기</button><button class="btn sm ghost" data-gomkt="asia">아시아쿼터 후보 보기</button></div></section>';

        team.map(([x, i]) => '<div class="scout-row"><b>' + esc(x.name) + '</b><select class="sel" data-sreg="D:' + i + '" aria-label="' + esc(x.name) + ' 스카우트 권역">' + opt(regs, x.reg) + '</select></div>').join('') + '</div>' +
        '<div class="tbl-wrap" style="margin-top:12px"><table class="t"><thead><tr><th class="l">권역</th><th>후보</th><th>스카우트</th><th>파악</th><th class="l">눈에 띄는 선수</th></tr></thead><tbody>' +
        regs.map((r) => { const o = ds[r.id + ':' + lvl]; const n = st.D.filter((x) => x.reg === r.id).length;

        sch.map((x) => '<tr><td class="l txt"><b>' + esc(x.t.name) + '</b>' + (x.t.note ? '<small class="muted" style="display:block">' + esc(x.t.note) + '</small>' : '') + '</td><td>' + (x.t.lvl === 'H' ? '고교' : '대학') + '</td><td class="l txt">' + esc(x.t.when) + '<small class="muted" style="display:block">4강 ' + C.fmtDate(x.semi) + ' · 결승 ' + C.fmtDate(x.fin) + '</small></td>' +
          '<td class="l txt">' + (x.four ? esc(x.four.join(', ')) : x.skipped ? '<span class="muted">이미 끝남</span>' : '<span class="muted">예정</span>') + '</td><td class="l txt">' + (x.win ? '<b>' + esc(x.win) + '</b> · ' + esc(x.ru) : '<span class="muted">-</span>') + '</td></tr>').join('') + '</tbody></table></div></section>';
    }
    return h + '</div>';
  }
  function offersHTML() {

      const T = team(o.from);

      return '<section class="card offer"><div class="card-h"><h2 class="tn-cell">' + patch(T, 28) + esc(LG.teamName(T)) + '</h2><span class="muted" style="font-size:12.5px">' + C.fmtDate(o.until) + '까지</span></div>' +
        '<div class="tcols"><div><div class="eyebrow">그쪽이 원하는 것</div>' + li(o.get) + (o.pkGet || []).map((k) => '<div class="tchip pk">' + esc(MK.pickLabel(S, k, true)) + ' 지명권</div>').join('') + (o.cash < 0 ? '<div class="tchip pk">현금 ' + C.money(-o.cash) + '</div>' : '') + '</div><div><div class="eyebrow">대신 주는 것</div>' + li(o.give) + (o.pkGive || []).map((k) => '<div class="tchip pk">' + esc(MK.pickLabel(S, k, true)) + ' 지명권</div>').join('') + (o.cash > 0 ? '<div class="tchip pk">현금 ' + C.money(o.cash) + '</div>' : '') + '</div></div>' +
        (o.kind ? '<p class="muted" style="font-size:12.5px;margin:10px 0 0">' + ({ sell: '우리가 하위권이라 상대는 즉시 전력을 원하고 유망주와 대가를 제시했습니다.', buy: '우리가 상위권이라 상대는 주전급 선수를 내주는 대신 우리 유망주와 대가를 원합니다.', mid: '서로 필요한 포지션을 맞추는 1:1 제안입니다 (등급 한 단계 차이).' })[o.kind] + '</p>' : '') +
        '<div class="sim-row" style="margin-top:12px"><button class="btn primary" data-offer="ok:' + o.id + '">수락</button><button class="btn ghost" data-offer="no:' + o.id + '">거절</button></div></section>';

        (mine ? '<span class="badge">우리가 방출</span>' : '<button class="btn sm' + (on ? ' primary' : '') + '" data-claim="' + p.id + '">' + (on ? '신청함 · 취소' : '영입 신청') + '</button>') + '</div>';

  function newsHTML() {

    let h = '<div class="wrap"><section class="card"><div class="card-h"><h2>이적시장</h2><span class="muted" style="font-size:12.5px">' + esc(team(S.user).name) + ' 선수 ' + LG.teamPlayers(S.league, S.user).length + '명 / 최대 ' + MK.MAX_ROSTER + '명</span></div><div class="tabs" role="tablist">' +
      tabs.map(([k, nm]) => '<button class="chip' + (ui.mktTab === k ? ' on' : '') + '" data-mkt="' + k + '" role="tab" aria-selected="' + (ui.mktTab === k) + '">' + nm + '</button>').join('') + '</div></section>';
    if (ui.mktTab === 'trade') h += tradeHTML();

    else h += newsHTML();
    return h + '</div>';

  }
  function milHTML() {
    if (!MI || !S.mil) return '<div class="wrap"><section class="card"><div class="empty">이 저장 파일에는 병역 정보가 없습니다. 새 게임을 시작해 주세요.</div></section></div>';

      '<div class="milsum"><div><b class="disp">' + need.length + '</b><span>미필</span></div><div><b class="disp">' + serving.filter((p) => p.serve.type === '상무').length + '</b><span>상무 복무</span></div><div><b class="disp">' + serving.filter((p) => p.serve.type === '현역').length + '</b><span>현역 복무</span></div><div><b class="disp">' + done + '</b><span>군필·면제</span></div></div>' +
      '<p class="muted" style="font-size:12.5px;margin:12px 0 0">미필 선수는 ' + MI.DEADLINE_AGE + '세가 되기 전에 입대해야 합니다. 상무는 지원해서 뽑혀야 하고(현재 능력 기준), 복무 중에도 퓨처스리그에서 뛰며 성장합니다. 현역은 경기를 못 뛰어 감각이 떨어집니다. 둘 다 18개월로, 겨울에 입대하면 다다음해 6월 시즌 중에 돌아옵니다. 입대 결정은 오프시즌 \'병역\' 단계에서 합니다. 아시안게임 금메달을 따면 대표팀의 미필 선수는 병역 특례를 받습니다.</p></section>';

      (serving.length ? '<div class="plist">' + serving.map((p) => { const f = p.fst; const rec = p.serve.type === '상무' && f && (f.pa || f.bf) ? (p.pr ? '퓨처스 ERA ' + C.era(f.er, f.outs) : '퓨처스 ' + C.avg3(f.h, f.ab)) : ''; return milRow(p, '<span class="muted">' + rec + '</span>'); }).join('') + '</div>' : '<div class="empty">복무 중인 선수가 없습니다.</div>') + '</section>';
    h += '<section class="card"><div class="card-h"><h2>미필 선수</h2><span class="muted" style="font-size:12.5px">나이 많은 순</span></div>' +
      (need.length ? '<div class="plist tall">' + need.map((p) => milRow(p, p.ent ? '<span class="badge">1군</span>' : '<span class="badge dimb">2군</span>')).join('') + '</div>' : '<div class="empty">미필 선수가 없습니다.</div>') + '</section></div>';
    const log = (S.mil.log || []).slice(0, 25);
    h += '<div class="stack"><section class="card"><div class="card-h"><h2>병역 소식</h2></div>' + (log.length ? '<div class="news">' + log.map((x) => '<div class="nw"><span class="d num">' + C.fmtDate(x.date) + '</span><span></span><span>' + esc(x.text) + '</span></div>').join('') + '</div>' : '<div class="empty">아직 소식이 없습니다.</div>') + '</section></div></div></div>';
    return h;
  }
  function offMilitary() {
    const m = S.off.mil, P = S.league.players;
    if (!m) return '';
    const list = m.list.map((id) => P[id]).filter((p) => p && p.team === S.user && p.army === 'need' && !p.serve);
    const sm = LG.teamPlayers(S.league, 'SM').length;
    let h = '<section class="card"><div class="fstat"><div><div class="eyebrow">병역</div><b class="disp" style="font-size:26px">미필 ' + list.length + '명</b><div class="muted" style="font-size:12.5px">이번 겨울 전역 복귀 ' + (m.discharged || 0) + '명 (리그 전체) · 상무 현재 ' + sm + '/' + MI.SANGMU_MAX + '명</div></div></div>' +
      '<p class="muted" style="font-size:12.5px;margin:12px 0 0">선수마다 상무 지원, 현역 입대, 미루기 중 하나를 고르세요. ' + MI.DEADLINE_AGE + '세 선수는 더 미룰 수 없습니다. 상무에서 떨어지면 ' + MI.DEADLINE_AGE + '세 선수는 현역으로 가고, 그보다 어린 선수는 내년으로 미뤄집니다. 입대한 선수는 18개월 뒤(다다음해 6월) 돌아옵니다.</p></section>';

      '<div class="chips-wrap"><button class="chip" data-mall="rec">추천대로</button><button class="chip" data-mall="상무">모두 상무 지원</button><button class="chip" data-mall="현역">모두 현역 입대</button><button class="chip" data-mall="미루기">모두 미루기</button></div>' +
      '<p class="muted" style="font-size:12.5px;margin:10px 0 0">추천: ' + MI.DEADLINE_AGE + '세는 합격 가능성이 있으면 상무, 아니면 현역 · 1~2년 남은 선수는 상무 합격이 유력하면 상무, 2군 선수면 현역 · 그 밖에는 미루기. ' + MI.DEADLINE_AGE + '세 선수는 \'모두 미루기\'를 골라도 추천대로 정해집니다. 아래에서 선수마다 바꿀 수 있습니다.</p></section>';
    h += '<section class="card"><div class="plist tall">';
    for (const p of list) {
      const forced = p.age >= MI.DEADLINE_AGE;
      const plan = p.milPlan || '미루기';
      h += '<div class="frow"><button class="prow" data-player="' + p.id + '"><span class="pr-n">' + esc(p.name) + (forced ? ' <span class="badge loss">입대 시한</span>' : '') + '</span>' + starsHTML(p.ca) + '<span class="pr-m muted">' + (p.pr ? (p.role === 'SP' ? '선발' : '구원') : LG.POS_SHORT[p.pos]) + ' · ' + p.age + '세 · ' + (p.ent ? '1군' : '2군') + ' · 상무 합격 가능성 ' + MI.sangmuChance(S, p) + '</span><span class="pr-r"></span></button>' +
        '<div class="frow-b">' + ['상무', '현역', '미루기'].map((k) => '<button class="chip' + (plan === k ? ' on' : '') + '" data-mplan="' + k + ':' + p.id + '"' + (k === '미루기' && forced ? ' disabled' : '') + '>' + (k === '상무' ? '상무 지원' : k === '현역' ? '현역 입대' : '미루기') + '</button>').join('') + '</div></div>';
    }
    return h + '</div></section>';
  }

  // ================= 개인 기록 =================
  const REC_COLS = {
    bat: [
      ['g', '경기', (s) => s.g], ['pa', '타석', (s) => s.pa], ['avg', '타율', (s) => s.ab ? s.h / s.ab : 0, (v) => C.avg3(v * 1000, 1000)],
      ['h', '안타', (s) => s.h], ['d', '2루타', (s) => s.d], ['hr', '홈런', (s) => s.hr], ['rbi', '타점', (s) => s.rbi], ['r', '득점', (s) => s.r],
      ['sb', '도루', (s) => s.sb], ['bb', '볼넷', (s) => s.bb], ['so', '삼진', (s) => s.so],
      ['obp', '출루율', (s) => SE.obp(s), (v) => C.avg3(v * 1000, 1000)], ['slg', '장타율', (s) => SE.slg(s), (v) => C.avg3(v * 1000, 1000)],
      ['ops', 'OPS', (s) => SE.obp(s) + SE.slg(s), (v) => v.toFixed(3).replace(/^0/, '')]
    ],
    pit: [
      ['pg', '경기', (s) => s.pg], ['gs', '선발', (s) => s.gs], ['w', '승', (s) => s.w], ['l', '패', (s) => s.l], ['sv', '세', (s) => s.sv], ['hld', '홀드', (s) => s.hld],
      ['outs', '이닝', (s) => s.outs, (v) => C.ipStr(v)], ['era', 'ERA', (s) => s.outs ? s.er * 27 / s.outs : 99, (v) => v >= 99 ? '-' : v.toFixed(2), 1],
      ['whip', 'WHIP', (s) => s.outs ? (s.ph + s.pbb) * 3 / s.outs : 99, (v) => v >= 99 ? '-' : v.toFixed(2), 1],
      ['pso', '삼진', (s) => s.pso], ['pbb', '볼넷', (s) => s.pbb], ['phr', '피홈런', (s) => s.phr], ['ph', '피안타', (s) => s.ph]
    ]
  };
  function recHTML() {
    const R = ui.rec, L = S.league, P = L.players;
    const cols = REC_COLS[R.kind];
    if (!cols.find((c) => c[0] === R.sort)) { R.sort = R.kind === 'bat' ? 'avg' : 'era'; R.dir = R.kind === 'bat' ? -1 : 1; }
    const col = cols.find((c) => c[0] === R.sort);
    const futLg = R.lg === 'fst' && !!L.fteams;
    const SK = futLg ? 'fst' : 'st';
    const tlist = futLg ? L.fteams : L.teams;
    const gp = {}; for (const t of tlist) gp[t.id] = t.rec.w + t.rec.l + t.rec.t;
    let rows = [];
    for (const id in P) {
      const p = P[id];
      if (!p.team || gp[p.team] == null || (R.kind === 'bat') === !!p.pr) continue;
      if (R.team !== 'all' && p.team !== R.team) continue;
      const s = p[SK];
      if (!s) continue;
      if (R.kind === 'bat' ? !s.pa : !s.bf) continue;
      if (R.qual && (R.kind === 'bat' ? s.pa < gp[p.team] * 3.1 : s.outs < gp[p.team] * 3)) continue;
      rows.push({ p, v: col[2](s) });
    }
    rows.sort((a, b) => (a.v - b.v) * R.dir || (b.p[SK].pa || b.p[SK].bf) - (a.p[SK].pa || a.p[SK].bf));
    const total = rows.length;
    rows = rows.slice(0, R.limit);
    if (R.team !== 'all' && gp[R.team] == null) R.team = 'all';
    const opts = '<option value="all"' + (R.team === 'all' ? ' selected' : '') + '>전체 ' + (futLg ? '팀' : '구단') + '</option>' + tlist.map((t) => '<option value="' + t.id + '"' + (R.team === t.id ? ' selected' : '') + '>' + esc(LG.teamName(t)) + '</option>').join('');
    let h = '<div class="wrap"><section class="card"><div class="card-h"><h2>' + L.year + ' 개인 기록</h2><span class="muted" style="font-size:12.5px">' + total + '명</span></div>' +
      '<div class="tabs" role="tablist" style="margin-bottom:10px">' + [['st', '1군 (KBO리그)'], ['fst', '퓨처스리그']].map(([k, n]) => '<button class="chip' + (R.lg === k ? ' on' : '') + '" data-reclg="' + k + '" role="tab" aria-selected="' + (R.lg === k) + '">' + n + '</button>').join('') + '</div>' +
      '<div class="bar-row"><div class="tabs" role="tablist">' + [['bat', '타자'], ['pit', '투수']].map(([k, n]) => '<button class="chip' + (R.kind === k ? ' on' : '') + '" data-reck="' + k + '" role="tab" aria-selected="' + (R.kind === k) + '">' + n + '</button>').join('') + '</div>' +
      '<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><select class="sel" id="recTeam" aria-label="구단">' + opts + '</select>' +
      '<label class="chk"><input type="checkbox" id="recQual"' + (R.qual ? ' checked' : '') + '> 규정 ' + (R.kind === 'bat' ? '타석' : '이닝') + ' 충족</label></div></div>' +
      '<p class="muted" style="font-size:12.5px;margin:10px 0 0">열 제목을 누르면 그 기록 순으로 정렬합니다. 규정: 팀 경기 수 × ' + (R.kind === 'bat' ? '3.1타석' : '1이닝') + '.</p></section>';
    h += '<section class="card"><div class="tbl-wrap"><table class="t rec"><thead><tr><th class="l sticky">#</th><th class="l sticky2">선수</th><th class="l">팀</th>' +
      cols.map((c) => '<th><button class="sort' + (c[0] === R.sort ? ' on' : '') + '" data-sort="' + c[0] + '">' + c[1] + (c[0] === R.sort ? (R.dir < 0 ? ' ▼' : ' ▲') : '') + '</button></th>').join('') + '</tr></thead><tbody>';
    rows.forEach((x, i) => {
      const s = x.p[SK];
      const tm = futLg ? fteamOf(x.p.team) : team(x.p.team);
      h += '<tr class="click' + (x.p.team === S.user ? ' me' : '') + '" data-player="' + x.p.id + '"><td class="l sticky">' + (i + 1) + '</td><td class="l txt sticky2">' + esc(x.p.name) + '</td><td class="l txt"><span class="tn-cell">' + patch(tm, 18) + '</span></td>' +
        cols.map((c) => { const v = c[2](s); return '<td' + (c[0] === R.sort ? ' class="hl"' : '') + '>' + (c[3] ? c[3](v) : v) + '</td>'; }).join('') + '</tr>';
    });
    if (!rows.length) h += '<tr><td colspan="20" class="empty">조건에 맞는 선수가 없습니다.</td></tr>';
    h += '</tbody></table></div>' + (total > R.limit ? '<div style="margin-top:12px;text-align:center"><button class="btn sm" data-recmore="1">더 보기 (' + (total - R.limit) + '명)</button></div>' : '') + '</section></div>';
    return h;
  }
  function orderP(t, p) {
    const r = t.rot.indexOf(p.id); if (r >= 0) return r;
    if (t.closer === p.id) return 10;
    const s = t.setup.indexOf(p.id); if (s >= 0) return 11 + s;
    return 20 + (20 - p.ca);
  }

  // ================= 일정 =================
  function userGames() {
    const out = [];

    return out;
  }

    }

  }

  const SPEED = { slow: 1500, normal: 750, fast: 220 };

  // ================= 진행 =================
  let running = false;
  function simRun(mode) {
    if (running || !S) return;
    running = true;
    const startPhase = S.phase;
    const startDate = SE.currentDate(S);
    const endDate = C.addDays(startDate, 7);
    const totalDays = S.sched.days.length;
    let steps = 0, showBusy = mode === 'season' || mode === 'post' || mode === 'week' || mode === 'pre' || mode === 'preall';
    const busy = $('#busy');
    if (showBusy) { busy.hidden = false; $('#busyT').textContent = mode === 'post' ? '포스트시즌 진행 중' : mode === 'pre' || mode === 'preall' ? '스프링캠프 진행 중' : '경기 진행 중'; }
    function stop() {
      running = false; busy.hidden = true; save(); render();
      if (view !== 'lobby') { /* 그대로 */ }
    }
    function step() {
      const t0 = performance.now();
      while (performance.now() - t0 < 40) {
        if (S.phase === 'done') return stop();
        if (mode === 'next') {
          const before = S.phase;
          const r = SE.advance(S);
          steps++;
          if (!r) return stop();
          if (r.kind === 'day') { const d = S.sched.days[S.dayIdx - 1]; if (d.games.some((g) => g.h === S.user || g.a === S.user)) return stop(); }
          if (r.kind === 'post') { const res = S.results[r.gid]; if (res.h === S.user || res.a === S.user) return stop(); if (steps > 0 && userOutOfPost()) return stop(); }
          if (r.kind === 'post-start' || (before === 'reg' && S.phase !== 'reg')) return stop();
          if (steps > 12) return stop();
        } else if (mode === 'week') {
          if (S.phase !== startPhase) return stop();
          if (SE.currentDate(S) >= endDate) return stop();
          SE.advance(S); steps++;
          if (S.phase !== 'reg') return stop();
        } else if (mode === 'season') {
          if (S.phase !== 'reg') return stop();
          SE.advance(S); steps++;
        } else if (mode === 'preweek') {
          OD.Camp.advanceWeek(S); return stop();
        } else if (mode === 'pre' || mode === 'preall') {
          if (S.phase !== 'pre') return stop();
          SE.advance(S); steps++;
          if (mode === 'pre' || S.phase !== 'pre') { if (S.phase === 'reg') { view = 'lobby'; toast(S.league.year + ' 정규시즌이 개막했습니다.'); } return stop(); }
        } else if (mode === 'post') {
          if (S.phase !== 'post') return stop();
          SE.advance(S); steps++;
        }
      }
      if (showBusy) {
        const frac = mode === 'pre' || mode === 'preall' ? Math.min(1, steps / 4) : mode === 'post' ? Math.min(1, steps / 20) : mode === 'week' ? Math.min(1, steps / 6) : S.dayIdx / totalDays;
        $('#busyBar').style.width = Math.round(frac * 100) + '%';
        $('#busyD').textContent = C.fmtDate(SE.currentDate(S), true);
      }
      setTimeout(step, 0);
    }
    setTimeout(step, 0);
  }

    if (d.amreg) { ui.amReg = d.amreg; keepScroll(render); return; }
    if (d.amlvl) { ui.amLvl = d.amlvl; ui.amReg = 'all'; keepScroll(render); return; }
    if (d.nav) { document.body.classList.remove('menu-open'); closeSheet(); view = navTarget(d.nav); ui.confirmNew = false; render(); window.scrollTo(0, 0); return; }
    if (d.sim) return simRun(d.sim);
    if (d.watch) return watchNext();
    if (d.live) {
      if (!live) return;
      const lv = d.live;
      if (lv === 'pause') { live.paused = true; if (live.timer) clearTimeout(live.timer); live.timer = null; liveDraw(); }
      else if (lv === 'play') { live.paused = false; liveTick(); }
      else if (lv === 'skip') { if (live.timer) clearTimeout(live.timer); live.i = S.logs[live.gid].length; live.timer = null; liveDraw(); }
      else if (lv === 'box') { const g = live.gid; stopLive(); ui.gtab = 'sum'; openSheet(gameSheet(g)); }
      else { setPref('liveSpeed', lv); liveDraw(); }
      return;
    }
    if (d.gtab) { const [k, g] = d.gtab.split(':'); ui.gtab = k; const sc = $('#sheet').scrollTop; openSheet(gameSheet(g)); $('#sheet').scrollTop = sc; return; }
    if (d.futtab) { ui.futTab = d.futtab; render(); return; }
    if (d.reck) { ui.rec.kind = d.reck; ui.rec.sort = ''; ui.rec.limit = 40; render(); return; }
    if (d.sort) { const R = ui.rec; if (R.sort === d.sort) R.dir = -R.dir; else { R.sort = d.sort; const c = REC_COLS[R.kind].find((x) => x[0] === d.sort); R.dir = c && c[4] ? 1 : -1; } render(); return; }
    if (d.recmore) { ui.rec.limit += 40; render(); return; }
    if (d.reclg) { ui.rec.lg = d.reclg; ui.rec.team = 'all'; ui.rec.limit = 40; render(); return; }
    if (d.futteam) { ui.futTeam = d.futteam; render(); window.scrollTo(0, 0); return; }
    if (d.mkt) { ui.mktTab = d.mkt; ui.sheetConfirm = null; render(); return; }
    if (d.tf) { const [k, v] = d.tf.split(':'); ui.trade[k] = v; render(); return; }
    if (d.tsel) {
      const [side, id] = d.tsel.split(':'); const n = Number(id); const arr = ui.trade[side];
      const i = arr.indexOf(n);
      if (i >= 0) arr.splice(i, 1); else if (arr.length < MK.MAX_SIDE) arr.push(n); else toast('한쪽에서 최대 ' + MK.MAX_SIDE + '명까지 고를 수 있습니다.');
      ui.trade.res = null; keepScroll(render); return;
    }
    if (d.tpk) {
      const i0 = d.tpk.indexOf(':'), side = d.tpk.slice(0, i0), key = d.tpk.slice(i0 + 1); const arr = ui.trade[side];
      const i = arr.indexOf(key);
      if (i >= 0) arr.splice(i, 1); else if (arr.length < MK.MAX_SIDE) arr.push(key); else toast('지명권은 한쪽에서 최대 ' + MK.MAX_SIDE + '장까지 고를 수 있습니다.');
      ui.trade.res = null; keepScroll(render); return;
    }
    if (d.tact) {
      const T = ui.trade;
      const pk = { give: T.pgive, get: T.pget };
      if (d.tact === 'clear') { T.give = []; T.get = []; T.pgive = []; T.pget = []; T.res = null; render(); }
      else if (d.tact === 'propose') { T.res = MK.evaluate(S, S.user, T.partner, T.give, T.get, today(), pk); keepScroll(render); }
      else if (d.tact === 'confirm') {
        const ev = MK.evaluate(S, S.user, T.partner, T.give, T.get, today(), pk);
        if (!ev.accept) { T.res = ev; render(); return; }
        MK.executeTrade(S, S.user, T.partner, T.give, T.get, today(), { a: T.pgive, b: T.pget });
        T.give = []; T.get = []; T.pgive = []; T.pget = []; T.res = null; save(); toast('트레이드가 성사됐습니다.'); render();
      }
      return;
    }
    if (d.offer) {
      const [k, id] = d.offer.split(':');
      if (k === 'ok') { const r = MK.acceptOffer(S, Number(id), today()); toast(r.ok ? '트레이드가 성사됐습니다.' : r.msg); }
      else { MK.declineOffer(S, Number(id)); toast('제안을 거절했습니다.'); }
      save(); render(); return;
    }
    if (d.claim) { MK.claimToggle(S, Number(d.claim)); save(); if (!$('#sheet').hidden) openSheet(playerSheet(d.claim)); render(); return; }
    if (d.uso) {
      const [k, id] = d.uso.split(':');
      if (k === 'ask') ui.sheetConfirm = 'uso:' + id;
      else if (k === 'no') ui.sheetConfirm = null;
      else { const r = MK.signFromUso(S, Number(id), today()); ui.sheetConfirm = null; toast(r.ok ? '영입했습니다. 이적료 ' + C.money(r.fee) : r.msg); save(); }
      if (!$('#sheet').hidden) { const sc = $('#sheet').scrollTop; openSheet(playerSheet(id)); $('#sheet').scrollTop = sc; }
      keepScroll(render); return;
    }
    if (d.pact) {
      const [k, id] = d.pact.split(':'); const n = Number(id); const P = S.league.players;
      if (k === 'give' || k === 'get') {
        const T = ui.trade;
        if (k === 'get' && T.partner !== P[n].team) { T.partner = P[n].team; T.get = []; }
        if (!T[k].includes(n) && T[k].length < MK.MAX_SIDE) T[k].push(n);
        T.res = null; closeSheet(); view = 'mkt'; ui.mktTab = 'trade'; render(); window.scrollTo(0, 0); return;
      }
      if (k === 'rel') ui.sheetConfirm = 'rel:' + n;
      else if (k === 'relno') ui.sheetConfirm = null;
      else if (k === 'relyes') { const r = MK.release(S, n, today()); ui.sheetConfirm = null; toast(r.ok ? '방출하고 웨이버 공시했습니다.' : r.msg); save(); render(); }
      if (view === 'off' && $('#sheet').hidden) { keepScroll(render); return; }
      const sc = $('#sheet').scrollTop; openSheet(playerSheet(n)); $('#sheet').scrollTop = sc; return;
    }
    if (d.off) {
      if (d.off === 'start') { OF.startOffseason(S); view = 'off'; }
      else { const r = OF.advanceStep(S); if (!r.ok) toast(r.msg || '넘어갈 수 없습니다'); else if (S.phase === 'reg' || S.phase === 'pre') { view = S.phase === 'pre' ? 'camp' : 'lobby'; toast(S.league.year + ' 시즌 준비를 시작합니다. 스프링캠프 계획을 세우세요.'); } }
      ui.faForm = null; ui.sheetConfirm = null; save(); render(); window.scrollTo(0, 0); return;
    }
    if (d.fa) {
      const [k, id] = d.fa.split(':');
      if (k === 'round') {
        const busy = $('#busy'); busy.hidden = false; $('#busyT').textContent = 'FA 협상 중'; $('#busyBar').style.width = '60%'; $('#busyD').textContent = '';
        setTimeout(() => { const res = OF.runFARound(S) || []; busy.hidden = true; ui.faForm = null; save(); render(); toast(res.length ? res.length + '명이 계약했습니다.' : '이번 라운드에는 계약한 선수가 없습니다.'); }, 30);
        return;
      }
      if (k === 'form') ui.faForm = Number(id);
      else if (k === 'close') ui.faForm = null;
      else if (k === 'cancel') { OF.cancelOffer(S, Number(id)); save(); }
      else if (k === 'send') {
        const yrs = Number($('#faYrs').value), aav = Math.round(parseFloat($('#faAav').value) * 10000);
        const r = OF.userOffer(S, Number(id), aav, yrs);
        if (!r.ok) { toast(r.msg); return; }
        ui.faForm = null; save(); toast('제안했습니다. 라운드를 마감하면 답이 나옵니다.');
      }
      keepScroll(render); return;
    }
    if (d.comp) { const [i, pid] = d.comp.split(':'); const r = OF.chooseComp(S, Number(i), Number(pid) || null); if (!r.ok && r.msg) toast(r.msg); save(); keepScroll(render); return; }
    if (d.fre) { const [k, id] = d.fre.split(':'); OF.decideForeign(S, Number(id), k); save(); keepScroll(render); return; }
    if (d.draft) {
      const [k, id] = d.draft.split(':');
      if (k === 'pick') { OF.draftPick(S, S.user, Number(id)); OF.draftAdvance(S, false); }
      else OF.draftAdvance(S, true);
      save(); keepScroll(render); return;
    }
    if (d.sal) { const [k, id] = d.sal.split(':'); const p = S.league.players[id]; const step = Math.max(500, Math.round(p.nsal * 0.05 / 100) * 100); const v = k === '+' ? p.nsal + step : Math.max(Math.ceil(p.sal * 0.75 / 100) * 100, p.nsal - step); OF.setUserSalary(S, Number(id), v); save(); keepScroll(render); return; }
    if (d.camp) {
      const i = d.camp.indexOf(':');
      const r = OD.Camp.setPlan(S, d.camp.slice(0, i), d.camp.slice(i + 1));
      if (!r.ok) toast(r.msg); else save();
      keepScroll(render); return;
    }
    if (d.coach) {
      const [k, id] = d.coach.split(':');
      if (k === 'role') { ui.coachRole = ui.coachRole === id ? null : id; ui.coachConfirm = null; }
      else if (k === 'ask') ui.coachConfirm = Number(id);
      else if (k === 'no') ui.coachConfirm = null;
      else { const r = FI.hireCoach(S, Number(id), today()); ui.coachConfirm = null; ui.coachRole = null; toast(r.ok ? '코치를 교체했습니다.' : r.msg); save(); }
      keepScroll(render); return;
    }
    if (d.fired) {
      if (d.fired === 'accept') { FI.acceptOffer(S); ui.sqTeam = S.user; save(); toast('새 구단 단장으로 취임했습니다.'); render(); window.scrollTo(0, 0); }
      else if (d.fired === 'new') { ui.firedConfirm = true; render(); }
      else if (d.fired === 'newno') { ui.firedConfirm = false; render(); }
      else if (d.fired === 'newyes') { ui.firedConfirm = false; clearSave(); S = null; showPick(); }
      return;
    }
    if (d.mall) { const m = S.off && S.off.mil; const n = m ? MI.setPlanAll(S, d.mall, m.list) : 0; toast(n + '명의 병역 계획을 정했습니다.'); save(); keepScroll(render); return; }
    if (d.mplan) { const [k, id] = d.mplan.split(':'); const r = MI.setPlan(S, Number(id), k); if (!r.ok && r.msg) toast(r.msg); save(); keepScroll(render); return; }
    if (d.roster) { ui.sheetConfirm = 'rel:' + d.roster; keepScroll(render); return; }
    if (d.gomkt) { view = 'mkt'; ui.mktTab = d.gomkt; if (d.amlvlGo) { ui.amLvl = d.amlvlGo; ui.amReg = 'all'; } render(); window.scrollTo(0, 0); return; }
    if (d.ff) { ui.fFilter = d.ff; render(); return; }
    if (d.nego) {
      const [k, id] = d.nego.split(':');
      if (k === 'open') ui.nego = Number(id);
      else if (k === 'no') ui.nego = null;
      else { const el2 = document.getElementById('nego-' + id); const r = MK.negotiate(S, Number(id), Number(el2 && el2.value), today()); toast(r.msg || (r.ok ? '' : '협상할 수 없습니다')); if (r.ok && (r.res === 'sign' || r.res === 'hijack' || r.res === 'walk')) ui.nego = null; save(); }
      if (!$('#sheet').hidden) { const sc = $('#sheet').scrollTop; openSheet(playerSheet(id)); $('#sheet').scrollTop = sc; }
      keepScroll(render); return;
    }
    if (d.hj) { const r = MK.hijackResolve(S, d.hj === '1', today()); toast(r.msg || ''); save(); if (!$('#sheet').hidden) closeSheet(); keepScroll(render); return; }
    if (d.fsign) {
      const [k, id] = d.fsign.split(':');
      if (k === 'ask') ui.sheetConfirm = 'fsign:' + id;
      else if (k === 'no') ui.sheetConfirm = null;
      else { const r = MK.signForeign(S, S.user, Number(id), today()); ui.sheetConfirm = null; toast(r.ok ? '계약했습니다.' : r.msg); save(); }
      if (!$('#sheet').hidden) { const sc = $('#sheet').scrollTop; openSheet(playerSheet(id)); $('#sheet').scrollTop = sc; }
      keepScroll(render); return;
    }
    if (d.hire) {
      const [k, id] = d.hire.split(':');
      if (k === 'ask') ui.mgrConfirm = Number(id);
      else if (k === 'no') ui.mgrConfirm = null;
      else { const r = MK.hireManager(S, Number(id), today()); ui.mgrConfirm = null; toast(r.ok ? '감독을 교체했습니다.' : r.msg); save(); }
      keepScroll(render); return;
    }
    if (d.inbox) { const m = S.msgs.find((x) => String(x.id) === d.inbox); if (m) { m.read = true; ui.openMsg = m.id; save(); } view = 'inbox'; render(); window.scrollTo(0, 0); return; }
    if (d.msg) { const m = S.msgs.find((x) => String(x.id) === d.msg); if (m) { m.read = true; ui.openMsg = ui.openMsg === m.id ? null : m.id; save(); render(); } return; }
    if (d.player) { ui.sheetConfirm = null; return openSheet(playerSheet(d.player)); }
    if (d.game) { ui.gtab = 'sum'; return openSheet(gameSheet(d.game)); }
    if (d.team) { ui.sqTeam = d.team; ui.sqTab = 'bat'; view = 'squad'; closeSheet(); render(); window.scrollTo(0, 0); return; }
    if (d.ldr) { const [k, v] = d.ldr.split(':'); if (k === 'bat') ui.ldrBat = v; else ui.ldrPit = v; render(); return; }
    if (d.tsort) {
      const [scope, k] = d.tsort.split(':'); ui.sorts = ui.sorts || {};
      const cur = ui.sorts[scope];
      if (k === 'reset') delete ui.sorts[scope];
      else ui.sorts[scope] = cur && cur.k === k ? { k, d: -cur.d } : { k, d: TEXT_KEYS[k] ? 1 : -1 };
      keepScroll(render); return;
    }
    if (d.sqtab) { ui.sqTab = d.sqtab; render(); return; }
    if (d.month) { ui.schMonth = d.month; render(); return; }
    switch (d.act) {
      case 'menu': document.body.classList.toggle('menu-open'); break;
      case 'menu-close': document.body.classList.remove('menu-open'); break;
      case 'pick-back': pick = null; showGate(); break;
      case 'pick-reroll': pick = null; showPick(); break;
      case 'pick-go': if (pick && pick.sel) { const tid = pick.sel; S = pick.S; S.diff = pick.diff || 'normal'; pick = null; SE.startCareer(S, tid); save(); view = 'lobby'; enterGame(); window.scrollTo(0, 0); } break;
      case 'sheet-close': closeSheet(); break;
      case 'new-ask': ui.confirmNew = true; render(); break;
      case 'new-no': ui.confirmNew = false; render(); break;
      case 'new-yes': ui.confirmNew = false; clearSave(); S = null; showPick(); break;
      case 'msgs-readall': { const n = S.msgs.filter((x) => !x.read).length; S.msgs.forEach((x) => { x.read = true; }); save(); keepScroll(render); if (n) toast('메시지 ' + n + '개를 모두 확인했습니다.'); break; }
      case 'export': exportSave(); break;
      case 'cloud-save': cloudPush(true).then((ok) => { if (ok) toast('계정에 저장했습니다.'); }); render(); break;
      case 'cloud-force': CL.conflict = null; cloudPush(true).then((ok) => { if (ok) toast('이 브라우저의 게임으로 계정 저장본을 바꿨습니다.'); }); break;
      case 'cloud-take': (async () => { try { const c = await cloudLoad(); if (c) { c.loadedFrom = CL.meta.t; CL.known = CL.meta.t; CL.conflict = null; S = c; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} view = 'lobby'; enterGame(); toast('계정에 저장된 게임을 불러왔습니다.'); } } catch (e) { toast('계정 저장본을 불러오지 못했습니다.'); } })(); break;
      case 'import': $('#setFile').click(); break;
      case 'to-gate': save(); S = null; showGate(); break;
    }
  });
  document.addEventListener('change', (e) => {
    if (e.target.id === 'sqTeam') { ui.sqTeam = e.target.value; render(); }
    if (e.target.id === 'tPartner') { ui.trade.partner = e.target.value; ui.trade.get = []; ui.trade.res = null; render(); }
    if (e.target.id === 'futTeam') { ui.futTeam = e.target.value; render(); }
    if (e.target.dataset && (e.target.dataset.sreg || e.target.dataset.slvl)) {
      const [k, i] = (e.target.dataset.sreg || e.target.dataset.slvl).split(':');
      if (e.target.dataset.sreg) MK.setScout(S, k, Number(i), e.target.value || null); else MK.setScout(S, k, Number(i), undefined, e.target.value);
      save(); keepScroll(render);
    }
    if (e.target.id === 'recTeam') { ui.rec.team = e.target.value; ui.rec.limit = 40; render(); }
    if (e.target.id === 'recQual') { ui.rec.qual = e.target.checked; ui.rec.limit = 40; render(); }
    if (e.target.id === 'gateFile' || e.target.id === 'setFile') {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      importFile(f, (ok) => { if (ok) { view = 'lobby'; enterGame(); toast('저장 파일을 불러왔습니다.'); } });
      e.target.value = '';
    }
  });
  $('#sheet').addEventListener('click', (e) => { if (e.target.id === 'sheet') closeSheet(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { if (!$('#sheet').hidden) closeSheet(); else document.body.classList.remove('menu-open'); }
  });

  showGate();
})();
</script>

</body>
</html>
